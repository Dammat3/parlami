<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parlami – il tuo tutor di lingue</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3446E8">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Parlami">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EBF4; --surface:#FFFFFF; --surface-2:#F2F4FA; --ink:#1A1D3A; --muted:#5B6185; --line:#D3D8EA;
  --primary:#3446E8; --primary-ink:#FFFFFF; --primary-soft:#E2E6FF;
  --sun:#FFC53D; --sun-ink:#3A2A00;
  --ok:#0F8A63; --ok-bg:#DCF4EA; --bad:#CC2F3D; --bad-bg:#FCE4E6;
  --r-lg:24px; --r:14px; --r-sm:9px;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11132A; --surface:#1B1E3C; --surface-2:#242850; --ink:#ECEEFF; --muted:#A4A9D0; --line:#30366A;
    --primary:#8391FF; --primary-ink:#0D0F2E; --primary-soft:#2A3070;
    --sun:#FFD166; --sun-ink:#2B2000;
    --ok:#43D39E; --ok-bg:#103A2D; --bad:#FF7480; --bad-bg:#3F1A23;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
    --bg:#11132A; --surface:#1B1E3C; --surface-2:#242850; --ink:#ECEEFF; --muted:#A4A9D0; --line:#30366A;
    --primary:#8391FF; --primary-ink:#0D0F2E; --primary-soft:#2A3070;
    --sun:#FFD166; --sun-ink:#2B2000;
    --ok:#43D39E; --ok-bg:#103A2D; --bad:#FF7480; --bad-bg:#3F1A23;
    color-scheme: dark;
}
*{box-sizing:border-box}
/* Comportamento da app: niente rimbalzo elastico, niente spostamento laterale, niente zoom col doppio tocco */
html,body{overscroll-behavior:none;overflow-x:clip;max-width:100%}
body{touch-action:manipulation;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.main{overflow-x:clip;min-width:0}
@media (display-mode: standalone){ body{-webkit-user-select:none;user-select:none} input,textarea,.story,.reading,.lyrics,.storytext,.fbub{-webkit-user-select:text;user-select:text} }
/* Su iPhone i campi con scritte sotto i 16px fanno zoomare la pagina: li porto a 16px */
@media (max-width:820px){ input,select,textarea{font-size:16px !important} }
[hidden]{display:none!important}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,4vw,2.6rem);font-weight:800}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.1rem;font-weight:600}
p{margin:0 0 .8em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.main:focus{outline:none}
a{color:var(--primary)}
a.btn,a.chip,a.action,a.lvl{text-decoration:none}
.notice a{color:inherit}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* Layout */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:28px 16px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:1.6rem;padding:0 12px 22px;display:flex;align-items:center;gap:10px}
.brand-dot{width:30px;height:30px;border-radius:50%;background:var(--primary);position:relative}
.brand-dot::after{content:"";position:absolute;width:12px;height:6px;border-radius:0 0 8px 8px;background:var(--sun);left:9px;top:16px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r);color:var(--muted);text-decoration:none;font-weight:700}
.nav a svg{width:22px;height:22px;flex:none}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.active{background:var(--primary-soft);color:var(--primary)}
.rail-foot{margin-top:auto;padding:12px;display:flex;gap:16px;font-weight:700}
.main{padding:36px clamp(16px,4vw,48px) 60px;max-width:1040px;width:100%}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);background:var(--surface);z-index:20}
  .brand,.rail-foot{display:none}
  .nav{display:flex;width:100%;justify-content:space-between;overflow-x:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{flex:1 0 54px}
  .nav a{flex-direction:column;gap:2px;font-size:.62rem;padding:6px 2px;min-width:0}
  .nav a svg{width:20px;height:20px}
  .main{padding:22px 16px calc(96px + env(safe-area-inset-bottom,0px))}
}

/* Surfaces */
.panel{background:var(--surface);border-radius:var(--r-lg);padding:22px;border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:700;background:var(--primary);color:var(--primary-ink);display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:46px}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.sm{padding:7px 14px;min-height:36px;font-size:.92rem}
.btn svg{width:20px;height:20px}
.iconbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:50%;width:40px;height:40px;display:inline-grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.95rem}
.field input,.field select,textarea.input,input.input,select.input{border:1.5px solid var(--line);border-radius:var(--r);padding:11px 14px;background:var(--surface-2);font-weight:400;width:100%}
.field input:focus,.field select:focus,.input:focus{outline:none;border-color:var(--primary)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:.88rem;font-weight:700}
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.notice{border-radius:var(--r);padding:14px 16px;background:var(--sun);color:var(--sun-ink);font-weight:700}
.err{border-radius:var(--r);padding:14px 16px;background:var(--bad-bg);color:var(--bad);font-weight:700}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--primary);animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;gap:12px;align-items:center;padding:30px;justify-content:center;color:var(--muted);font-weight:700}

/* Avatar */
.avatar{display:block}
.avatar .eye{animation:blink 5s infinite;transform-origin:center;transform-box:fill-box}
.avatar .mouth{transform-origin:center;transform-box:fill-box;transition:transform .1s}
.avatar.talking .mouth{animation:talk .16s infinite alternate}
.avatar.listening .ring{opacity:1;animation:pulse 1.2s infinite}
.avatar .ring{opacity:0}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.25)}}
@keyframes pulse{0%{stroke-width:2}50%{stroke-width:8}100%{stroke-width:2}}

/* Home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.hero .bubble{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);border-bottom-left-radius:6px;padding:20px 22px;font-size:1.15rem}
@media (max-width:600px){.hero{grid-template-columns:1fr;justify-items:start}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{font-family:var(--display);font-size:1.7rem;display:block;line-height:1.1}
.action{display:flex;gap:16px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;color:var(--ink)}
.action:hover{border-color:var(--primary)}
.action .ic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;flex:none;background:var(--primary-soft);color:var(--primary)}
.action .ic svg{width:26px;height:26px}
.action h3{margin:0 0 2px}

/* Lessons path */
.path{display:flex;flex-direction:column;gap:12px}
.unit{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 18px;text-align:left;width:100%;color:var(--ink)}
.unit:hover{border-color:var(--primary)}
.unit .num{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--surface-2);border:2px solid var(--line);flex:none}
.unit.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.unit.next .num{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.unit .meta{flex:1}
.unit h3{margin:0}

/* Level picker */
.levels{display:flex;gap:14px 22px;flex-wrap:wrap;margin-top:16px}
.area{display:flex;flex-direction:column;gap:6px}
.area-name{font-size:.85rem;font-weight:700;color:var(--muted)}
.lvl{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:68px;padding:8px 12px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;position:relative;line-height:1.2}
.lvl b{font-family:var(--display);font-size:1.25rem}
.lvl span{font-size:.78rem;color:var(--muted)}
.lvl i{position:absolute;top:2px;right:6px;font-style:normal;color:var(--sun);font-size:.85rem}
.lvl.on{border-color:var(--primary);background:var(--primary-soft)}
.lvl:hover{border-color:var(--primary)}

/* Exams */
.reading{background:var(--surface-2);border-radius:var(--r);padding:16px 18px;max-height:60vh;overflow-y:auto;line-height:1.65}
.reading p{max-width:70ch}
.mcq{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0}
.mcq legend{padding:0 4px}
.mopt{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer}
.mopt input{margin-top:4px}
.mopt.right{background:var(--ok-bg)}
.mopt.wrong{background:var(--bad-bg)}
.taskbox{background:var(--surface-2);border-left:4px solid var(--primary);border-radius:8px;padding:12px 16px}
.verdict.great,.verdict.pass{border-color:var(--ok)}
.verdict.close{border-color:var(--sun)}
.verdict.fail{border-color:var(--bad)}
.verdict{border-width:2px}
.story{font-size:1.25rem;line-height:1.55}
/* Kids */
.kids{background:linear-gradient(180deg,var(--surface),var(--surface-2));position:relative;overflow:hidden}
.kq{text-align:center;margin-bottom:14px}
.kemoji{font-size:clamp(5rem,18vw,8rem);line-height:1.1;text-align:center}
.kemoji.sm{font-size:clamp(2.6rem,9vw,3.6rem)}
.kcount{font-size:clamp(2rem,7vw,3rem);line-height:1.4;max-width:520px;margin:0 auto}
.kopts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kopt{min-height:84px;border:3px solid var(--line);border-bottom-width:6px;border-radius:20px;background:var(--surface);font-weight:700}
.kopt:hover{border-color:var(--primary)}
.kopt.right{border-color:var(--ok);background:var(--ok-bg)}
.kopt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.kword{font-family:var(--display);font-size:1.4rem}
.tok.big{font-size:1.5rem;padding:10px 16px;min-width:48px}
.cheer{position:absolute;inset:0;pointer-events:none}
.cheer span{position:absolute;left:50%;top:45%;font-size:2rem;animation:pop 1s ease-out forwards;--a:calc(var(--d) * 51deg)}
@keyframes pop{0%{transform:translate(-50%,-50%) rotate(var(--a)) translateY(0) scale(.4);opacity:1}100%{transform:translate(-50%,-50%) rotate(var(--a)) translateY(-130px) scale(1.2);opacity:0}}
.kstars{font-size:3rem;letter-spacing:6px;color:var(--sun)}
.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:520px){.memory{grid-template-columns:repeat(3,1fr)}}
.mcard{aspect-ratio:3/4;border:3px solid var(--line);border-radius:16px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;padding:4px}
.mcard .front{display:none}
.mcard.up{background:var(--surface);color:var(--ink)}
.mcard.up .front{display:block}.mcard.up .back{display:none}
.mcard .back{font-family:var(--display);font-size:2rem;font-weight:800}
.mcard.done{border-color:var(--ok);background:var(--ok-bg)}
.mcard .kword{font-size:1.05rem;word-break:break-word}
.hang{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0;font-family:var(--display);font-size:2rem;font-weight:800}
.hang span{min-width:1.1em;border-bottom:3px solid var(--ink);text-align:center}
.keys{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.key{min-width:46px;height:46px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font-weight:800;font-size:1.15rem}
.key.hit{background:var(--ok-bg);border-color:var(--ok)}
.key.miss{background:var(--bad-bg);border-color:var(--bad)}
.balloon{font-size:4.5rem;transform:scale(var(--s));transition:transform .3s;line-height:1}
.action.kid .ic{background:var(--sun);color:var(--sun-ink)}

/* Games 2 */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 14px;position:relative}
.hud-t{flex:1;min-width:140px}
.hud-s b{font-family:var(--display);font-size:1.3rem}
.hud-c{font-weight:800;color:var(--primary);min-width:70px}
.hud-c.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.35)}}
.hud-time{flex-basis:100%;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hud-time i{display:block;height:100%;width:100%;background:var(--ok);transition:width .1s linear}
.hud-time i.low{background:var(--bad)}
.stage-area{position:relative;margin-top:12px}
.stage-panel{position:relative;overflow:hidden}
.floatpts{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:1.8rem;color:var(--ok);pointer-events:none;animation:floatup .9s ease-out forwards;z-index:5}
.floatpts.bad{color:var(--bad)}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-70px) scale(1.2)}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.2s var(--d) ease-in forwards;transform:rotate(var(--r))}
@keyframes fall{to{transform:translateY(520px) rotate(calc(var(--r) + 540deg));opacity:.2}}
.pair.match{border-color:var(--ok);background:var(--ok-bg)}
.pair.defn{font-weight:400;font-size:.95rem;text-align:left}
.options.cols6{grid-template-columns:1fr 1fr}
.kopts.cols6,.kopts.cols3{grid-template-columns:repeat(3,1fr)}
@media (max-width:520px){.kopts.cols6{grid-template-columns:1fr 1fr}.kopts.cols3{grid-template-columns:1fr 1fr 1fr}}
.lifebar{height:10px;max-width:260px;margin:0 auto;border-radius:99px;background:var(--surface-2);overflow:hidden}
.lifebar i{display:block;height:100%;background:var(--ok)}
.gprog{display:flex;gap:8px;align-items:center;margin-top:8px}
.stagemap{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;margin-top:16px}
.stage{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:20px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);color:var(--ink)}
.stage b{font-family:var(--display);font-size:1.6rem}
.stage .sst i{font-style:normal;color:var(--line);font-size:1.05rem}
.stage .sst i.on{color:var(--sun)}
.stage.next{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.stage.perfect{background:var(--ok-bg);border-color:var(--ok)}
.stage.locked{opacity:.5;cursor:not-allowed}
.stage:not(.locked):hover{transform:translateY(-2px)}
.bigstars{display:flex;gap:10px;font-size:3.4rem;line-height:1}
.bigstars span{color:var(--line);transform:scale(.4);animation:starin .45s calc(var(--i)*.25s) forwards}
.bigstars span.on{color:var(--sun)}
@keyframes starin{to{transform:scale(1)}}
.sticker-new{background:var(--sun);color:var(--sun-ink);border-radius:var(--r);padding:10px 16px;font-weight:800;display:flex;align-items:center;gap:10px}
.sticker-new span{font-size:2.4rem;animation:bump .6s 2}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;margin-top:16px}
.album .slot{aspect-ratio:1;border-radius:18px;border:2px dashed var(--line);display:grid;place-items:center;font-size:2.4rem;color:var(--muted);font-family:var(--display);font-weight:800}
.album .slot.got{border-style:solid;border-color:var(--sun);background:var(--surface)}
.memory.cols3{grid-template-columns:repeat(3,1fr)}

/* Kids area */
.kids-hero{display:flex;align-items:center;gap:16px;margin:4px 0 16px}
.kidavatar{width:76px;height:76px;border-radius:50%;border:3px solid var(--sun);background:var(--surface);font-size:2.6rem;display:grid;place-items:center;flex:none}
.mission{border:2px solid var(--sun)}
.mtasks{display:grid;gap:8px;margin-top:12px}
.mtask{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:var(--r);background:var(--surface-2);color:var(--ink);text-decoration:none}
.mtask .me{font-size:1.6rem}
.mtask.ok{background:var(--ok-bg)}
.ktiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin-top:16px}
.ktile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;border-radius:24px;border:3px solid var(--line);border-bottom-width:6px;background:var(--surface);color:var(--ink);text-decoration:none;text-align:center;font-family:var(--display);font-size:1.05rem}
.ktile:hover{border-color:var(--primary);transform:translateY(-2px)}
.ktile .ke{font-size:3rem;line-height:1.1}
.ktile.dim{opacity:.7}
.kidpick{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:20px}
.kidcard{display:flex;flex-direction:column;align-items:center;gap:6px;width:140px;padding:18px;border-radius:24px;border:3px solid var(--line);border-bottom-width:6px;background:var(--surface);font-family:var(--display);font-size:1.2rem}
.kidcard span{font-size:3.6rem}
.kidcard:hover{border-color:var(--primary)}
.vocgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:16px}
.voccard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border-radius:20px;border:3px solid var(--line);border-bottom-width:6px;background:var(--surface)}
.pop{animation:popk .5s}
@keyframes popk{40%{transform:scale(1.12) rotate(-3deg)}}
.abcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin-top:16px}
.abc{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:18px;border:3px solid var(--line);border-bottom-width:6px;background:var(--surface)}
.abc b{font-family:var(--display);font-size:2rem;line-height:1}
.abc small{font-size:1.2rem;margin-left:4px;color:var(--muted)}
.abc span{font-size:1.6rem}

.sky{position:relative;height:440px;overflow:hidden;background:linear-gradient(#bfe3ff,#eef8ff);padding:0}

.balloon-b{position:absolute;bottom:-130px;width:88px;height:106px;border:0;border-radius:50% 50% 46% 46%;background:hsl(var(--hue) 80% 66%);box-shadow:inset -10px -12px 0 rgba(0,0,0,.08);animation:rise var(--dur) linear var(--delay) forwards;display:grid;place-items:center;cursor:pointer}

.bingo{display:grid;gap:10px;max-width:420px;margin:0 auto}
.bingo.cols2{grid-template-columns:repeat(2,1fr)}.bingo.cols3{grid-template-columns:repeat(3,1fr)}
.bcell{aspect-ratio:1;border-radius:20px;border:3px solid var(--line);border-bottom-width:6px;background:var(--surface);position:relative}

.duocard h3{margin-bottom:8px}
.palette{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:16px}
.swatch{width:56px;height:56px;border-radius:50%;border:4px solid var(--line)}
.swatch.on{border-color:var(--ink);transform:scale(1.15)}
.colgrid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.coltile{width:110px;height:110px;border-radius:24px;border:3px solid var(--line);background:var(--surface-2);filter:grayscale(1);transition:background .2s}
.coltile.painted{filter:none}
.orso-wrap{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media (max-width:640px){.orso-wrap{grid-template-columns:1fr;justify-items:center}}
.orso{position:relative;width:220px;height:250px}
.teddy{position:absolute;left:50%;top:30px;transform:translateX(-50%);font-size:150px;line-height:1}
.worn{position:absolute;left:50%;transform:translateX(-50%);line-height:1;animation:popk .5s}
.s-head{top:-6px;font-size:68px}.s-eyes{top:66px;font-size:48px}.s-neck{top:118px;font-size:44px}.s-body{top:132px;font-size:66px}
.s-legs{top:182px;font-size:48px}.s-feet{top:214px;font-size:38px}.s-hands{top:150px;font-size:36px;left:16%}
.wardrobe{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.witem{width:80px;height:80px;border-radius:18px;border:3px solid var(--line);border-bottom-width:5px;background:var(--surface)}
.witem.used{opacity:.4}
.sortitems{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:60px;margin-bottom:16px}
.sitem{border:3px solid var(--line);border-bottom-width:5px;border-radius:16px;background:var(--surface);padding:8px 14px;font-size:1.1rem}
.sitem span{font-size:1.5rem}
.sitem.sel{border-color:var(--primary);background:var(--primary-soft)}
.sortboxes{display:grid;gap:12px}
.sortboxes.cols2{grid-template-columns:1fr 1fr}.sortboxes.cols3{grid-template-columns:repeat(3,1fr)}.sortboxes.cols4{grid-template-columns:repeat(2,1fr)}
.sbox{border:3px dashed var(--primary);border-radius:22px;background:var(--surface-2);padding:14px 8px;min-height:120px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--display);font-size:1.1rem}
.sbe{font-size:2.4rem}
.sbin{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;font-size:1.3rem}
.sbin i{font-style:normal}
.scenes{display:grid;gap:12px}
.scenes.cols2{grid-template-columns:1fr 1fr}.scenes.cols3{grid-template-columns:repeat(3,1fr)}.scenes.cols4{grid-template-columns:repeat(2,1fr)}
.scenebtn{border:3px solid var(--line);border-bottom-width:6px;border-radius:20px;background:var(--surface);padding:6px}
.scenebtn.right{border-color:var(--ok);background:var(--ok-bg)}.scenebtn.wrong{border-color:var(--bad);background:var(--bad-bg)}
.scene-tile{position:relative;display:block;width:100%;aspect-ratio:1;max-height:180px;margin:0 auto}
.scene-tile .sc-obj,.scene-tile .sc-ani{position:absolute;left:50%;transform:translateX(-50%);line-height:1}
.sc-obj{font-size:4rem}.sc-ani{font-size:2.8rem}
.p-on .sc-obj{bottom:6%}.p-on .sc-ani{bottom:52%}
.p-under .sc-obj{bottom:46%}.p-under .sc-ani{bottom:4%}
.p-in .sc-obj{bottom:8%;z-index:2}.p-in .sc-ani{bottom:26%;font-size:2.2rem;z-index:1}
.p-next .sc-obj{bottom:12%;left:32%}.p-next .sc-ani{bottom:12%;left:74%}
.p-behind .sc-obj{bottom:8%;z-index:2;font-size:4.4rem}.p-behind .sc-ani{bottom:34%;left:62%;font-size:2.2rem;z-index:1}
.p-front .sc-obj{bottom:30%;font-size:3.4rem;z-index:1}.p-front .sc-ani{bottom:4%;font-size:3.2rem;z-index:2}
.cwrap{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:flex-start}
.cgrid{display:grid;gap:3px}
.cblank{aspect-ratio:1}
.ccell{position:relative;aspect-ratio:1;background:var(--surface);border:2px solid var(--ink);border-radius:6px}
.ccell i{position:absolute;top:1px;left:3px;font-size:.62rem;font-style:normal;font-weight:800}
.ccell input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-family:var(--display);font-size:1.3rem;font-weight:800;text-transform:uppercase;padding:0;color:var(--ink)}
.ccell input:focus{outline:none;background:var(--primary-soft)}
.ccell.good{background:var(--ok-bg)}.ccell.bad{background:var(--bad-bg)}
.clues{display:flex;flex-direction:column;gap:6px;min-width:200px}
.clue{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:4px 10px;text-align:left}
.clue svg{width:18px;height:18px;color:var(--primary)}

/* Tutor missions + tools */
.tutor > section.panel{position:relative;overflow:hidden}
.goals{width:100%;text-align:left;display:flex;flex-direction:column;gap:4px}
.goal{font-size:.92rem;padding:4px 8px;border-radius:8px;background:var(--surface-2)}
.goal.ok{background:var(--ok-bg);font-weight:700}
.misrep{align-self:stretch;background:var(--surface-2);border:2px solid var(--sun);border-radius:18px;padding:12px 16px}
.memo summary{list-style:none}
.studytext p.cur,.rline.cur{background:var(--primary-soft);border-radius:8px}
.vw{border:0;background:var(--sun);color:var(--sun-ink);border-radius:6px;padding:0 4px;font:inherit;font-weight:700;cursor:pointer}
.rline{margin:0;padding:6px 10px;border-radius:8px;cursor:pointer}
.fcat summary{cursor:pointer;display:flex;align-items:center;gap:10px;list-style:none}
.phr{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.phr .ptxt{font-size:1.1rem}

.cklog{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow-y:auto}
.ckrow{font-size:.92rem;padding:4px 8px;border-radius:8px;background:var(--surface-2)}
.ckrow.ok{background:var(--ok-bg)}.ckrow.bad{background:var(--bad-bg);color:var(--bad)}

/* Exercise */
.progress{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress > i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.ex-type{font-weight:700;color:var(--primary)}
.ex-q{font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1.25;margin:4px 0 18px}
.options{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:13px 16px;text-align:left;font-weight:700}
.opt:hover{border-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.tokens{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:8px;border-radius:var(--r);border:2px dashed var(--line)}
.tokens.bank{border-style:solid;border-color:transparent;padding:8px 0}
.tok{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:7px 13px;font-weight:700}
.tok.used{visibility:hidden}
.feedback{border-radius:var(--r-lg);padding:16px 18px;margin-top:18px}
.feedback.good{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.feedback p{color:var(--ink);font-weight:400}
.feedback h3{margin-bottom:.3em}
.words .w{padding:2px 4px;border-radius:6px;font-weight:700}
.words .w.ok{background:var(--ok-bg);color:var(--ok)}
.words .w.miss{background:var(--bad-bg);color:var(--bad);text-decoration:underline wavy}
.bigsent{font-family:var(--display);font-size:clamp(1.4rem,3.4vw,2rem);font-weight:600;line-height:1.3}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;box-shadow:0 0 0 0 var(--primary-soft)}
.mic svg{width:34px;height:34px}
.mic.on{background:var(--bad);color:#fff;animation:micpulse 1.2s infinite}
@keyframes micpulse{0%{box-shadow:0 0 0 0 var(--bad-bg)}100%{box-shadow:0 0 0 18px transparent}}
.score{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1}

/* Vocab cards in lesson */
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.vcard{background:var(--surface-2);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.vcard b{display:block}

/* Tutor chat */
.tutor{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
@media (max-width:900px){.tutor{grid-template-columns:1fr}}
.tutor-side{position:sticky;top:20px;text-align:center}
.chat{display:flex;flex-direction:column;gap:12px;min-height:300px;max-height:58vh;overflow-y:auto;padding:4px}
.msg{max-width:85%;padding:12px 16px;border-radius:20px}
.msg.t{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.u{align-self:flex-end;background:var(--primary);color:var(--primary-ink);border-bottom-right-radius:6px}
.msg .tr{font-size:.9rem;color:var(--muted);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.corr{align-self:flex-end;max-width:85%;background:var(--sun);color:var(--sun-ink);border-radius:16px;padding:10px 14px;font-size:.95rem}
.corr s{opacity:.75}
.corr .ok{font-weight:700}
.composer{display:flex;gap:10px;align-items:flex-end;margin-top:14px}
.composer textarea{flex:1;resize:none;min-height:52px;max-height:140px}
.composer .mic{width:54px;height:54px}
.composer .mic svg{width:24px;height:24px}

/* Games */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:var(--r);padding:14px;font-weight:700;min-height:56px}
.pair.sel{border-color:var(--primary);background:var(--primary-soft)}
.pair.gone{opacity:.35;pointer-events:none;border-color:var(--ok);background:var(--ok-bg)}
.pair.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sprint-card{text-align:center;padding:40px 20px}
.sprint-card .w{font-family:var(--display);font-size:2.2rem;font-weight:800}
.timer{font-family:var(--display);font-weight:800;font-size:1.3rem}

/* Flashcards */
.flash{min-height:220px;display:grid;place-items:center;text-align:center;cursor:pointer;user-select:none}
.flash .w{font-family:var(--display);font-size:2.2rem;font-weight:800}
table.list{width:100%;border-collapse:collapse}
table.list td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}

.prov{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.prov.off{opacity:.6}
.prov .head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.prov .field input{background:var(--surface)}
.status-ok{color:var(--ok);font-weight:700}
.status-bad{color:var(--bad);font-weight:700}
.updbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:60;background:var(--sun);color:var(--sun-ink);border-radius:999px;padding:8px 8px 8px 18px;display:flex;gap:12px;align-items:center;font-weight:700;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.updbar[hidden]{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:50;opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
@media (max-width:820px){.toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

/* Porta i dati delle versioni precedenti al formato attuale */
function migrate(s){
  const st = {...structuredClone(DEFAULT_STATE), ...s, settings:{...DEFAULT_STATE.settings, ...(s.settings||{})}};
  const set = st.settings;
  if(!Array.isArray(set.providers)){
    set.providers = [{id:uid(), preset:"freellmapi", name:PRESETS.freellmapi.name, base:set.apiBase || PRESETS.freellmapi.base, key:set.apiKey || "", model:set.model || "auto", on:true}];
  }
  delete set.apiBase; delete set.apiKey; delete set.model;
  for(const p of set.providers){ if(!p.manual && p.preset!=="freellmapi" && p.preset!=="custom" && (REASONING.test(p.model||"") || SKIP_MODELS.test(p.model||"") || SMALL_MODELS.test(p.model||""))) p.model = ""; }
  // Toglie i pacchetti di parole salvati con traduzioni sbagliate (uguali alla parola straniera)
  const latin = t => /^[\p{Script=Latin}\p{N}\s'’\-.,;:!?()«»“”"/…]+$/u.test(String(t||"").trim()) && /\p{L}/u.test(String(t||""));
  for(const [k, list] of Object.entries(st.wordBank || {})){
    if(!Array.isArray(list)){ delete st.wordBank[k]; continue; }
    const ok = list.filter(w => w && latin(w.translation) && String(w.word).trim().toLowerCase() !== String(w.translation).trim().toLowerCase());
    if(ok.length < 8 || ok.length < list.length*0.75) delete st.wordBank[k]; else st.wordBank[k] = ok;
  }
  return st;
}

function norm(s){
  return String(s||"").toLowerCase().normalize("NFC")
    .replace(/[’`´]/g,"'")
    .replace(/[.,!?;:¿¡"“”«»()\[\]…–—\-、。，！？「」]/g," ")
    .replace(/\s+/g," ").trim();
}
function bare(s){ return norm(s).normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function tokens(s, lang=S().lang){
  const n = norm(s);

  return n.split(" ").filter(Boolean);
}

/* Numeri scritti in lettere: così "twenty-one" e "21" contano come la stessa parola */
const NUMWORDS = (() => {
  const src = {
    en:"zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty|thirty:30 forty:40 fifty:50 sixty:60 seventy:70 eighty:80 ninety:90 hundred:100",
    it:"zero uno due tre quattro cinque sei sette otto nove dieci undici dodici tredici quattordici quindici sedici diciassette diciotto diciannove venti|una:1 trenta:30 quaranta:40 cinquanta:50 sessanta:60 settanta:70 ottanta:80 novanta:90 cento:100",

    fr:"zero un deux trois quatre cinq six sept huit neuf dix onze douze treize quatorze quinze seize|une:1 vingt:20 trente:30 quarante:40 cinquante:50 soixante:60 cent:100",
    de:"null eins zwei drei vier funf sechs sieben acht neun zehn elf zwolf dreizehn vierzehn funfzehn sechzehn siebzehn achtzehn neunzehn zwanzig|ein:1 eine:1 dreißig:30 dreissig:30 vierzig:40 funfzig:50 sechzig:60 siebzig:70 achtzig:80 neunzig:90 hundert:100",
    pt:"zero um dois tres quatro cinco seis sete oito nove dez onze doze treze catorze quinze dezesseis dezessete dezoito dezenove vinte|uma:1 duas:2 quatorze:14 dezasseis:16 dezassete:17 dezanove:19 trinta:30 quarenta:40 cinquenta:50 sessenta:60 setenta:70 oitenta:80 noventa:90 cem:100 cento:100",
    nl:"nul een twee drie vier vijf zes zeven acht negen tien elf twaalf dertien veertien vijftien zestien zeventien achttien negentien twintig|dertig:30 veertig:40 vijftig:50 zestig:60 zeventig:70 tachtig:80 negentig:90 honderd:100"
  };
  const out = {};
  for(const [lang, str] of Object.entries(src)){
    const [seq, extra] = str.split("|"); const m = {};
    seq.split(" ").forEach((w,i)=>{ m[w] = i; });
    (extra||"").split(" ").filter(Boolean).forEach(x=>{ const [w,n] = x.split(":"); m[w] = +n; });
    out[lang] = m;
  }
  return out;
})();
/* Parole con la loro "chiave" di confronto (senza accenti, numeri in cifre) */
function keyed(text, lang){
  const nw = NUMWORDS[lang] || {}, out = [];
  for(const w of tokens(text, lang)){
    const b = bare(w), isWord = nw[b] !== undefined;
    const k = isWord ? String(nw[b]) : b;
    const prev = out[out.length-1];
    if(isWord && prev && prev.numWord){
      const pv = +prev.k, cv = +k;
      if(pv >= 10 && pv % 10 === 0 && cv > 0 && cv < 10){ prev.k = String(pv+cv); prev.w += " " + w; continue; }
    }
    out.push({w, k, numWord:isWord});
  }
  return out;
}
function align(target, heard, lang=S().lang){
  const ta = keyed(target, lang), tb = keyed(heard, lang);
  const a = ta.map(x=>x.w), A = ta.map(x=>x.k), B = tb.map(x=>x.k);
  const b = B;
  const dp = Array.from({length:a.length+1}, ()=>new Array(b.length+1).fill(0));
  for(let i=a.length-1;i>=0;i--) for(let j=b.length-1;j>=0;j--)
    dp[i][j] = A[i]===B[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const out = []; let i=0, j=0;
  while(i<a.length){
    if(j<b.length && A[i]===B[j]){ out.push({w:a[i], ok:true}); i++; j++; }
    else if(j<b.length && dp[i][j+1] >= dp[i+1][j]) j++;
    else { out.push({w:a[i], ok:false}); i++; }
  }
  const hits = out.filter(x=>x.ok).length;
  return {words:out, score: a.length ? Math.round(hits/a.length*100) : 0, missed: out.filter(x=>!x.ok).map(x=>x.w)};
}
function wordsHTML(words, lang=S().lang){
  const sep = NOSPACE.includes(lang) ? "" : " ";
  return `<span class="words">${words.map(x=>`<span class="w ${x.ok?"ok":"miss"}">${esc(x.w)}</span>`).join(sep)}</span>`;
}

const cooldown = {};

function provHeaders(p){ return {"Content-Type":"application/json", ...(p.key ? {Authorization:"Bearer "+p.key} : {})}; }
async function timedFetch(url, opts, ms=45000){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms);
  try{ return await fetch(url, {...opts, signal:c.signal}); } finally { clearTimeout(t); }
}
/* Elenco dei modelli di un provider */
async function listModels(p){
  let res;
  try{ res = await timedFetch(p.base.replace(/\/+$/,"") + "/models", {headers:provHeaders(p)}, 20000); }
  catch(e){ const err = new Error("non raggiungibile da qui (rete o blocco del browser)"); err.network = true; throw err; }
  if(!res.ok) throw httpError(res.status, "");
  const data = await res.json();
  const ids = (data.data || data.models || []).map(m => (m.id || m.name || "").replace(/^models\//,"")).filter(Boolean);
  return ids.filter(id => !SKIP_MODELS.test(id));
}
/* Ordina i modelli dal più adatto al meno adatto */
function rankModels(p, ids){
  const pre = PRESETS[p.preset] || {};
  const pool = pre.onlyPref && pre.pref ? ids.filter(id => pre.pref.test(id)) : ids;
  const score = id => (REASONING.test(id) ? 0 : 4) + (GOOD_MODELS.test(id) ? 2 : 0) + (pre.pref && pre.pref.test(id) ? 1 : 0) + (BIG_MODELS.test(id) ? 3 : 0) - (SMALL_MODELS.test(id) ? 4 : 0);
  return pool.map((id,i)=>({id,i,sc:score(id)})).sort((a,b)=>b.sc-a.sc || a.i-b.i).map(x=>x.id);
}
function isAuto(p){ return !p.manual && p.preset!=="freellmapi" && p.preset!=="custom"; }
function modelProblem(e){ return e.empty || [400,404,422].includes(e.status); }
function markBad(p, id){ p.bad = [...new Set([...(p.bad||[]), id])].slice(-30); }
function httpError(status, text){
  let detail = String(text||"");
  try{ const j = JSON.parse(detail); detail = j?.error?.message || j?.message || detail; }catch(e){}
  const msg = status===401 || status===403 ? "chiave non valida" : status===429 ? "quota gratuita esaurita per ora" : status===404 ? "modello o indirizzo non trovato" : `errore ${status}: ${detail.slice(0,160)}`;
  const e = new Error(msg); e.status = status; return e;
}
/* Chiama un provider; se il modello scelto in automatico non va, prova i successivi */
async function callProvider(p, messages, opts={}){
  if(!isAuto(p)) return callModel(p, p.model || "auto", messages, opts);
  if(p.model){
    try{ return await callModel(p, p.model, messages, opts); }
    catch(e){ if(!modelProblem(e)) throw e; markBad(p, p.model); p.model = ""; save(); }
  }
  const cands = rankModels(p, await listModels(p)).filter(id => !(p.bad||[]).includes(id)).slice(0, 5);
  if(!cands.length) throw new Error("nessun modello adatto trovato: premi “Mostra i modelli” e scegline uno a mano");
  let last;
  for(const id of cands){
    try{ const t = await callModel(p, id, messages, opts); p.model = id; save(); return t; }
    catch(e){ last = e; if(!modelProblem(e)) throw e; markBad(p, id); save(); }
  }
  throw last;
}
async function callModel(p, model, messages, {temperature=0.7, maxTokens=1800}={}, retried=false){
  let res; const t0 = Date.now();
  try{
    res = await timedFetch(p.base.replace(/\/+$/,"") + "/chat/completions", {method:"POST", headers:provHeaders(p),
      body: JSON.stringify({model, messages, temperature, max_tokens:maxTokens})});
  }catch(e){ const err = new Error(e.name==="AbortError" ? "nessuna risposta entro 45 secondi" : "non raggiungibile da qui (rete o blocco del browser)"); err.network = true; throw err; }
  if(!res.ok){ let t=""; try{ t = await res.text(); }catch(e){} throw httpError(res.status, t); }
  const data = await res.json(); p.lat = Date.now() - t0;
  const choice = data?.choices?.[0] || {}, msg = choice.message || {};
  let text = Array.isArray(msg.content) ? msg.content.map(x => x?.text || "").join("") : (msg.content || "");
  text = String(text).replace(/<think>[\s\S]*?<\/think>/gi, "").trim();
  if(!text){
    const thinking = msg.reasoning || msg.reasoning_content || choice.finish_reason === "length";
    if(thinking && !retried) return callModel(p, model, messages, {temperature, maxTokens: Math.max(1500, maxTokens*6)}, true);
    const why = choice.finish_reason ? ` (motivo: ${choice.finish_reason})` : "";
    const e = new Error(`il modello ${model} ha dato una risposta vuota${why}. Prova a scegliere un altro modello con “Mostra i modelli”.`);
    e.empty = true; throw e;
  }
  return text;
}
function usableProviders(){
  return (S().providers || []).filter(p => p.on && p.base && (p.key || p.preset==="freellmapi" || p.preset==="custom"));
}
/* Prova i provider in ordine e passa al successivo se uno fallisce */
async function llm(messages, {json=true, temperature=0.7, maxTokens=1800}={}){
  const all = usableProviders();
  if(!all.length){ const e = new Error("Nessuna IA configurata. Vai in Impostazioni e aggiungi almeno un provider con la sua chiave."); e.network = true; throw e; }
  const now = Date.now();
  const ready = all.filter(p => !(cooldown[p.id] > now));
  const order = ready.length ? ready : all;
  const errs = [];
  for(const p of order){
    try{
      const text = await callProvider(p, messages, {temperature, maxTokens});
      const out = json ? parseJSON(text) : text;
      lastProvider = p.name; delete cooldown[p.id];
      return out;
    }catch(e){
      errs.push(`${p.name}: ${e.message}`);
      if(e.status===429) cooldown[p.id] = Date.now() + 60000;
      else if(e.network || e.status) cooldown[p.id] = Date.now() + 30000;
    }
  }
  const err = new Error("Nessuna IA ha risposto. " + errs.join(" · ")); err.network = true; throw err;
}
/* Ripara una risposta JSON interrotta o con piccoli errori (virgole mancanti, a capo dentro le frasi) */
function repairJSON(t){
  const src = t.slice(t.indexOf("{")); let out = "", stack = [], inStr = false, escp = false;
  for(const ch of src){
    if(inStr){
      if(escp){ escp = false; out += ch; continue; }
      if(ch === "\\"){ escp = true; out += ch; continue; }
      if(ch === '"'){ inStr = false; out += ch; continue; }
      out += ch === "\n" ? "\\n" : ch === "\t" ? " " : ch; continue;
    }
    if(ch === '"'){ inStr = true; out += ch; continue; }
    if(ch === "{" || ch === "["){ stack.push(ch); out += ch; continue; }
    if(ch === "}" || ch === "]"){ stack.pop(); out += ch; if(!stack.length) break; continue; }
    out += ch;
  }
  if(inStr) out += '"';
  out = out.replace(/,\s*"[^"]*"\s*:?\s*$/, "").replace(/:\s*$/, ": null").replace(/,\s*$/, "");
  while(stack.length){ out = out.replace(/,\s*$/, ""); out += stack.pop() === "{" ? "}" : "]"; }
  return out.replace(/,\s*([}\]])/g, "$1").replace(/}\s*\n\s*{/g, "},{").replace(/"\s*\n(\s*)"/g, '",\n$1"').replace(/]\s*\n(\s*)"/g, '],\n$1"').replace(/}\s*\n(\s*)"/g, '},\n$1"');
}
function parseJSON(text){
  const t = String(text).replace(/```(?:json)?/gi,"").trim();
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if(a < 0) throw new Error("risposta non nel formato previsto");
  try{ if(b > a) return JSON.parse(t.slice(a, b+1)); }catch(e){}
  try{ return JSON.parse(repairJSON(t)); }
  catch(e){ throw new Error("risposta interrotta o non leggibile"); }
}
async function ask(system, user, opts={}, validate){
  let lastErr;
  for(let attempt=0; attempt<2; attempt++){
    try{
      const out = await llm([{role:"system", content:system}, {role:"user", content:user}], opts);
      if(validate && !validate(out)) throw new Error("La risposta dell'IA era incompleta.");
      return out;
    }catch(e){ lastErr = e; if(e.network) break; }
  }
  throw lastErr;
}

/* ============ Voce: sintesi e riconoscimento ============ */
const Voice = {
  voices: [],
  init(){
    if(!("speechSynthesis" in window)) return;
    const load = () => { this.voices = speechSynthesis.getVoices(); };
    load(); speechSynthesis.onvoiceschanged = load;
  },
  forLang(){
    const code = L().code, pre = code.split("-")[0];
    return this.voices.filter(v => v.lang.replace("_","-").toLowerCase().startsWith(pre));
  },
  pick(){
    const list = this.forLang();
    return list.find(v=>v.voiceURI===S().voiceURI) || list.find(v=>v.lang.replace("_","-")===L().code) || list[0] || null;
  },
  speak(text, {rate}={}){
    return new Promise(resolve=>{
      if(!("speechSynthesis" in window) || !text){ resolve(); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = L().code; const v = this.pick(); if(v) u.voice = v;
      u.rate = rate ?? S().rate;
      u.onstart = () => setAvatar("talk");
      u.onend = u.onerror = () => { setAvatar(null); resolve(); };
      speechSynthesis.speak(u);
    });
  },
  stop(){ if("speechSynthesis" in window) speechSynthesis.cancel(); setAvatar(null); },
  canListen(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); },
  /* Ritorna una promessa con {text, alts:[{text,conf}]} o null; .stop() per fermare */
  listen({onInterim}={}){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){
      const msg = IS_IOS ? (isStandalone() ? "Su iPhone il microfono non funziona dall'icona sulla schermata Home: apri Parlami da Safari." : "Su iPhone serve Safari aggiornato, con Siri e Dettatura attivi.")
        : "Il riconoscimento vocale funziona in Chrome o Edge. Apri l'app con uno di questi browser.";
      const p = Promise.reject(new Error(msg)); p.stop=()=>{}; return p;
    }
    this.stop();
    const r = new SR();
    r.lang = L().code; r.interimResults = true; r.maxAlternatives = 3; r.continuous = false;
    let finals = [];
    const p = new Promise((resolve, reject)=>{
      r.onresult = e => {
        finals = []; let interim = "";
        for(let i=0;i<e.results.length;i++){
          const res = e.results[i];
          if(res.isFinal) finals.push([...res].map(a=>({text:a.transcript.trim(), conf:a.confidence||0})));
          else interim += res[0].transcript;
        }
        onInterim && onInterim((finals.map(f=>f[0].text).join(" ") + " " + interim).trim());
      };
      r.onerror = e => {
        if(e.error==="no-speech" || e.error==="aborted") return;
        const msg = {"not-allowed":"Il microfono è bloccato. Consenti l'accesso al microfono nelle impostazioni del browser.",
          "audio-capture":"Nessun microfono trovato.", "network":"Il riconoscimento vocale richiede la connessione a internet.",
          "service-not-allowed": IS_IOS ? "Su iPhone attiva Siri (Impostazioni › Siri) e la Dettatura (Impostazioni › Generali › Tastiera › Abilita Dettatura), poi riprova." : "Il riconoscimento vocale non è disponibile in questo browser."}[e.error] || ("Errore del riconoscimento vocale: "+e.error);
        reject(new Error(msg));
      };
      r.onend = () => {
        setAvatar(null);
        if(!finals.length){ resolve(null); return; }
        if(finals.length===1) resolve({text:finals[0][0].text, alts:finals[0]});
        else { const text = finals.map(f=>f[0].text).join(" "); resolve({text, alts:[{text, conf:0}]}); }
      };
    });
    p.stop = () => { try{ r.stop(); }catch(e){} };
    try{ r.start(); setAvatar("listen"); }catch(e){}
    return p;
  }
};

/* Registra la propria voce per riascoltarla (facoltativo) */
const Recorder = {
  rec:null, chunks:[], url:null, stream:null,
  async start(){
    try{
      if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return;
      this.stream = await navigator.mediaDevices.getUserMedia({audio:true});
      this.chunks = []; this.rec = new MediaRecorder(this.stream);
      this.rec.ondataavailable = e => this.chunks.push(e.data);
      this.rec.start();
    }catch(e){ this.rec = null; }
  },
  stop(){
    return new Promise(resolve=>{
      if(!this.rec || this.rec.state==="inactive"){ resolve(null); return; }
      this.rec.onstop = () => {
        if(this.url) URL.revokeObjectURL(this.url);
        this.url = URL.createObjectURL(new Blob(this.chunks, {type:this.rec.mimeType || "audio/webm"}));
        this.stream.getTracks().forEach(t=>t.stop());
        resolve(this.url);
      };
      this.rec.stop();
    });
  },
  play(){ if(this.url) new Audio(this.url).play(); }
};

/* ============ CHIAVI DI FAMIGLIA (cifrate con una password) ============ */
const b64e = buf => { let s = ""; new Uint8Array(buf).forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function famKey(pass, salt){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:600000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function famEncrypt(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, await famKey(pass, salt), new TextEncoder().encode(JSON.stringify(obj)));
  return {app:"parlami", v:1, created:Date.now(), salt:b64e(salt), iv:b64e(iv), data:b64e(ct)};
}
async function famDecrypt(file, pass){
  try{
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(file.iv)}, await famKey(pass, b64d(file.salt)), b64d(file.data));
    return JSON.parse(new TextDecoder().decode(pt));
  }catch(e){ throw new Error("Password sbagliata."); }
}

    const ov = document.createElement("div"); ov.className = "overlay"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true");

      <input class="input" id="fp1" type="password" autocomplete="new-password" placeholder="Password di famiglia">
      ${confirm2 ? `<input class="input" id="fp2" type="password" autocomplete="new-password" placeholder="Ripeti la password">` : ""}
      <label class="row small"><input type="checkbox" id="fshow"> Mostra la password</label>
      <p class="status-bad" id="fm" style="margin:0"></p>
      <div class="row"><button class="btn" id="fok">${esc(button)}</button><button class="btn ghost" id="fno">Annulla</button></div></div>`;
    document.body.appendChild(ov); $("#fp1", ov).focus();
    $("#fshow", ov).onchange = e => $$("input[type=password], input.pw", ov).forEach(i => { i.type = e.target.checked ? "text" : "password"; i.classList.add("pw"); });
    const ok = () => { const a = $("#fp1", ov).value;
      if(confirm2){ if(a.length < 10){ $("#fm", ov).textContent = "Usa almeno 10 caratteri: per esempio tre o quattro parole di fila."; return; } if(a !== $("#fp2", ov).value){ $("#fm", ov).textContent = "Le due password sono diverse."; return; } }
      if(!a) return; ov.remove(); resolve(a); };
    $("#fok", ov).onclick = ok; $$("input", ov).forEach(i => i.addEventListener("keydown", e => { if(e.key === "Enter") ok(); }));

  });
}
async function createFamilyFile(){
  const list = (S().providers || []).filter(p => p.preset !== "freellmapi" && p.key);
  if(!list.length){ toast("Prima inserisci almeno una chiave di un provider"); return; }

        <span class="row" style="gap:6px"><button class="iconbtn" data-a="up" aria-label="Sposta su" ${i===0?"disabled":""}>↑</button><button class="iconbtn" data-a="down" aria-label="Sposta giù" ${i===list.length-1?"disabled":""}>↓</button><button class="iconbtn" data-a="del" aria-label="Rimuovi">✕</button></span></div>
      ${pr.note?`<span class="small muted">${esc(pr.note)}</span>`:""}
      <div class="grid2">
        ${fixed ? "" : `<label class="field">Indirizzo<input data-f="base" value="${esc(p.base)}" placeholder="https://…/v1"></label>`}
        <label class="field">Chiave ${pr.keyUrl?`<a class="small" href="${pr.keyUrl}" target="_blank" rel="noopener">crea una chiave gratuita</a>`:""}<input data-f="key" type="password" value="${esc(p.key)}" autocomplete="off" placeholder="${p.preset==="freellmapi"?"chiave unificata di FreeLLMAPI":"incolla qui la chiave"}"></label>
        <label class="field">Modello<input data-f="model" value="${esc(p.model)}" list="ml-${p.id}" placeholder="vuoto = scelto in automatico"><datalist id="ml-${p.id}"></datalist></label>
      </div>
      <div class="row"><button class="btn ghost sm" data-a="test">Prova</button><button class="btn ghost sm" data-a="models">Mostra i modelli</button><span class="small" data-status></span></div>
    </div>`; }).join("") : `<p class="muted">Nessun provider. Aggiungine uno qui sotto.</p>`;
  $$(".prov", box).forEach(el=>{
    const p = list.find(x=>x.id===el.dataset.id), st = $("[data-status]", el);
    $$("[data-f]", el).forEach(inp => inp.onchange = () => {
      const f = inp.dataset.f; p[f] = inp.type==="checkbox" ? inp.checked : inp.value.trim();
      if(f==="model"){ p.manual = !!p.model; p.bad = []; }
      if(f==="key" || f==="base") delete cooldown[p.id];
      state.settings.connected = false; save(); if(f==="on") renderProviders();
    });
    $$("[data-a]", el).forEach(b => b.onclick = async () => {
      const a = b.dataset.a, i = list.indexOf(p);
      if(a==="up" || a==="down"){ const j = a==="up" ? i-1 : i+1; [list[i], list[j]] = [list[j], list[i]]; save(); renderProviders(); }
      else if(a==="del"){ if(confirm(`Rimuovere ${p.name}?`)){ list.splice(i,1); save(); route(); } }
      else if(a==="test"){ const ok = await testProvider(p); if(ok) { state.settings.connected = true; save(); } }
      else if(a==="models"){
        st.innerHTML = `<span class="spinner"></span>`;
        try{ const ids = await listModels(p); $(`#ml-${p.id}`).innerHTML = ids.map(id=>`<option value="${esc(id)}">`).join(""); st.innerHTML = `<span class="muted">${ids.length} modelli: tocca il campo Modello per sceglierne uno.</span>`; }
        catch(e){ st.innerHTML = `<span class="status-bad">${esc(e.message)}</span>`; }
      }
    });
  });
}
async function testProvider(p){
  const el = document.querySelector(`.prov[data-id="${p.id}"] [data-status]`);
  if(el) el.innerHTML = `<span class="spinner"></span>`;
  try{
    const r = await callProvider(p, [{role:"user", content:"Rispondi solo con la parola: pronto"}], {maxTokens:300, temperature:0});
    delete cooldown[p.id];
    if(el) el.innerHTML = `<span class="status-ok">Funziona · ${esc(p.model)} · risponde in ${((p.lat||0)/1000).toFixed(1).replace(".",",")} s</span>`;
    const m = document.querySelector(`.prov[data-id="${p.id}"] [data-f="model"]`); if(m) m.value = p.model;
    return true;
  }catch(e){
    if(el) el.innerHTML = `<span class="status-bad">${esc(e.message)}</span>`;
    return false;
  }
}

/* ============ TEST DI LIVELLO ============ */
/* Un secondo passaggio dell'IA controlla che ogni domanda abbia UNA sola risposta giusta, e che sia quella indicata */
async function verifyMCQ(qs, textOf){
  if(!qs.length) return qs;
  try{
    const r = await ask(`Sei un insegnante madrelingua di ${L().name}, molto attento ai dettagli. ${JSON_ONLY}`,
`Controlla queste domande a scelta multipla:
${JSON.stringify(qs.map((q,i)=>({i, domanda:textOf(q), opzioni:q.options, giusta:+q.answer})))}
Per ognuna verifica che ESATTAMENTE una opzione sia corretta. Se l'indice "giusta" è sbagliato, scrivi quello giusto. Se nessuna opzione è giusta, se ce n'è più di una o se la domanda non ha senso, scrivi -1.
JSON con tutte le domande: {"check":[{"i":0,"giusta":0}]}`, {temperature:0, maxTokens:1500}, r => Array.isArray(r.check));
    const map = new Map(r.check.filter(c=>c && Number.isInteger(+c.i)).map(c => [+c.i, +c.giusta]));
    return qs.filter((q,i) => { const g = map.has(i) ? map.get(i) : +q.answer; if(!(g >= 0 && g < q.options.length)) return false; q.answer = g; return true; });
  }catch(e){ return qs; }
}
async function runPlacement(main){
  main.innerHTML = `<button class="btn ghost sm" id="back">${icon("back")} Esami</button>
    <h1 style="margin-top:18px">Test di livello</h1>
    <p class="muted">18 domande di ${L().name.toLowerCase()}, 3 per ogni livello dall'A1 al C2, sempre più difficili. Rispondi senza aiuti: se non sai, scegli “Non lo so”. Alla fine ti dico il livello da cui conviene partire.</p>
    ${needsSetup()}<div id="pt">${loadingHTML("Preparo le domande…")}</div>`;
  $("#back").onclick = () => location.hash = "esami";
  let qs;
  try{
    const r = await ask(`Sei un esaminatore esperto di certificazioni di ${L().name} secondo il QCER. ${JSON_ONLY}`,
      `Crea un test di piazzamento di ${L().name} per uno studente italiano: 18 domande, esattamente 3 per ciascun livello A1, A2, B1, B2, C1, C2, in ordine di difficoltà crescente.
Ogni domanda è una FRASE IN ${L().name.toUpperCase()} con uno spazio ___ da completare, e 4 opzioni IN ${L().name.toUpperCase()}: una sola è corretta, le altre sono sicuramente sbagliate. Mescola grammatica e lessico del livello. Non fare domande di traduzione.${S().lang==="en" ? `
Esempio: {"level":"A1","sentence":"She ___ a teacher.","options":["is","are","am","be"],"answer":0}` : ""}
JSON: {"questions":[{"level":"A1","sentence":"frase con ___","options":["...","...","...","..."],"answer":indice_da_0}]}`,
      {temperature:0.5, maxTokens:3000}, r=>Array.isArray(r.questions) && r.questions.filter(q=>q && String(q.sentence||"").includes("___") && Array.isArray(q.options) && !soundsItalian(q.sentence) && !soundsItalian(q.options.join(" "))).length>=12);
    qs = r.questions.filter(q => q && LEVELS.includes(q.level) && String(q.sentence||"").includes("___") && !soundsItalian(q.sentence) && Array.isArray(q.options) && q.options.length>=3 && new Set(q.options.map(bare)).size === q.options.length && Number.isInteger(+q.answer) && +q.answer < q.options.length);
    const pt = $("#pt"); if(pt) pt.innerHTML = loadingHTML("Controllo che ogni domanda abbia una sola risposta giusta…");
    qs = await verifyMCQ(qs, q => q.sentence);
    if(qs.length < 12) throw new Error("Le domande preparate dall'IA non erano corrette. Premi Riprova.");
    qs.sort((a,b)=>LEVELS.indexOf(a.level)-LEVELS.indexOf(b.level));
  }catch(e){
    if(!$("#pt")) return;
    $("#pt").innerHTML = errorHTML(e, "retry"); $("#retry").onclick = () => runPlacement(main); return;
  }
  const answers = []; let i = 0;
  const show = () => {
    const box = $("#pt"); if(!box) return;
    if(i >= qs.length) return result();
    const q = qs[i];
    box.innerHTML = `<div class="row" style="flex-wrap:nowrap;margin-bottom:14px"><div class="progress" style="flex:1"><i style="width:${i/qs.length*100}%"></i></div><span class="small muted">${i+1}/${qs.length}</span></div>
      <section class="panel"><p class="muted small" style="margin:0 0 4px">Completa la frase</p><div class="ex-q">${esc(q.sentence || q.question || "")}</div><div class="options">${q.options.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}<button class="opt" data-k="-1" style="font-weight:400">Non lo so</button></div></section>`;
    $$(".opt", box).forEach(b=>b.onclick=()=>{ answers.push(+b.dataset.k === +q.answer); i++; show(); });
  };
  const result = () => {
    const per = {}; qs.forEach((q,k)=>{ (per[q.level] ||= {ok:0, n:0}); per[q.level].n++; if(answers[k]) per[q.level].ok++; });
    let level = "A1";
    for(const lv of LEVELS){ const p = per[lv]; if(p && p.ok/p.n >= 0.6) level = lv; else break; }
    const info = LEVEL_INFO[level];
    $("#pt").innerHTML = `<section class="panel stack">
      <h2 style="margin:0">Il tuo livello stimato: ${level} · ${esc(info.name)}</h2>
      <p style="margin:0">${esc(info.can)}</p>
      <div class="row">${LEVELS.map(lv=>{ const p = per[lv]||{ok:0,n:0}; return `<span class="chip ${lv===level?"on":""}">${lv}: ${p.ok}/${p.n}</span>`; }).join("")}</div>
      <p style="margin:0"><b>Ti consiglio di partire da:</b> ${level} · lezione “${esc(nextUnit(level).title)}”. ${level!=="C2" ? `Quando le lezioni del ${level} ti sembrano facili, prova l'<a href="#esami-${level}">esame simulato ${level}</a> per vedere se lo passeresti.` : `Puoi verificare la tua preparazione con l'<a href="#esami-C2">esame simulato C2</a>.`}</p>
      <p class="small muted" style="margin:0">È una stima veloce: se le lezioni ti sembrano troppo facili o troppo difficili, puoi cambiare livello quando vuoi.</p>
      <div class="row"><button class="btn" id="use">Imposta ${level} e inizia</button><button class="btn ghost" id="redo">Rifai il test</button></div>
    </section>`;
    state.placement = {...(state.placement||{}), [S().lang]:{level, date:today()}}; save();
    addXP(10);
    $("#use").onclick = () => { state.settings.level = level; save(); toast(`Livello impostato: ${levelLabel(level)}`); location.hash = unitHash(nextUnit(level)); };
    $("#redo").onclick = () => runPlacement(main);
  };
  show();
}

/* Riconosce frasi scritte in italiano dove dovrebbero essere nella lingua studiata */
const IT_MARK = ["il","di","che","è","sono","ho","hai","ha","gli","della","del","dei","delle","nel","nella","questo","questa","anche","molto","sempre","perché","noi","voi","loro","fatto","andato","piace","mio","mia","tuo","tua","suo","sua","fine","settimana","ieri","oggi","domani","cosa","dove","quando","fratelli","sorelle","libri","insieme"];
const IT_SHARED = ["con","una","uno","al","alla","ai","le","lo","si","mi","ti","ci","vi","io","tu","come","non","per","ma"];
function soundsItalian(t){
  if(S().lang === "it") return false;
  const set = new Set(S().lang === "en" ? [...IT_MARK, ...IT_SHARED] : IT_MARK);
  const w = String(t||"").toLowerCase().split(/[^a-zàèéìíòóùú']+/).filter(Boolean);
  if(w.length < 3) return false;
  const hits = w.filter(x => set.has(x)).length;
  return hits >= 3 || hits / w.length >= 0.3;
}
function cleanExercises(list){
  return (list||[]).filter(x=>{
    switch(x?.type){
      case "choice": return Array.isArray(x.options) && x.options.length>=2 && Number.isInteger(+x.answer) && +x.answer < x.options.length && x.question && x.options.filter(soundsItalian).length < x.options.length/2 && !soundsItalian(x.options.join(" "));
      case "fill": return x.sentence && x.sentence.includes("___") && x.answer && !soundsItalian(x.sentence);
      case "translate": return x.it && x.answer && !soundsItalian(x.answer);
      case "order": return Array.isArray(x.words) && x.words.length>=3 && !soundsItalian(x.words.join(" "));
      case "listen": case "speak": return !!x.sentence && !soundsItalian(x.sentence);
      default: return false;
    }
  });
}
function goodVocab(v){ return v && v.word && v.translation && looksItalian(v.translation) && bare(v.word) !== bare(v.translation) && (!v.example || !soundsItalian(v.example)); }
function lessonOK(l){
  return l && Array.isArray(l.vocab) && l.vocab.filter(goodVocab).length >= 6 && Array.isArray(l.exercises) && l.exercises.length >= 6;
}
function lessonProblem(l){
  if(!l || !Array.isArray(l.vocab) || l.vocab.filter(goodVocab).length < 6) return "le parole";
  if(!Array.isArray(l.exercises) || l.exercises.length < 6) return "gli esercizi";
  return "";
}
async function getLesson(u, force=false, attempt=0){
  const key = unitKey(u);
  if(!force && state.lessons[key] && lessonOK(state.lessons[key])) return state.lessons[key];
  const lv = u.level || S().level, code = S().lang, LN = L().name;
  const sys = `Sei un autore esperto di corsi di ${LN} per italiani, secondo il QCER. ${who(lv)} ${JSON_ONLY}`;
  const topic = `tema "${u.title}" (${u.focus}), livello ${lv} (${LEVEL_INFO[lv]?.name})`;
  const theoryP = ask(sys,
`Prepara la TEORIA di una lezione di ${LN} sul ${topic}.
Regola fondamentale: le parole e le frasi d'esempio sono IN ${LN.toUpperCase()}; in italiano ci sono solo titolo, introduzione, spiegazione e traduzioni.
JSON: {"title":"titolo in italiano","intro":"2 frasi in italiano su cosa si impara",
"vocab":[{"${code}":"parola o espressione in ${LN}","it":"traduzione in italiano","ex":"frase d'esempio breve IN ${LN}","ex_it":"traduzione italiana della frase"}],
"grammar":{"title":"argomento grammaticale in italiano","explanation":"spiegazione chiara in italiano, massimo 100 parole, con un confronto con l'italiano","examples":[{"${code}":"frase d'esempio IN ${LN}","it":"traduzione italiana"}]}}
Metti 8 voci in vocab e 3 esempi in grammar.${code === "en" ? `
Esempio di una voce: {"en":"weekend","it":"fine settimana","ex":"What did you do at the weekend?","ex_it":"Cosa hai fatto nel fine settimana?"}` : ""}`,
    {temperature:0.5, maxTokens:1500},
    r => Array.isArray(r.vocab) && r.vocab.map(v=>({word:v?.[code] ?? v?.word, translation:v?.it ?? v?.translation, example:v?.ex ?? v?.example})).filter(goodVocab).length >= 6);
  const exP = ask(sys,
`Prepara 10 ESERCIZI di ${LN} sul ${topic}, in ordine misto. Servono ad allenare il ${LN}: tutte le frasi da completare, ordinare, ascoltare o dire sono IN ${LN.toUpperCase()}; in italiano ci sono solo le domande, i suggerimenti e le traduzioni.
Formati:
{"type":"choice","question":"domanda in italiano","options":["4 risposte IN ${LN}"],"answer":indice_da_0,"explain":"perché, in italiano"}
{"type":"fill","sentence":"frase IN ${LN} con ___ al posto di UNA parola","answer":"parola mancante","hint":"traduzione italiana della frase"}
{"type":"translate","it":"frase in italiano","answer":"traduzione IN ${LN}"}
{"type":"order","words":["parole","della","frase","IN","${LN}"],"it":"traduzione italiana"}
{"type":"listen","sentence":"frase breve IN ${LN}","it":"traduzione"}
{"type":"speak","sentence":"frase breve IN ${LN}","it":"traduzione"}
Usa: 2 choice, 2 fill, 2 translate, 1 order, 1 listen, 2 speak.${code === "en" ? `
Esempio di choice: {"type":"choice","question":"Come si dice «Ho letto un libro»?","options":["I read a book","I reads a book","I readed a book","I am read a book"],"answer":0,"explain":"read è irregolare: al passato si scrive uguale"}` : ""}
JSON: {"exercises":[...]}`,
    {temperature:0.6, maxTokens:2000},
    r => cleanExercises(r.exercises).length >= 6);
  const [th, ex] = await Promise.all([theoryP, exP]);
  const l = {
    title: th.title || u.title, intro: th.intro || "",
    vocab: th.vocab.map(v => ({word:String(v?.[code] ?? v?.word ?? "").trim(), translation:String(v?.it ?? v?.translation ?? "").trim(), example:String(v?.ex ?? v?.example ?? "").trim(), example_it:String(v?.ex_it ?? "").trim()})).filter(goodVocab),
    grammar: th.grammar ? {title: th.grammar.title || "", explanation: th.grammar.explanation || "",
      examples: (Array.isArray(th.grammar.examples) ? th.grammar.examples : []).map(x => typeof x === "string" ? {target:x.trim(), it:""} : ({target:String(x?.[code] ?? x?.target ?? x?.example ?? x?.sentence ?? x?.frase ?? x?.text ?? "").trim(), it:String(x?.it ?? x?.translation ?? x?.traduzione ?? "").trim()})).filter(x => x.target && !soundsItalian(x.target))} : null,
    exercises: cleanExercises(ex.exercises)
  };
  if(!lessonOK(l)){
    if(attempt < 1) return getLesson(u, true, attempt + 1);
    throw new Error(`L'IA ha sbagliato ${lessonProblem(l) || "la lezione"} due volte di fila. Premi Riprova tra qualche secondo.`);
  }
  if(S().reviewLessons !== false){ try{ await reviewLesson(l, lv); }catch(e){} }
  state.lessons[key] = l; save();
  return l;
}
/* Correttore di bozze: un secondo passaggio dell'IA ricontrolla lingua, traduzioni e risposte degli esercizi */
async function reviewLesson(l, lv){
  const code = S().lang, LN = L().name;
  const r = await ask(`Sei un revisore madrelingua di ${LN} che parla perfettamente italiano. Controlli lezioni per studenti italiani con grande attenzione. ${JSON_ONLY}`,
`Lezione di ${LN}, livello ${lv}:
${JSON.stringify({vocab:l.vocab.map((v,i)=>({i, [code]:v.word, it:v.translation, ex:v.example})), grammar:(l.grammar?.examples||[]).map((x,i)=>({i, [code]:x.target, it:x.it})), exercises:l.exercises.map((e,i)=>({i, ...e}))})}
Controlla ogni elemento:
1) parole, frasi d'esempio e frasi degli esercizi devono essere in ${LN} corretto e naturale (mai in italiano);
2) le traduzioni italiane devono essere giuste e scritte in buon italiano;
3) ogni esercizio deve avere UNA sola risposta corretta, ed è quella indicata; le opzioni sbagliate devono essere davvero sbagliate.
Rispondi SOLO con le correzioni necessarie, liste vuote se è tutto giusto:
{"vocab":[{"i":0,"${code}":"...","it":"...","ex":"..."}],"grammar":[{"i":0,"${code}":"...","it":"..."}],"exercises":[{"i":0,"fix":{"type":"...","...":"esercizio corretto completo"}},{"i":1,"remove":true}],"notes":"commento breve in italiano"}`,
    {temperature:0.1, maxTokens:1800}, r => r && typeof r === "object" && !Array.isArray(r));
  let changes = 0;
  (r.vocab||[]).forEach(c => { const v = l.vocab[c?.i]; if(!v) return; const w = c[code] ?? c.word; if(w) v.word = String(w); if(c.it && looksItalian(c.it)) v.translation = String(c.it); if(c.ex && !soundsItalian(c.ex)) v.example = String(c.ex); changes++; });
  (r.grammar||[]).forEach(c => { const g = l.grammar?.examples?.[c?.i]; if(!g) return; const t = c[code] ?? c.target; if(t && !soundsItalian(t)) g.target = String(t); if(c.it) g.it = String(c.it); changes++; });
  const rm = new Set();
  (r.exercises||[]).forEach(c => { if(!c || !(c.i in l.exercises)) return; if(c.remove) rm.add(c.i); else if(c.fix && cleanExercises([c.fix]).length) l.exercises[c.i] = c.fix; else return; changes++; });
  const ex = cleanExercises(l.exercises.filter((_,i)=>!rm.has(i)));
  if(ex.length >= 5) l.exercises = ex;
  l.vocab = l.vocab.filter(goodVocab);
  l.reviewed = true; l.reviewChanges = changes; l.reviewNotes = String(r.notes||"");
  return changes;
}

function runLesson(main, u){
  main.innerHTML = `<button class="btn ghost sm" id="back">${icon("back")} Lezioni</button>${loadingHTML("Sto preparando la lezione…")}`;
  $("#back").onclick = () => location.hash = u.level ? "lezioni-"+u.level : "lezioni";
  const go = async (force) => {
    try{
      const l = await getLesson(u, force);
      if(location.hash !== "#"+unitHash(u)) return;
      showTheory(main, u, l);
    }catch(e){
      if(location.hash !== "#"+unitHash(u)) return;
      main.innerHTML = `<button class="btn ghost sm" id="back">${icon("back")} Lezioni</button><div style="margin-top:16px">${errorHTML(e,"retry")}</div>`;
      $("#back").onclick = () => location.hash = u.level ? "lezioni-"+u.level : "lezioni";
      $("#retry").onclick = () => { main.innerHTML = loadingHTML("Sto preparando la lezione…"); go(true); };
    }
  };
  go(false);
}
