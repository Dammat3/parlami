      <label class="field" style="width:100%;text-align:left">Situazione<select id="scen">${Object.entries(SCENARIOS).map(([k,v])=>`<option value="${k}" ${k===Chat.scenario?"selected":""}>${v.name}</option>`).join("")}</select></label>
      ${Chat.topic?`<p class="small muted">Tema della lezione: ${esc(Chat.topic)}</p>`:""}
      <label class="row small"><input type="checkbox" id="tr" ${S().showTr?"checked":""}> Mostra le traduzioni</label>
      <button class="btn ghost sm" id="restart">Ricomincia la conversazione</button>
    </aside>
    <section class="panel">
      <div class="chat" id="chat" aria-live="polite"></div>
      <div id="status" class="small muted" style="min-height:1.5em;margin-top:8px"></div>
      <div class="composer">
        <textarea class="input" id="txt" rows="1" placeholder="Scrivi in ${L().name.toLowerCase()} o premi il microfono…"></textarea>
        <button class="mic" id="mic" aria-label="Parla">${icon("mic")}</button>
        <button class="iconbtn" id="send" aria-label="Invia" style="width:54px;height:54px">${icon("send")}</button>
      </div>
    </section>
  </div>`;
  const chat = $("#chat"), status = $("#status");
  const draw = () => {
    const showTr = S().showTr;
    chat.innerHTML = Chat.turns.map((t,i)=>{
      if(t.role==="u"){
        let h = `<div class="msg u">${esc(t.text)}</div>`;
        if(t.corr?.length || t.natural){
          h += `<div class="corr">${(t.corr||[]).map(c=>`<div><s>${esc(c.wrong)}</s> → <span class="ok">${esc(c.right)}</span>${c.why?` <span class="small">· ${esc(c.why)}</span>`:""}</div>`).join("")}${t.natural?`<div class="small" style="margin-top:4px">Più naturale: <b>${esc(t.natural)}</b></div>`:""}</div>`;
        } else if(i < Chat.turns.length-1) h += `<div class="small" style="align-self:flex-end;color:var(--ok);font-weight:700">✓ Corretto</div>`;
        return h;
      }
      return `<div class="msg t">${esc(t.text)} <button class="iconbtn" data-say="${i}" aria-label="Riascolta" style="width:30px;height:30px;vertical-align:middle">${icon("play")}</button>
        ${t.tr?`<div class="tr" ${showTr?"":"hidden"} data-tr="${i}">${esc(t.tr)}</div>`:""}${t.tr&&!showTr?`<button class="btn ghost sm" data-show="${i}" style="margin-top:6px">Traduci</button>`:""}</div>`;
    }).join("");
    $$("[data-say]", chat).forEach(b=>b.onclick=()=>Voice.speak(Chat.turns[b.dataset.say].text));
    $$("[data-show]", chat).forEach(b=>b.onclick=()=>{ $(`[data-tr="${b.dataset.show}"]`, chat).hidden=false; b.remove(); });
    chat.scrollTop = chat.scrollHeight;
  };
  const busy = on => { Chat.busy = on; $("#send").disabled = on; $("#mic").disabled = on; status.innerHTML = on ? `<span class="spinner"></span> ${esc(p.name)} sta scrivendo…` : ""; };
  const turn = async (text, voice) => {
    if(Chat.busy) return;
    busy(true); draw();
    try{
      await tutorTurn(text, voice);
      draw(); busy(false);
      if(S().autoSpeak) Voice.speak(Chat.turns[Chat.turns.length-1].text);
    }catch(e){
      busy(false);
      if(text && Chat.turns.length && Chat.turns[Chat.turns.length-1].role==="u" && Chat.turns[Chat.turns.length-1].text===text) Chat.turns.pop();
      draw(); status.innerHTML = `<span style="color:var(--bad);font-weight:700">${esc(e.message)}</span>`;
      if(text) $("#txt").value = text;
    }
  };
  const sendText = () => { const v = $("#txt").value.trim(); if(!v) return; $("#txt").value = ""; turn(v, false); };
  $("#send").onclick = sendText;
  $("#txt").onkeydown = e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendText(); } };
  let session = null;
  $("#mic").onclick = async () => {
    const mic = $("#mic");
    if(session){ session.stop(); return; }
    mic.classList.add("on"); mic.innerHTML = icon("stop"); status.textContent = "Ti ascolto…";
    session = Voice.listen({onInterim: t => status.textContent = t || "Ti ascolto…"});
    try{
      const r = await session;
      session = null; mic.classList.remove("on"); mic.innerHTML = icon("mic");
      if(!r){ status.textContent = "Non ho sentito nulla. Riprova."; return; }
      status.textContent = ""; turn(r.text, true);
    }catch(e){ session = null; mic.classList.remove("on"); mic.innerHTML = icon("mic"); status.innerHTML = `<span style="color:var(--bad);font-weight:700">${esc(e.message)}</span>`; }
  };
  $("#scen").onchange = e => { Chat.scenario = e.target.value; Chat.turns = []; Chat.topic = ""; start(); };
  $("#tr").onchange = e => { state.settings.showTr = e.target.checked; save(); draw(); };
  $("#restart").onclick = () => { Chat.turns = []; start(); };
  const start = () => { draw(); if(!Chat.turns.length && S().connected) turn(null); };
  cleanup = () => { if(session) session.stop(); };
  start();
};

/* ============ PRONUNCIA ============ */
const Pron = {list:[], i:0, focus:""};
RENDER.pronuncia = main => {
  main.innerHTML = `
  <h1>Pronuncia</h1>
  <p class="muted">Ascolta la frase, ripetila e guarda quali parole ho capito. Le parole in rosso sono quelle da ripetere con più cura.</p>
  ${needsSetup()}
  <div class="stack" style="margin-top:16px">
    <section class="panel stack">
      <div class="row">
        <button class="btn" id="gen">Nuove frasi</button>
        <label class="field" style="flex:1;min-width:200px"><span class="small">Su cosa vuoi lavorare? (facoltativo)</span><input id="focus" value="${esc(Pron.focus)}" placeholder="es. il suono th, le doppie, frasi da ristorante…"></label>
      </div>
      <details><summary class="small" style="cursor:pointer;font-weight:700">Oppure scrivi tu una frase</summary>
        <div class="row" style="margin-top:10px"><input class="input" id="own" style="flex:1" placeholder="Frase in ${L().name.toLowerCase()}"><button class="btn ghost" id="useown">Usa questa frase</button></div>
      </details>
    </section>
    <section class="panel" id="card"></section>
  </div>`;
  const card = $("#card");
  const drawCard = () => {
    if(!Pron.list.length){ card.innerHTML = `<p class="muted">Premi “Nuove frasi” per ricevere sei frasi adatte al tuo livello.</p>`; return; }
    const s = Pron.list[Pron.i];
    card.innerHTML = `
      <div class="row" style="justify-content:space-between"><span class="small muted">Frase ${Pron.i+1} di ${Pron.list.length}</span>
        <span class="row"><button class="btn ghost sm" id="prev" ${Pron.i===0?"disabled":""}>Precedente</button><button class="btn ghost sm" id="next" ${Pron.i>=Pron.list.length-1?"disabled":""}>Successiva</button></span></div>
      <div class="bigsent" id="sent" style="margin:16px 0 6px">${esc(s.text)}</div>
      ${s.it?`<p class="muted">${esc(s.it)}</p>`:""}
      ${s.tip?`<p class="small"><b>Suggerimento:</b> ${esc(s.tip)}</p>`:""}
      <div class="row" style="margin:16px 0">
        <button class="btn ghost" id="play">${icon("play")} Ascolta</button>
        <button class="btn ghost" id="slow">${icon("slow")} Lento</button>
        <button class="btn ghost" id="mine" hidden>${icon("me")} Riascolta la tua voce</button>
      </div>
      <div class="row"><button class="mic" id="mic" aria-label="Registra">${icon("mic")}</button><span id="heard" class="muted">Premi il microfono e leggi la frase</span></div>
      <div id="result" style="margin-top:16px"></div>`;
    $("#prev").onclick = () => { Pron.i--; drawCard(); };
    $("#next").onclick = () => { Pron.i++; drawCard(); };
    $("#play").onclick = () => Voice.speak(s.text);
    $("#slow").onclick = () => Voice.speak(s.text, {rate:0.6});
    $("#mine").onclick = () => Recorder.play();
    let session = null;
    $("#mic").onclick = async () => {
      const mic = $("#mic");
      if(session){ session.stop(); return; }
      mic.classList.add("on"); mic.innerHTML = icon("stop"); $("#result").innerHTML = "";
      await Recorder.start();
      session = Voice.listen({onInterim: t => $("#heard").textContent = t || "Ti ascolto…"});
      let res, failed = false;
      try{ res = await session; }
      catch(e){ failed = true; $("#heard").textContent = e.message; }
      finally{ session = null; mic.classList.remove("on"); mic.innerHTML = icon("mic"); }
      const url = await Recorder.stop(); if(url) $("#mine").hidden = false;
      if(!res){ if(!failed) $("#heard").textContent = "Non ho sentito nulla. Riprova."; return; }
      const scored = res.alts.map(a=>{ const r = align(s.text, a.text); const conf = a.conf>0 ? a.conf : 1; return {a, r, final: Math.round(r.score*(0.85+0.15*conf))}; }).sort((x,y)=>y.final-x.final)[0];
      $("#heard").innerHTML = `Ho capito: “${esc(scored.a.text)}”`;
      $("#result").innerHTML = `<div class="row" style="align-items:flex-start;gap:20px"><div class="score" style="color:${scored.final>=85?"var(--ok)":scored.final>=60?"var(--ink)":"var(--bad)"}">${scored.final}</div>
        <div style="flex:1"><div class="bigsent" style="font-size:1.3rem">${wordsHTML(scored.r.words)}</div><div id="tips" class="small" style="margin-top:10px"></div></div></div>`;
      addXP(scored.final>=85 ? 3 : 1);
      if(scored.final < 100) pronTips(s.text, scored.a.text, scored.r.missed);
      else $("#tips").innerHTML = `<b style="color:var(--ok)">Perfetto, ho capito ogni parola.</b>`;
    };
    cleanup = () => { if(session) session.stop(); };
  };
  const pronTips = async (target, heard, missed) => {
    const box = $("#tips"); if(!box) return;
    box.innerHTML = `<span class="spinner"></span> Preparo i consigli…`;
    try{
      const r = await ask(`Sei un esperto di fonetica che aiuta studenti italiani a pronunciare il ${L().name.toLowerCase()}. ${JSON_ONLY}`,
        `Frase da dire: "${target}"\nCiò che il riconoscimento vocale ha capito: "${heard}"\nParole non riconosciute: ${JSON.stringify(missed)}\n`+
        `Deduci quali suoni lo studente ha probabilmente pronunciato male (tieni conto degli errori tipici degli italiani) e dai consigli pratici.\n`+
        `JSON: {"feedback":"1-2 frasi in italiano","tips":[{"word":"parola","how":"come pronunciarla, con una trascrizione semplice leggibile da un italiano e un consiglio pratico su bocca e lingua"}]}`,
        {temperature:0.3, maxTokens:600}, r=>r && r.feedback);
      if(!$("#tips")) return;
      $("#tips").innerHTML = `<p>${esc(r.feedback)}</p>${(r.tips||[]).map(t=>`<div class="row" style="margin:6px 0;align-items:flex-start;flex-wrap:nowrap"><button class="iconbtn" data-w="${esc(t.word)}" aria-label="Ascolta ${esc(t.word)}" style="width:32px;height:32px">${icon("play")}</button><div><b>${esc(t.word)}</b>: ${esc(t.how)}</div></div>`).join("")}`;
      $$("[data-w]", $("#tips")).forEach(b=>b.onclick=()=>Voice.speak(b.dataset.w, {rate:0.7}));
    }catch(e){ if($("#tips")) $("#tips").innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span>`; }
  };
  $("#gen").onclick = async () => {
    Pron.focus = $("#focus").value.trim();
    card.innerHTML = loadingHTML("Preparo le frasi…");
    try{
      const r = await ask(`Sei un insegnante di pronuncia del ${L().name.toLowerCase()} per studenti italiani. ${who()} ${JSON_ONLY}`,
        `Crea 6 frasi da leggere ad alta voce, adatte al livello ${S().level}${Pron.focus?`, centrate su: ${Pron.focus}`:", che contengano i suoni più difficili per un italiano"}. Lunghezza crescente.\n`+
        `JSON: {"sentences":[{"text":"frase in ${L().name}","it":"traduzione italiana","tip":"un consiglio breve in italiano sul suono più difficile della frase"}]}`,
        {temperature:0.8, maxTokens:1000}, r=>Array.isArray(r.sentences) && r.sentences.length);
      Pron.list = r.sentences.filter(x=>x.text); Pron.i = 0; drawCard();
    }catch(e){ card.innerHTML = errorHTML(e); }
  };
  $("#useown").onclick = () => { const v = $("#own").value.trim(); if(!v) return; Pron.list = [{text:v, it:"", tip:""}, ...Pron.list]; Pron.i = 0; drawCard(); };
  drawCard();
};
/* ============ GIOCHI ============ */
async function wordPool(n){
  let pool = state.words.filter(w=>w.lang===S().lang);
  if(pool.length >= n) return shuffle(pool).slice(0, n);
  const r = await ask(`Sei un insegnante di ${L().name}. ${who()} ${JSON_ONLY}`,
    `Genera 14 parole o espressioni utili e diverse tra loro, adatte al livello ${S().level}, su temi quotidiani vari.\nJSON: {"words":[{"word":"in ${L().name}","translation":"in italiano (breve)","example":"frase breve d'esempio in ${L().name}"}]}`,
    {temperature:0.9, maxTokens:1200}, r=>Array.isArray(r.words) && r.words.length>=6);
  for(const v of r.words){
    if(v.word && v.translation && !state.words.some(w=>w.lang===S().lang && bare(w.word)===bare(v.word)))
      state.words.push({id:uid(), lang:S().lang, word:v.word, translation:v.translation, example:v.example||"", box:1, due:today()});
  }
  save();
  pool = state.words.filter(w=>w.lang===S().lang);
  return shuffle(pool).slice(0, n);
}

RENDER.giochi = main => {
  const parts = location.hash.slice(1).split("-");
  if(parts[1] && GAMES[parts[1]]) return startGame(main, parts[1]);
  main.innerHTML = `
  <h1>Giochi</h1>
  <p class="muted">Usano le parole che hai imparato nelle lezioni. Se sono poche, ne aggiungo io di nuove al tuo ripasso.</p>
  ${needsSetup()}
  <div class="grid2" style="margin-top:16px">
    <button class="action" data-g="coppie"><span class="ic">${icon("cards")}</span><span><h3>Coppie</h3><span class="muted small">Abbina ogni parola alla sua traduzione, più veloce che puoi</span></span></button>
    <button class="action" data-g="sprint"><span class="ic">${icon("fire")}</span><span><h3>Sprint da 60 secondi</h3><span class="muted small">Vero o falso: la traduzione è giusta?</span></span></button>
    <button class="action" data-g="ascolto"><span class="ic">${icon("play")}</span><span><h3>Ascolto lampo</h3><span class="muted small">Senti una parola e scegli quella giusta</span></span></button>
    <button class="action" data-g="dettato"><span class="ic">${icon("mic")}</span><span><h3>Di' la parola</h3><span class="muted small">Vedi la traduzione e pronunciala in ${L().name.toLowerCase()}</span></span></button>
  </div>`;
  $$("[data-g]", main).forEach(b=>b.onclick=()=>location.hash="giochi-"+b.dataset.g);
};
function startGame(main, id){
  main.innerHTML = `<button class="btn ghost sm" id="back">${icon("back")} Giochi</button><div id="game" style="margin-top:16px">${loadingHTML("Preparo il gioco…")}</div>`;
  $("#back").onclick = () => location.hash = "giochi";
  wordPool(GAMES[id].need).then(pool=>{
    if(!$("#game")) return;
    if(pool.length < 4) throw new Error("Servono almeno 4 parole: completa una lezione.");
    GAMES[id].run($("#game"), pool);
  }).catch(e=>{ if($("#game")) $("#game").innerHTML = errorHTML(e); });
}
function gameOver(box, title, line, xp, id){
  addXP(xp);
  box.innerHTML = `<div class="panel stack" style="text-align:center;align-items:center">${avatarSVG(S().persona,110)}<h2>${esc(title)}</h2><p class="muted">${esc(line)}</p>
    <div class="row"><button class="btn" id="again">Gioca ancora</button><button class="btn ghost" id="out">Altri giochi</button></div></div>`;
  $("#again").onclick = () => { location.hash = "giochi"; setTimeout(()=>location.hash = "giochi-"+id, 0); };
  $("#out").onclick = () => location.hash = "giochi";
}
const GAMES = {
  coppie:{need:6, run(box, pool){
    const pairs = pool.slice(0,6); const t0 = Date.now(); let sel = null, left = pairs.length, errors = 0;
    const L1 = shuffle(pairs.map(p=>({id:p.id, t:p.word, side:"a"}))), L2 = shuffle(pairs.map(p=>({id:p.id, t:p.translation, side:"b"})));
    box.innerHTML = `<div class="row" style="justify-content:space-between"><h2 style="margin:0">Coppie</h2><span class="timer" id="tm">0 s</span></div>
      <div class="pairs" style="margin-top:14px"><div class="stack" style="gap:10px">${L1.map(x=>`<button class="pair" data-id="${x.id}" data-s="a">${esc(x.t)}</button>`).join("")}</div>
      <div class="stack" style="gap:10px">${L2.map(x=>`<button class="pair" data-id="${x.id}" data-s="b">${esc(x.t)}</button>`).join("")}</div></div>`;
    const tick = setInterval(()=>{ const el = $("#tm"); if(!el) return clearInterval(tick); el.textContent = Math.round((Date.now()-t0)/1000)+" s"; }, 500);
    cleanup = () => clearInterval(tick);
    $$(".pair", box).forEach(b=>b.onclick=()=>{
      if(b.classList.contains("gone")) return;
      if(b.dataset.s==="a") Voice.speak(b.textContent);
      if(!sel || sel.dataset.s===b.dataset.s){ if(sel) sel.classList.remove("sel"); sel = b; b.classList.add("sel"); return; }
      if(sel.dataset.id===b.dataset.id){
        sel.classList.add("gone"); b.classList.add("gone"); sel = null;
        if(--left===0){ clearInterval(tick); const s = Math.round((Date.now()-t0)/1000); gameOver(box, "Tutte abbinate!", `${s} secondi, ${errors} errori.`, Math.max(5, 15-errors*2), "coppie"); }
      } else {
        errors++; [sel,b].forEach(x=>{ x.classList.add("shake"); setTimeout(()=>x.classList.remove("shake","sel"),400); }); sel = null;
      }
    });
  }},
  sprint:{need:12, run(box, pool){
    let score = 0, wrongs = 0, end = Date.now()+60000, cur;
    box.innerHTML = `<div class="row" style="justify-content:space-between"><h2 style="margin:0">Sprint</h2><span class="timer" id="tm">60</span></div>
      <div class="panel sprint-card" style="margin-top:14px"><div class="w" id="w"></div><p class="muted" style="font-size:1.3rem" id="t"></p>
      <div class="row" style="justify-content:center;margin-top:20px"><button class="btn ghost" id="no" style="min-width:130px">✗ Falso</button><button class="btn" id="yes" style="min-width:130px">✓ Vero</button></div>
      <p class="small muted" style="margin-top:14px">Puoi usare le frecce ← e → della tastiera</p><p class="timer" id="sc">0 punti</p></div>`;
    const next = () => {
      const w = pool[Math.floor(Math.random()*pool.length)], truth = Math.random() < .5;
      const other = pool.filter(x=>x.id!==w.id); const shown = truth || !other.length ? w.translation : other[Math.floor(Math.random()*other.length)].translation;
      cur = {truth: shown===w.translation}; $("#w").textContent = w.word; $("#t").textContent = shown;
    };
    const answer = v => {
      if(!cur) return;
      if(v===cur.truth){ score++; } else { wrongs++; box.querySelector(".sprint-card").classList.add("shake"); setTimeout(()=>box.querySelector(".sprint-card")?.classList.remove("shake"),350); }
      $("#sc").textContent = score+" punti"; next();
    };
    const key = e => { if(e.key==="ArrowRight") answer(true); if(e.key==="ArrowLeft") answer(false); };
    document.addEventListener("keydown", key);
    $("#yes").onclick = () => answer(true); $("#no").onclick = () => answer(false);
    const tick = setInterval(()=>{
      const left = Math.max(0, Math.ceil((end-Date.now())/1000)); const el = $("#tm"); if(!el){ clearInterval(tick); return; }
      el.textContent = left;
      if(left===0){ clearInterval(tick); document.removeEventListener("keydown", key); gameOver(box, `${score} punti`, `Risposte giuste: ${score}, sbagliate: ${wrongs}.`, Math.min(25, 3+score), "sprint"); }
    }, 250);
    cleanup = () => { clearInterval(tick); document.removeEventListener("keydown", key); };
    next();
  }},
  ascolto:{need:8, run(box, pool){
    const rounds = pool.slice(0, Math.min(8, pool.length)); let i = 0, ok = 0;
    const show = () => {
      if(i >= rounds.length) return gameOver(box, `${ok} su ${rounds.length}`, "Allenare l'orecchio aiuta anche a parlare meglio.", 4+ok*2, "ascolto");
      const w = rounds[i]; const opts = shuffle([w, ...shuffle(pool.filter(x=>x.id!==w.id)).slice(0,3)]);
      box.innerHTML = `<div class="row" style="justify-content:space-between"><h2 style="margin:0">Ascolto lampo</h2><span class="timer">${i+1}/${rounds.length}</span></div>
        <div class="panel" style="margin-top:14px;text-align:center"><button class="mic" id="pl" aria-label="Riascolta" style="margin:10px auto 20px">${icon("play")}</button>
        <div class="options">${opts.map(o=>`<button class="opt" data-id="${o.id}">${esc(o.word)}</button>`).join("")}</div><div id="fb"></div></div>`;
      $("#pl").onclick = () => Voice.speak(w.word);
      setTimeout(()=>Voice.speak(w.word), 250);
      let done = false;
      $$(".opt", box).forEach(b=>b.onclick=()=>{
        if(done) return; done = true;
        const good = b.dataset.id===w.id; if(good) ok++;
        $$(".opt", box).forEach(x=>{ if(x.dataset.id===w.id) x.classList.add("right"); }); if(!good) b.classList.add("wrong");
        $("#fb").innerHTML = `<p style="margin-top:14px"><b>${esc(w.word)}</b> = ${esc(w.translation)}</p><button class="btn" id="nx">Continua</button>`;
        $("#nx").onclick = () => { i++; show(); }; $("#nx").focus();
      });
    };
    show();
  }},
  dettato:{need:6, run(box, pool){
    const rounds = pool.slice(0, 6); let i = 0, ok = 0, session = null;
    cleanup = () => { if(session) session.stop(); };
    const show = () => {
      if(i >= rounds.length) return gameOver(box, `${ok} su ${rounds.length}`, "Dire le parole ad alta voce le fissa meglio nella memoria.", 4+ok*2, "dettato");
      const w = rounds[i];
      box.innerHTML = `<div class="row" style="justify-content:space-between"><h2 style="margin:0">Di' la parola</h2><span class="timer">${i+1}/${rounds.length}</span></div>
        <div class="panel sprint-card" style="margin-top:14px"><p class="muted">Come si dice in ${L().name.toLowerCase()}…</p><div class="w">${esc(w.translation)}</div>
        <button class="mic" id="mic" style="margin:22px auto 10px" aria-label="Parla">${icon("mic")}</button><p id="heard" class="muted">Premi e pronuncia la parola</p><div id="fb"></div></div>`;
      $("#mic").onclick = async () => {
        if(session){ session.stop(); return; }
        const mic = $("#mic"); mic.classList.add("on"); mic.innerHTML = icon("stop");
        session = Voice.listen({onInterim: t => $("#heard").textContent = t || "Ti ascolto…"});
        let r = null;
        try{ r = await session; }catch(e){ $("#heard").textContent = e.message; }
        session = null; if(!$("#mic")) return; mic.classList.remove("on"); mic.innerHTML = icon("mic");
        if(!r) return;
        const best = Math.max(...r.alts.map(a=>align(w.word, a.text).score));
        const good = best >= 75; if(good) ok++;
        $("#heard").textContent = `Ho capito: “${r.text}”`;
        $("#fb").innerHTML = `<div class="feedback ${good?"good":"bad"}"><h3>${good?"Giusto!":"Era: "+esc(w.word)}</h3><button class="btn ghost sm" id="hear">${icon("play")} Ascolta</button> <button class="btn" id="nx">Continua</button></div>`;
        $("#hear").onclick = () => Voice.speak(w.word);
        $("#nx").onclick = () => { i++; show(); };
        if(!good) Voice.speak(w.word);
      };
    };
    show();
  }}
};

/* ============ RIPASSO ============ */
function review(w, knew){
  w.box = knew ? Math.min((w.box||1)+1, BOX_DAYS.length-1) : 1;
  const d = new Date(); d.setDate(d.getDate() + BOX_DAYS[w.box]); w.due = d.toISOString().slice(0,10);
  save();
}
RENDER.ripasso = main => {
  const tab = location.hash.slice(1).split("-")[1] || "schede";
  main.innerHTML = `
  <h1>Ripasso</h1>
  <div class="row" style="margin-bottom:16px">
    <a class="chip ${tab==="schede"?"on":""}" href="#ripasso-schede">Schede di oggi (${dueWords().length})</a>
    <a class="chip ${tab==="parole"?"on":""}" href="#ripasso-parole">Tutte le parole</a>
    <a class="chip ${tab==="errori"?"on":""}" href="#ripasso-errori">I miei errori</a>
  </div><div id="rv"></div>`;
  const box = $("#rv");
  if(tab==="parole"){
    const list = state.words.filter(w=>w.lang===S().lang);
    box.innerHTML = list.length ? `<div class="row" style="margin-bottom:10px"><input class="input" id="q" placeholder="Cerca una parola" style="max-width:320px"></div>
      <div class="panel" style="overflow-x:auto"><table class="list"><tbody id="tb"></tbody></table></div>
      <div class="row" style="margin-top:14px"><input class="input" id="nw" placeholder="Nuova parola in ${L().name.toLowerCase()}" style="max-width:220px"><input class="input" id="nt" placeholder="Traduzione" style="max-width:220px"><button class="btn ghost" id="add">Aggiungi</button></div>`
      : `<div class="panel"><p>Non hai ancora parole in ${L().name.toLowerCase()}. Completa una lezione o fai un gioco e le troverai qui.</p><a class="btn" href="#lezioni">Vai alle lezioni</a></div>`;
    if(!list.length) return;
    const draw = q => {
      $("#tb").innerHTML = list.filter(w=>!q || bare(w.word+" "+w.translation).includes(bare(q))).map(w=>`<tr><td><button class="iconbtn" data-s="${w.id}" aria-label="Ascolta" style="width:32px;height:32px">${icon("play")}</button></td><td><b>${esc(w.word)}</b><br><span class="small muted">${esc(w.example||"")}</span></td><td>${esc(w.translation)}</td><td class="small muted">livello ${w.box||1}</td><td><button class="btn ghost sm" data-del="${w.id}">Elimina</button></td></tr>`).join("");
      $$("[data-s]", box).forEach(b=>b.onclick=()=>Voice.speak(list.find(w=>w.id===b.dataset.s).word));
      $$("[data-del]", box).forEach(b=>b.onclick=()=>{ state.words = state.words.filter(w=>w.id!==b.dataset.del); save(); route(); });
    };
    draw(""); $("#q").oninput = e => draw(e.target.value);
    $("#add").onclick = () => { const w = $("#nw").value.trim(), t = $("#nt").value.trim(); if(!w||!t) return;
      state.words.push({id:uid(), lang:S().lang, word:w, translation:t, example:"", box:1, due:today()}); save(); route(); };
    return;
  }
  if(tab==="errori"){
    const list = state.mistakes.filter(m=>m.lang===S().lang);
    box.innerHTML = list.length ? `<div class="panel stack">${list.slice(0,60).map(m=>`<div><s class="muted">${esc(m.wrong)}</s> → <b>${esc(m.right)}</b>${m.why?`<div class="small muted">${esc(m.why)}</div>`:""}</div>`).join("")}</div>
      <p style="margin-top:14px"><button class="btn" id="drill">Fammi un esercizio sui miei errori</button></p><div id="drillbox"></div>`
      : `<div class="panel"><p>Nessun errore registrato per ora. Quando sbagli in una lezione o parlando con il tutor, la correzione finisce qui.</p></div>`;
    if(!list.length) return;
    $("#drill").onclick = async () => {
      const db = $("#drillbox"); db.innerHTML = loadingHTML("Preparo gli esercizi sui tuoi errori…");
      try{
        const r = await ask(`Sei un insegnante di ${L().name}. ${who()} ${JSON_ONLY}`,
          `Ecco gli errori recenti dello studente: ${JSON.stringify(list.slice(0,15).map(m=>({sbagliato:m.wrong, corretto:m.right})))}\n`+
          `Individua i 2-3 problemi ricorrenti e crea 6 esercizi mirati.\nJSON: {"summary":"in italiano, quali sono i punti deboli","exercises":[...]} usando i formati:\n`+
          `{"type":"choice","question":"...","options":["..."],"answer":0,"explain":"..."}\n{"type":"fill","sentence":"frase con ___","answer":"...","hint":"traduzione"}\n{"type":"translate","it":"...","answer":"..."}`,
          {temperature:0.5, maxTokens:1800}, r=>Array.isArray(r.exercises));
        const ex = cleanExercises(r.exercises);
        if(!ex.length) throw new Error("Non sono riuscito a creare esercizi validi. Riprova.");
        const lesson = {title:"I tuoi punti deboli", intro:r.summary||"", vocab:[], grammar:{title:"Cosa ripassare", explanation:r.summary||"", examples:[]}, exercises:ex};
        runExercisesStandalone(main, lesson);
      }catch(e){ db.innerHTML = errorHTML(e); }
    };
    return;
  }
  // Schede
  const due = shuffle(dueWords());
  if(!due.length){
    box.innerHTML = `<div class="panel stack" style="align-items:flex-start"><h2>Niente da ripassare oggi</h2><p class="muted">Le parole tornano qui quando è il momento giusto per ripassarle: dopo 1, 3, 7, 14 e 30 giorni.</p><div class="row"><a class="btn" href="#giochi">Fai un gioco</a><a class="btn ghost" href="#lezioni">Nuova lezione</a></div></div>`;
    return;
  }
  let i = 0, known = 0;
  const show = () => {
    if(i >= due.length){ addXP(Math.min(20, 2+known)); box.innerHTML = `<div class="panel"><h2>Ripasso finito</h2><p>Ne sapevi ${known} su ${due.length}.</p><a class="btn" href="#home">Torna a Oggi</a></div>`; return; }
    const w = due[i];
    box.innerHTML = `<div class="progress" style="margin-bottom:14px"><i style="width:${i/due.length*100}%"></i></div>
      <div class="panel flash" id="fc" tabindex="0" role="button" aria-label="Gira la scheda"><div><div class="w">${esc(w.word)}</div><p class="muted">Tocca per vedere la traduzione</p></div></div>
      <div class="row" style="justify-content:center;margin-top:14px" id="btns" hidden><button class="btn ghost" id="no">Non lo sapevo</button><button class="btn" id="yes">Lo sapevo</button></div>`;
    Voice.speak(w.word);
    const flip = () => { $("#fc").innerHTML = `<div><div class="w">${esc(w.word)}</div><p style="font-size:1.3rem;font-weight:700">${esc(w.translation)}</p>${w.example?`<p class="muted">${esc(w.example)}</p>`:""}</div>`; $("#btns").hidden = false; $("#yes").focus(); if(w.example) Voice.speak(w.example); };
    $("#fc").onclick = flip; $("#fc").onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); flip(); } };
    $("#yes").onclick = () => { review(w, true); known++; i++; show(); };
    $("#no").onclick = () => { review(w, false); i++; show(); };
  };
  show();
};
function runExercisesStandalone(main, lesson){
  const u = {id:"errori", title:lesson.title};
  runExercises(main, u, lesson);
}
