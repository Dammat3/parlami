  async function next(k){
    if(k >= EXAM_SECTIONS.length) return report();
    const sec = EXAM_SECTIONS[k].id;
    if(sec === "read"){
      const r = await gen(k, `Crea la prova di LETTURA del livello ${lv}: un testo originale in ${L().name} di circa ${sp.read} parole (${["A1","A2"].includes(lv)?"per esempio un avviso, un'email o un annuncio":["B1","B2"].includes(lv)?"per esempio un articolo di rivista o un blog":"per esempio un articolo d'opinione o un saggio"}), poi 5 domande di comprensione in ${L().name}, a scelta multipla con 4 opzioni e una sola risposta giusta. Almeno una domanda deve verificare un significato implicito se il livello è B2 o superiore.
JSON: {"title":"titolo del testo","instructions":"consegna in ${L().name}","instructions_it":"consegna in italiano","text":"il testo, con paragrafi separati da \\n\\n","questions":[{"q":"domanda","options":["...","...","...","..."],"answer":0}]}`, r=>r.text && !soundsItalian(r.text) && Array.isArray(r.questions) && r.questions.filter(validMcq).length>=4);
      const qs = r.questions.filter(validMcq);
      main.innerHTML = header(k) + `<section class="panel stack" style="margin-top:12px"><p style="margin:0"><b>${esc(r.instructions||"")}</b><br><span class="small muted">${esc(r.instructions_it||"")}</span></p>
        <article class="reading"><h3>${esc(r.title||"")}</h3>${String(r.text).split(/\n\s*\n/).map(p=>`<p>${esc(p)}</p>`).join("")}</article>
        ${mcqHTML(qs, "r")}<button class="btn" id="submit">Consegna la prova</button></section>`;
      bindBack(); startClock();
      $("#submit").onclick = () => { E.per.read = scoreMcq(qs, "r"); afterMcq(k, E.per.read); };
    }
    else if(sec === "listen"){
      const r = await gen(k, `Crea la prova di ASCOLTO del livello ${lv}: il copione di ${["A1","A2"].includes(lv)?"un dialogo breve tra due persone in una situazione quotidiana":"un dialogo o un'intervista tra due persone"} in ${L().name}, di circa ${sp.listen} parole, naturale e adatto al livello. Poi 5 domande in ${L().name} a scelta multipla con 4 opzioni, a cui si può rispondere solo ascoltando.
JSON: {"context":"descrizione breve della situazione in ${L().name}","context_it":"in italiano","lines":[{"speaker":"A","text":"battuta"},{"speaker":"B","text":"battuta"}],"questions":[{"q":"domanda","options":["...","...","...","..."],"answer":0}]}`, r=>Array.isArray(r.lines) && r.lines.length>=3 && !soundsItalian(r.lines.map(l=>l.text||"").join(" ")) && Array.isArray(r.questions) && r.questions.filter(validMcq).length>=4);
      const qs = r.questions.filter(validMcq); let plays = 0, playing = false;
      main.innerHTML = header(k) + `<section class="panel stack" style="margin-top:12px">
        <p style="margin:0"><b>${esc(r.context||"")}</b><br><span class="small muted">${esc(r.context_it||"")}</span></p>
        <p class="small muted" style="margin:0">Leggi prima le domande. Poi premi Ascolta: puoi sentire la registrazione al massimo due volte, come in un esame vero.</p>
        <div class="row"><button class="btn" id="play">${icon("play")} Ascolta (2 rimasti)</button><span class="small muted" id="pstat"></span></div>
        ${mcqHTML(qs, "l")}<button class="btn" id="submit">Consegna la prova</button>
        <div id="script"></div></section>`;
      bindBack(); startClock();
      const speakers = [...new Set(r.lines.map(x=>x.speaker))];
      $("#play").onclick = async () => {
        if(playing || plays >= 2) return; playing = true; plays++;
        $("#play").disabled = true; $("#pstat").textContent = "In riproduzione…";
        speechSynthesis.cancel();
        for(const line of r.lines){ if(!$("#play")) return; await Voice.speakAs(line.text, speakers.indexOf(line.speaker)); await new Promise(res=>setTimeout(res, 350)); }
        playing = false; if(!$("#play")) return;
        $("#pstat").textContent = ""; $("#play").innerHTML = `${icon("play")} Ascolta (${2-plays} rimast${2-plays===1?"o":"i"})`; $("#play").disabled = plays >= 2;
      };
      $("#submit").onclick = () => { speechSynthesis.cancel(); E.per.listen = scoreMcq(qs, "l"); $("#play").disabled = true;
        $("#script").innerHTML = `<details><summary class="small" style="cursor:pointer">Leggi il testo della registrazione</summary>${r.lines.map(x=>`<p><b>${esc(x.speaker)}:</b> ${esc(x.text)}</p>`).join("")}</details>`;
        afterMcq(k, E.per.listen); };
    }
    else if(sec === "gram"){
      const r = await gen(k, `Crea la prova di GRAMMATICA E LESSICO del livello ${lv}: ${sp.gram} domande a scelta multipla in ${L().name} con 4 opzioni, ciascuna con una frase che contiene ___ al posto della parte mancante. Copri gli argomenti grammaticali e il lessico tipici del livello ${lv}, dal più facile al più difficile.
JSON: {"questions":[{"q":"frase con ___","options":["...","...","...","..."],"answer":0,"why":"spiegazione breve in italiano"}]}`, r=>Array.isArray(r.questions) && r.questions.filter(q=>validMcq(q) && !soundsItalian(q.q)).length>=6);
      main.innerHTML = header(k) + loadingHTML("Controllo che ogni domanda abbia una sola risposta giusta…"); bindBack();
      const qs = await verifyMCQ(r.questions.filter(q => validMcq(q) && !soundsItalian(q.q)), q => q.q);
      main.innerHTML = header(k) + `<section class="panel stack" style="margin-top:12px"><p style="margin:0"><b>Scegli la risposta giusta per completare ogni frase.</b></p>${mcqHTML(qs, "g")}<button class="btn" id="submit">Consegna la prova</button></section>`;
      bindBack(); startClock();
      $("#submit").onclick = () => { E.per.gram = scoreMcq(qs, "g");
        const wrongs = qs.map((q,n)=>({q,n})).filter(({q,n})=>{ const c = document.querySelector(`input[name="g${n}"]:checked`); return !c || +c.value !== +q.answer; });
        wrongs.forEach(({q})=>recordMistake(q.q, q.q.replace("___", q.options[q.answer]), q.why||""));
        afterMcq(k, E.per.gram, wrongs.length ? `<div class="stack" style="gap:6px;margin-bottom:10px">${wrongs.map(({q})=>`<p class="small" style="margin:0">${esc(q.q.replace("___", "“"+q.options[q.answer]+"”"))}${q.why?` · ${esc(q.why)}`:""}</p>`).join("")}</div>` : ""); };
    }
    else if(sec === "write"){
      const r = await gen(k, `Crea la prova di SCRITTURA del livello ${lv}: il candidato deve scrivere ${sp.task} di ${sp.write[0]}-${sp.write[1]} parole. Scrivi una consegna realistica in ${L().name} come in un esame ufficiale, con la situazione e i punti da includere.
JSON: {"task":"consegna completa in ${L().name}","task_it":"traduzione italiana della consegna","points":["punto da includere 1","punto 2","punto 3"]}`, r=>r.task, 900);
      main.innerHTML = header(k) + `<section class="panel stack" style="margin-top:12px">
        <div class="taskbox"><p style="margin:0">${esc(r.task)}</p>${Array.isArray(r.points)&&r.points.length?`<ul style="margin:8px 0 0">${r.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}</div>
        <details><summary class="small" style="cursor:pointer">Traduzione della consegna</summary><p class="muted">${esc(r.task_it||"")}</p></details>
        <textarea class="input" id="essay" rows="12" placeholder="Scrivi qui in ${L().name.toLowerCase()}…" spellcheck="false" autocapitalize="sentences"></textarea>
        <div class="row" style="justify-content:space-between"><span class="small" id="wc">0 parole · richieste ${sp.write[0]}–${sp.write[1]}</span><button class="btn" id="submit">Consegna e fai correggere</button></div>
        <div id="wres"></div></section>`;
      bindBack(); startClock();
      const count = () => (NOSPACE.includes(S().lang) ? Math.round([...$("#essay").value.replace(/\s/g,"")].length/2) : $("#essay").value.trim().split(/\s+/).filter(Boolean).length);
      $("#essay").oninput = () => { const n = count(); $("#wc").innerHTML = `<span class="${n<sp.write[0]?"":n>sp.write[1]*1.15?"status-bad":"status-ok"}">${n} parole</span> · richieste ${sp.write[0]}–${sp.write[1]}`; };
      $("#submit").onclick = async () => {
        const txt = $("#essay").value.trim(), n = count();
        if(n < Math.max(5, sp.write[0]*0.3) && !confirm("Il testo è molto più corto del richiesto e verrà valutato così. Consegnare lo stesso?")) return;
        $("#submit").disabled = true; $("#essay").readOnly = true; $("#wres").innerHTML = loadingHTML("L'esaminatore sta correggendo…");
        try{
          const g = await ask(`Sei un esaminatore certificato di ${L().name} per gli esami QCER di livello ${lv}. Valuti in modo severo ma giusto, come in un esame vero. ${JSON_ONLY}`,
            `Consegna: ${r.task}\nPunti richiesti: ${JSON.stringify(r.points||[])}\nLunghezza richiesta: ${sp.write[0]}-${sp.write[1]} parole. Lunghezza del testo: ${n} parole.\nTesto del candidato:\n"""${txt || "(vuoto)"}"""\n`+
            `Valuta con 4 criteri da 0 a 5 per il livello ${lv}: content (ha svolto tutti i punti? un testo troppo corto perde punti), communicative (scopo e registro adatti), organisation (struttura, coerenza, connettivi), language (correttezza e varietà di grammatica e lessico per il livello).\n`+
            `JSON: {"scores":{"content":0,"communicative":0,"organisation":0,"language":0},"feedback":"giudizio in italiano di 2-4 frasi","corrections":[{"wrong":"...","right":"...","why":"spiegazione breve in italiano"}],"better":"come si potrebbero riscrivere 2-3 frasi del testo per un punteggio più alto"}`,
            {temperature:0.2, maxTokens:1500}, g=>g.scores && typeof g.scores.content==="number");
          const sc = g.scores, tot = ["content","communicative","organisation","language"].reduce((a,c)=>a+Math.max(0,Math.min(5,+sc[c]||0)),0);
          E.per.write = Math.round(tot/20*100); E.detail.write = g;
          (g.corrections||[]).slice(0,6).forEach(c=>recordMistake(c.wrong, c.right, c.why));
          $("#wres").innerHTML = `<div class="feedback ${E.per.write>=60?"good":"bad"}"><h3>Risultato della prova: ${E.per.write}%</h3>
            <div class="row" style="margin-bottom:8px">${[["content","Contenuto"],["communicative","Efficacia"],["organisation","Organizzazione"],["language","Lingua"]].map(([c,nm])=>`<span class="chip">${nm}: ${sc[c]}/5</span>`).join("")}</div>
            <p>${esc(g.feedback||"")}</p>
            ${(g.corrections||[]).length?`<div class="stack" style="gap:4px;margin-bottom:8px">${g.corrections.slice(0,6).map(c=>`<p class="small" style="margin:0"><s>${esc(c.wrong)}</s> → <b>${esc(c.right)}</b>${c.why?` · ${esc(c.why)}`:""}</p>`).join("")}</div>`:""}
            ${g.better?`<p class="small"><b>Per migliorare:</b> ${esc(g.better)}</p>`:""}
            <button class="btn" id="cont">Prova successiva</button></div>`;
          $("#cont").onclick = () => next(k+1);
        }catch(e){ $("#submit").disabled = false; $("#essay").readOnly = false; $("#wres").innerHTML = errorHTML(e); }
      };
    }
    else if(sec === "speak"){
      const r = await gen(k, `Crea la prova ORALE del livello ${lv}, come in un esame ufficiale, in ${L().name}.
Parte 1: ${sp.part1} domande personali dell'esaminatore, adatte al livello.
Parte 2: un argomento su cui il candidato parla da solo per ${sp.long} secondi, con 3 spunti.
${sp.part3 ? `Parte 3: ${sp.part3} domande di discussione più ampie legate all'argomento della parte 2.` : "Nessuna parte 3."}
JSON: {"part1":["domanda"],"part2":{"topic":"argomento in ${L().name}","topic_it":"in italiano","prompts":["spunto 1","spunto 2","spunto 3"]},"part3":["domanda"]}`, r=>Array.isArray(r.part1) && !soundsItalian(r.part1.join(" ")) && r.part1.length && r.part2?.topic, 1200);
      const steps = [
        ...r.part1.slice(0, sp.part1).map(q=>({part:1, q, max:45})),
        {part:2, q:r.part2.topic, it:r.part2.topic_it, prompts:r.part2.prompts||[], max:sp.long, prep:sp.prep},
        ...(sp.part3 ? (r.part3||[]).slice(0, sp.part3).map(q=>({part:3, q, max:60})) : [])
      ];
      const answers = []; let s = 0;
      const step = () => {
        if(s >= steps.length) return grade();
        const st = steps[s];
        main.innerHTML = header(k) + `<section class="panel stack" style="margin-top:12px">
          <div class="row" style="flex-wrap:nowrap;align-items:center">${avatarSVG(S().persona, 90)}<div><span class="small muted">Parte ${st.part} · domanda ${s+1} di ${steps.length}</span>
          <p class="bigsent" style="font-size:1.3rem;margin:4px 0">${esc(st.q)}</p>${st.it?`<p class="small muted" style="margin:0">${esc(st.it)}</p>`:""}</div></div>
          ${st.prompts?.length ? `<div class="taskbox"><p class="small" style="margin:0 0 4px"><b>Puoi parlare di:</b></p><ul style="margin:0">${st.prompts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>` : ""}
          <div class="row"><button class="btn ghost sm" id="rep">${icon("play")} Riascolta la domanda</button></div>
          <div id="stage"></div></section>`;
        bindBack();
        $("#rep").onclick = () => Voice.speak(st.q);
        const stage = $("#stage");
        const speakNow = () => {
          let left = st.max, text = "";
          stage.innerHTML = `<div class="row"><button class="mic on" id="mic" aria-label="Ho finito">${icon("stop")}</button><div><span class="timer" id="cd">${left}</span><span class="small muted"> secondi · parla adesso, poi premi Stop</span></div></div>
            <p class="muted" id="live" style="min-height:3em"></p><button class="btn ghost sm" id="type2">Non posso parlare ora</button>`;
          micSession = Voice.listenLong({onText: t => { text = t; const lv = $("#live"); if(lv) lv.textContent = t; }});
          const t0 = Date.now();
          const tick = setInterval(()=>{ const cd = $("#cd"); if(!cd){ clearInterval(tick); return; } left = st.max - Math.floor((Date.now()-t0)/1000); cd.textContent = Math.max(0,left); if(left <= -10) finish(); }, 250);
          let finishing = false;
          const finish = async () => {
            if(finishing) return; finishing = true; clearInterval(tick);
            const res = await micSession.stop(); micSession = null;
            if(res.error){ stage.innerHTML = `<div class="err">${esc(res.error)}</div><p><button class="btn ghost" id="type">Scrivi la risposta invece di parlare</button></p>`; $("#type").onclick = typeIt; return; }
            answers[s] = {part:st.part, q:st.q, a:res.text || text, secs:Math.round((Date.now()-t0)/1000), conf:res.conf, typed:false};
            s++; step();
          };
          $("#mic").onclick = finish;
          $("#type2").onclick = () => { clearInterval(tick); finishing = true; if(micSession){ micSession.stop(); micSession = null; } typeIt(); };
        };
        const typeIt = () => {
          stage.innerHTML = `<textarea class="input" id="ta" rows="4" placeholder="Scrivi la risposta in ${L().name.toLowerCase()}"></textarea><p class="small muted">Le risposte scritte non permettono di valutare scioltezza e pronuncia.</p><button class="btn" id="ok">Conferma</button>`;
          $("#ok").onclick = () => { answers[s] = {part:st.part, q:st.q, a:$("#ta").value.trim(), secs:0, conf:0, typed:true}; s++; step(); };
        };
        const ready = () => {
          stage.innerHTML = `<div class="row"><button class="btn" id="start">${icon("mic")} Rispondi</button><button class="btn ghost sm" id="type">Non posso parlare ora</button></div>`;
          $("#start").onclick = speakNow; $("#type").onclick = typeIt;
        };
        Voice.speak(st.q).then(()=>{
          if(!$("#stage")) return;
          if(st.prep){
            let p = st.prep; stage.innerHTML = `<p><span class="timer" id="pp">${p}</span> secondi per prepararti. Pensa a cosa dire sugli spunti.</p><button class="btn ghost sm" id="skipprep">Sono pronto</button>`;
            const pt = setInterval(()=>{ const el = $("#pp"); if(!el){ clearInterval(pt); return; } p--; el.textContent = p; if(p<=0){ clearInterval(pt); speakNow(); } }, 1000);
            $("#skipprep").onclick = () => { clearInterval(pt); speakNow(); };
          } else ready();
        });
      };
      const grade = async () => {
        main.innerHTML = header(k) + loadingHTML("L'esaminatore sta valutando l'orale…"); bindBack();
        const spoken = answers.filter(a=>!a.typed && a.a);
        const confAvg = spoken.filter(a=>a.conf>0).length ? spoken.filter(a=>a.conf>0).reduce((x,a)=>x+a.conf,0)/spoken.filter(a=>a.conf>0).length : 0;
        const pron = confAvg ? Math.max(0, Math.min(5, Math.round((confAvg-0.5)/0.45*5))) : null;
        try{
          const g = await ask(`Sei un esaminatore certificato di ${L().name} per gli esami orali QCER di livello ${lv}. Valuti in modo severo ma giusto, come in un esame vero. Ricevi la trascrizione automatica delle risposte: ignora punteggiatura e maiuscole. ${JSON_ONLY}`,
            `Risposte del candidato:\n${answers.map((a,n)=>`${n+1}. [parte ${a.part}] Domanda: ${a.q}\nRisposta${a.typed?" (scritta, non parlata)":` (parlata per ${a.secs} secondi)`}: ${a.a || "(nessuna risposta)"}`).join("\n")}\n`+
            `Il discorso della parte 2 doveva durare circa ${sp.long} secondi.\nValuta con 4 criteri da 0 a 5 per il livello ${lv}: grammar_vocab (correttezza e varietà), discourse (sviluppo e collegamento delle idee, risposte abbastanza lunghe), relevance (risposte pertinenti alle domande), fluency (quantità di discorso rispetto al tempo; se le risposte sono scritte, giudica solo la lunghezza).\n`+
            `JSON: {"scores":{"grammar_vocab":0,"discourse":0,"relevance":0,"fluency":0},"feedback":"giudizio in italiano di 2-4 frasi","corrections":[{"wrong":"...","right":"...","why":"..."}],"tips":["consiglio pratico in italiano"]}`,
            {temperature:0.2, maxTokens:1500}, g=>g.scores && typeof g.scores.grammar_vocab==="number");
          const sc = g.scores, keys = ["grammar_vocab","discourse","relevance","fluency"];
          let tot = keys.reduce((a,c)=>a+Math.max(0,Math.min(5,+sc[c]||0)),0), max = 20;
          if(pron !== null){ tot += pron; max += 5; }
          E.per.speak = Math.round(tot/max*100); E.detail.speak = {...g, pron, answers};
          (g.corrections||[]).slice(0,6).forEach(c=>recordMistake(c.wrong, c.right, c.why));
          main.innerHTML = header(k) + `<section class="panel stack" style="margin-top:12px"><div class="feedback ${E.per.speak>=60?"good":"bad"}" style="margin:0"><h3>Risultato della prova: ${E.per.speak}%</h3>
            <div class="row" style="margin-bottom:8px">${[["grammar_vocab","Grammatica e lessico"],["discourse","Sviluppo del discorso"],["relevance","Pertinenza"],["fluency","Scioltezza"]].map(([c,nm])=>`<span class="chip">${nm}: ${sc[c]}/5</span>`).join("")}${pron!==null?`<span class="chip">Comprensibilità: ${pron}/5</span>`:""}</div>
            <p>${esc(g.feedback||"")}</p>
            ${(g.corrections||[]).length?`<div class="stack" style="gap:4px;margin-bottom:8px">${g.corrections.slice(0,6).map(c=>`<p class="small" style="margin:0"><s>${esc(c.wrong)}</s> → <b>${esc(c.right)}</b>${c.why?` · ${esc(c.why)}`:""}</p>`).join("")}</div>`:""}
            ${(g.tips||[]).length?`<ul class="small">${g.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}
            <p class="small muted">La comprensibilità è stimata da quanto bene il riconoscimento vocale ha capito le tue parole: è un'indicazione, non un giudizio sulla pronuncia come quello di un esaminatore umano.</p>
            <button class="btn" id="cont">Vedi il risultato</button></div></section>`;
          bindBack(); $("#cont").onclick = () => next(k+1);
        }catch(e){ main.innerHTML = header(k) + errorHTML(e, "retry"); bindBack(); $("#retry").onclick = grade; }
      };
      step();
    }
  }

  function report(){
    clearInterval(clockT);
    const per = E.per, overall = Math.round(EXAM_SECTIONS.reduce((a,s)=>a+(per[s.id]||0),0)/EXAM_SECTIONS.length);
    const v = verdictOf(overall, per);
    const weak = EXAM_SECTIONS.filter(s=>(per[s.id]||0) < 60);
    const advice = {read:["Lettura","fai le lezioni del livello e leggi i testi della Storia a bivi","#lezioni-"+lv], listen:["Ascolto","gioca ad Ascolto lampo e parla con il tutor a voce","#giochi-ascolto"],
      gram:["Grammatica e lessico","ripassa gli errori e fai gli esercizi mirati","#ripasso-errori"], write:["Scrittura","scrivi al tutor invece di parlare, così ti corregge ogni frase","#tutor"],
      speak:["Orale","conversa con il tutor ogni giorno e allena la pronuncia","#tutor"]};
    const rec = {date:today(), overall, verdict:v.t, per};
    state.exams = state.exams || {}; state.exams[examKey(lv)] = [rec, ...examHistory(lv)].slice(0,5); save();
    addXP(30);
    const mins = Math.round((Date.now()-E.t0)/60000);
    main.innerHTML = `<button class="btn ghost sm" id="back2">${icon("back")} Esami</button>
      <h1 style="margin-top:18px">Risultato dell'esame ${lv}</h1>
      <section class="panel stack verdict ${v.k}">
        <div class="row" style="align-items:center;gap:20px"><div class="score">${overall}%</div><div><h2 style="margin:0">${v.t}</h2><p style="margin:4px 0 0">${v.d}</p></div></div>
        <div class="stack" style="gap:10px">${EXAM_SECTIONS.map(s=>`<div><div class="row" style="justify-content:space-between"><span><b>${s.name}</b> <span class="small muted">${s.en}</span></span><b>${per[s.id]??0}%</b></div>
          <div class="progress"><i style="width:${per[s.id]||0}%;background:${(per[s.id]||0)>=60?"var(--ok)":(per[s.id]||0)>=40?"var(--sun)":"var(--bad)"}"></i></div></div>`).join("")}</div>
        <p class="small muted" style="margin:0">Durata: ${mins} minuti. Per passare un esame vero di solito serve circa il 60% complessivo, senza nessuna prova troppo bassa. È una stima: gli esami ufficiali hanno criteri e punteggi propri.</p>
      </section>
      ${weak.length ? `<section class="panel stack" style="margin-top:16px"><h2 style="margin:0">Su cosa allenarti</h2>${weak.map(s=>{ const [nm, txt, href] = advice[s.id]; return `<p style="margin:0"><b>${nm}</b>: ${txt}. <a href="${href}">Vai</a></p>`; }).join("")}</section>` : ""}
      <div class="row" style="margin-top:16px"><a class="btn" href="#esami">Torna agli esami</a>${v.k==="great" && LEVELS.indexOf(lv)<LEVELS.length-1 ? `<a class="btn sun" href="#esami-${LEVELS[LEVELS.indexOf(lv)+1]}">Prova l'esame ${LEVELS[LEVELS.indexOf(lv)+1]}</a>` : ""}</div>`;
    $("#back2").onclick = () => location.hash = "esami";
  }
}

/* ============ RIPASSO ============ */
function review(w, knew){
  w.box = knew ? Math.min((w.box||1)+1, BOX_DAYS.length-1) : 1;
  const d = new Date(); d.setDate(d.getDate() + BOX_DAYS[w.box]); w.due = d.toISOString().slice(0,10);
  save();
}
RENDER.ripasso = main => {
  const tab = location.hash.slice(1).split("-")[1] || "schede";
  main.innerHTML = `
  <h1>Ripasso</h1>
  <div class="row" style="margin-bottom:16px">
    <a class="chip ${tab==="schede"?"on":""}" href="#ripasso-schede">Schede di oggi (${dueWords().length})</a>
    <a class="chip ${tab==="parole"?"on":""}" href="#ripasso-parole">Tutte le parole</a>
    <a class="chip ${tab==="errori"?"on":""}" href="#ripasso-errori">I miei errori</a>
  </div><div id="rv"></div>`;
  const box = $("#rv");
  if(tab==="parole"){
    const list = state.words.filter(w=>w.lang===S().lang);
    box.innerHTML = list.length ? `<div class="row" style="margin-bottom:10px"><input class="input" id="q" placeholder="Cerca una parola" style="max-width:320px"></div>
      <div class="panel" style="overflow-x:auto"><table class="list"><tbody id="tb"></tbody></table></div>
      <div class="row" style="margin-top:14px"><input class="input" id="nw" placeholder="Nuova parola in ${L().name.toLowerCase()}" style="max-width:220px"><input class="input" id="nt" placeholder="Traduzione" style="max-width:220px"><button class="btn ghost" id="add">Aggiungi</button></div>`
      : `<div class="panel"><p>Non hai ancora parole in ${L().name.toLowerCase()}. Completa una lezione o fai un gioco e le troverai qui.</p><a class="btn" href="#lezioni">Vai alle lezioni</a></div>`;
    if(!list.length) return;
    const draw = q => {
      $("#tb").innerHTML = list.filter(w=>!q || bare(w.word+" "+w.translation).includes(bare(q))).map(w=>`<tr><td><button class="iconbtn" data-s="${w.id}" aria-label="Ascolta" style="width:32px;height:32px">${icon("play")}</button></td><td><b>${esc(w.word)}</b><br><span class="small muted">${esc(w.example||"")}</span></td><td>${esc(w.translation)}</td><td class="small muted">livello ${w.box||1}</td><td><button class="btn ghost sm" data-del="${w.id}">Elimina</button></td></tr>`).join("");
      $$("[data-s]", box).forEach(b=>b.onclick=()=>Voice.speak(list.find(w=>w.id===b.dataset.s).word));
      $$("[data-del]", box).forEach(b=>b.onclick=()=>{ state.words = state.words.filter(w=>w.id!==b.dataset.del); save(); route(); });
    };
    draw(""); $("#q").oninput = e => draw(e.target.value);
    $("#add").onclick = () => { const w = $("#nw").value.trim(), t = $("#nt").value.trim(); if(!w||!t) return;
      state.words.push({id:uid(), lang:S().lang, word:w, translation:t, example:"", box:1, due:today()}); save(); route(); };
    return;
  }
  if(tab==="errori"){
    const list = state.mistakes.filter(m=>m.lang===S().lang);
    box.innerHTML = list.length ? `<div class="panel stack">${list.slice(0,60).map(m=>`<div><s class="muted">${esc(m.wrong)}</s> → <b>${esc(m.right)}</b>${m.why?`<div class="small muted">${esc(m.why)}</div>`:""}</div>`).join("")}</div>
      <p style="margin-top:14px"><button class="btn" id="drill">Fammi un esercizio sui miei errori</button></p><div id="drillbox"></div>`
      : `<div class="panel"><p>Nessun errore registrato per ora. Quando sbagli in una lezione o parlando con il tutor, la correzione finisce qui.</p></div>`;
    if(!list.length) return;
    $("#drill").onclick = async () => {
      const db = $("#drillbox"); db.innerHTML = loadingHTML("Preparo gli esercizi sui tuoi errori…");
      try{
        const r = await ask(`Sei un insegnante di ${L().name}. ${who()} ${JSON_ONLY}`,
          `Ecco gli errori recenti dello studente: ${JSON.stringify(list.slice(0,15).map(m=>({sbagliato:m.wrong, corretto:m.right})))}\n`+
          `Individua i 2-3 problemi ricorrenti e crea 6 esercizi mirati.\nJSON: {"summary":"in italiano, quali sono i punti deboli","exercises":[...]} usando i formati:\n`+
          `{"type":"choice","question":"...","options":["..."],"answer":0,"explain":"..."}\n{"type":"fill","sentence":"frase con ___","answer":"...","hint":"traduzione"}\n{"type":"translate","it":"...","answer":"..."}`,
          {temperature:0.5, maxTokens:1800}, r=>Array.isArray(r.exercises));
        const ex = cleanExercises(r.exercises);
        if(!ex.length) throw new Error("Non sono riuscito a creare esercizi validi. Riprova.");
        const lesson = {title:"I tuoi punti deboli", intro:r.summary||"", vocab:[], grammar:{title:"Cosa ripassare", explanation:r.summary||"", examples:[]}, exercises:ex};
        runExercisesStandalone(main, lesson);
      }catch(e){ db.innerHTML = errorHTML(e); }
    };
    return;
  }
  // Schede
  const due = shuffle(dueWords());
  if(!due.length){
    box.innerHTML = `<div class="panel stack" style="align-items:flex-start"><h2>Niente da ripassare oggi</h2><p class="muted">Le parole tornano qui quando è il momento giusto per ripassarle: dopo 1, 3, 7, 14 e 30 giorni.</p><div class="row"><a class="btn" href="#giochi">Fai un gioco</a><a class="btn ghost" href="#lezioni">Nuova lezione</a></div></div>`;
    return;
  }
  let i = 0, known = 0;
  const show = () => {
    if(i >= due.length){ addXP(Math.min(20, 2+known)); box.innerHTML = `<div class="panel"><h2>Ripasso finito</h2><p>Ne sapevi ${known} su ${due.length}.</p><a class="btn" href="#home">Torna a Oggi</a></div>`; return; }
    const w = due[i];
    box.innerHTML = `<div class="progress" style="margin-bottom:14px"><i style="width:${i/due.length*100}%"></i></div>
      <div class="panel flash" id="fc" tabindex="0" role="button" aria-label="Gira la scheda"><div><div class="w">${esc(w.word)}</div><p class="muted">Tocca per vedere la traduzione</p></div></div>
      <div class="row" style="justify-content:center;margin-top:14px" id="btns" hidden><button class="btn ghost" id="no">Non lo sapevo</button><button class="btn" id="yes">Lo sapevo</button></div>`;
    Voice.speak(w.word);
    const flip = () => { $("#fc").innerHTML = `<div><div class="w">${esc(w.word)}</div><p style="font-size:1.3rem;font-weight:700">${esc(w.translation)}</p>${w.example?`<p class="muted">${esc(w.example)}</p>`:""}</div>`; $("#btns").hidden = false; $("#yes").focus(); if(w.example) Voice.speak(w.example); };
    $("#fc").onclick = flip; $("#fc").onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); flip(); } };
    $("#yes").onclick = () => { review(w, true); known++; i++; show(); };
    $("#no").onclick = () => { review(w, false); i++; show(); };
  };
  show();
};
function runExercisesStandalone(main, lesson){
  const u = {id:"errori", title:lesson.title};
  runExercises(main, u, lesson);
}

window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; if(location.hash==="#impostazioni") route(); });
window.addEventListener("appinstalled", () => { deferredInstall = null; toast("App installata"); });
if("serviceWorker" in navigator && (location.protocol==="https:" || ["localhost","127.0.0.1"].includes(location.hostname))){
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if(!hadController || reloading) return;
    $("#updbar").hidden = false;
    $("#updbtn").onclick = () => { reloading = true; location.reload(); };
  });
  navigator.serviceWorker.register("sw.js").then(reg => {
    // Controlla se ci sono aggiornamenti ogni volta che torni sull'app, e ogni ora
    document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") reg.update().catch(()=>{}); });
    setInterval(() => reg.update().catch(()=>{}), 3600000);
  }).catch(()=>{});
}
Voice.init();
window.addEventListener("hashchange", route);
route();
