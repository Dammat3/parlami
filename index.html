const EX_LABEL = {choice:"Scegli la risposta", fill:"Completa la frase", translate:"Traduci per iscritto", order:"Metti in ordine le parole", listen:"Ascolta e scrivi", speak:"Leggi ad alta voce"};

function runExercises(main, u, l){
  const list = shuffle(l.exercises);
  let idx = 0, correct = 0;
  const finish = () => {
    const score = Math.round(correct/list.length*100);
    const prev = state.progress[unitKey(u)];
    state.progress[unitKey(u)] = {done:true, score: Math.max(score, prev?.score||0)};
    let added = 0;
    for(const v of l.vocab){
      if(!state.words.some(w=>w.lang===S().lang && bare(w.word)===bare(v.word))){
        state.words.push({id:uid(), lang:S().lang, word:v.word, translation:v.translation, example:v.example||"", box:1, due:today()}); added++;
      }
    }
    save(); addXP(10 + correct*2);
    main.innerHTML = `<div class="panel stack" style="text-align:center;align-items:center">
      ${avatarSVG(S().persona,120)}
      <h1>Lezione completata</h1>
      <div class="score">${score}%</div>
      <p class="muted">${correct} risposte giuste su ${list.length}. ${added ? `Ho aggiunto ${added} parole al tuo ripasso.` : ""}</p>
      <div class="row" style="justify-content:center">
        <button class="btn" id="again">Rifai gli esercizi</button>
        <button class="btn ghost" id="talk">Usale parlando con ${esc(PERSONAS[S().persona].name)}</button>
        <button class="btn ghost" id="list">Torna alle lezioni</button></div></div>`;
    $("#again").onclick = () => runExercises(main, u, l);
    $("#talk").onclick = () => { sessionStorage.setItem("parlami.topic", u.title); location.hash = "tutor"; };
    $("#list").onclick = () => location.hash = u.level ? "lezioni-"+u.level : "lezioni";
  };
  const show = () => {
    if(idx >= list.length) return finish();
    const ex = list[idx];
    main.innerHTML = `
      <div class="row" style="flex-wrap:nowrap"><button class="iconbtn" id="quit" aria-label="Esci dagli esercizi">${icon("back")}</button>
      <div class="progress" style="flex:1"><i style="width:${idx/list.length*100}%"></i></div><span class="small muted">${idx+1}/${list.length}</span></div>
      <section class="panel" style="margin-top:18px"><div class="ex-type">${EX_LABEL[ex.type]}</div><div id="ex"></div><div id="fb"></div></section>`;
    $("#quit").onclick = () => showTheory(main, u, l);
    renderExercise($("#ex"), ex, (ok, fbHTML) => {
      if(ok) correct++;
      $("#fb").innerHTML = `<div class="feedback ${ok?"good":"bad"}"><h3>${ok?"Giusto!":"Non proprio"}</h3>${fbHTML||""}
        <button class="btn" id="next" style="margin-top:8px">${idx+1<list.length?"Continua":"Vedi il risultato"}</button></div>`;
      $("#next").focus();
      $("#next").onclick = () => { idx++; show(); };
    });
  };
  show();
}

function recordMistake(wrong, right, why){
  state.mistakes.unshift({lang:S().lang, wrong, right, why:why||"", date:today()});
  state.mistakes = state.mistakes.slice(0,200); save();
}

/* Disegna un esercizio e chiama done(ok, feedbackHTML) */
function renderExercise(box, ex, done){
  let answered = false;
  const finish = (ok, html) => { if(answered) return; answered = true; done(ok, html); };
  const checkBtn = `<button class="btn" id="check" style="margin-top:16px">Controlla</button>`;

  if(ex.type==="choice"){
    box.innerHTML = `<div class="ex-q">${esc(ex.question)}</div><div class="options">${ex.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
    $$(".opt", box).forEach(b=>b.onclick=()=>{
      if(answered) return;
      const i = +b.dataset.i, ok = i === +ex.answer;
      $$(".opt", box).forEach(x=>{ if(+x.dataset.i===+ex.answer) x.classList.add("right"); });
      if(!ok){ b.classList.add("wrong"); recordMistake(ex.options[i], ex.options[ex.answer], ex.explain); }
      finish(ok, ex.explain ? `<p>${esc(ex.explain)}</p>` : "");
    });
  }

  else if(ex.type==="fill"){
    const [a,b] = ex.sentence.split("___");
    box.innerHTML = `<div class="ex-q">${esc(a)}<input class="input" id="ans" style="display:inline-block;width:9em;margin:0 6px" autocomplete="off" aria-label="Parola mancante">${esc(b||"")}</div>
      ${ex.hint?`<p class="muted">${esc(ex.hint)}</p>`:""}${checkBtn}`;
    const go = () => {
      const v = $("#ans", box).value; if(!v.trim()) return;
      const ok = bare(v) === bare(ex.answer);
      const accent = ok && norm(v) !== norm(ex.answer);
      if(!ok) recordMistake(ex.sentence.replace("___", v), ex.sentence.replace("___", ex.answer), "");
      finish(ok, ok ? (accent ? `<p>Attento agli accenti: si scrive <b>${esc(ex.answer)}</b>.</p>` : "") : `<p>La risposta giusta è <b>${esc(ex.answer)}</b>.</p>`);
    };
    $("#check", box).onclick = go; $("#ans", box).onkeydown = e => { if(e.key==="Enter") go(); }; $("#ans", box).focus();
  }

  else if(ex.type==="translate"){
    box.innerHTML = `<div class="ex-q">${esc(ex.it)}</div><textarea class="input" id="ans" rows="2" placeholder="Scrivi in ${L().name.toLowerCase()}…"></textarea>${checkBtn}`;
    const go = async () => {
      const v = $("#ans", box).value.trim(); if(!v) return;
      if(bare(v) === bare(ex.answer)) return finish(true, "");
      $("#check", box).disabled = true; $("#check", box).innerHTML = `<span class="spinner"></span> Controllo…`;
      try{
        const r = await ask(`Sei un insegnante di ${L().name} preciso ma giusto. ${who()} ${JSON_ONLY}`,
          `Frase italiana: "${ex.it}"\nTraduzione di riferimento: "${ex.answer}"\nTraduzione dello studente: "${v}"\n`+
          `Valuta se la traduzione dello studente è corretta: accetta traduzioni diverse ma valide; un piccolo errore di battitura non la rende sbagliata ma va segnalato.\n`+
          `JSON: {"correct":true o false,"corrected":"la versione corretta più vicina a quella dello studente","explain":"spiegazione breve in italiano degli errori, o un commento se è corretta"}`,
          {temperature:0.2, maxTokens:400}, r=>typeof r.correct==="boolean");
        if(!r.correct) recordMistake(v, r.corrected||ex.answer, r.explain);
        finish(r.correct, `${r.explain?`<p>${esc(r.explain)}</p>`:""}${!r.correct?`<p>Versione corretta: <b>${esc(r.corrected||ex.answer)}</b></p>`:""}`);
      }catch(e){
        finish(false, `<p>${esc(e.message)}</p><p>Risposta di riferimento: <b>${esc(ex.answer)}</b></p>`);
      }
    };
    $("#check", box).onclick = go; $("#ans", box).focus();
  }

  else if(ex.type==="order"){
    const sep = NOSPACE.includes(S().lang) ? "" : " ";
    const bank = shuffle(ex.words.map((w,i)=>({w,i}))); const picked = [];
    box.innerHTML = `${ex.it?`<div class="ex-q">${esc(ex.it)}</div>`:""}<div class="tokens" id="ans" aria-label="La tua frase"></div><div class="tokens bank" id="bank"></div>${checkBtn}`;
    const draw = () => {
      $("#ans", box).innerHTML = picked.map((t,k)=>`<button class="tok" data-k="${k}">${esc(t.w)}</button>`).join("");
      $("#bank", box).innerHTML = bank.map((t,k)=>`<button class="tok ${picked.includes(t)?"used":""}" data-b="${k}">${esc(t.w)}</button>`).join("");
      $$("[data-k]", box).forEach(b=>b.onclick=()=>{ if(answered) return; picked.splice(+b.dataset.k,1); draw(); });
      $$("[data-b]", box).forEach(b=>b.onclick=()=>{ if(answered) return; const t = bank[+b.dataset.b]; if(!picked.includes(t)){ picked.push(t); draw(); } });
    };
    draw();
    $("#check", box).onclick = () => {
      if(picked.length < ex.words.length) return toast("Usa tutte le parole");
      const mine = picked.map(t=>t.w).join(sep), right = ex.words.join(sep);
      const ok = bare(mine) === bare(right);
      if(!ok) recordMistake(mine, right, "Ordine delle parole");
      finish(ok, ok ? "" : `<p>Ordine giusto: <b>${esc(right)}</b></p>`);
      Voice.speak(right);
    };
  }

  else if(ex.type==="listen"){
    box.innerHTML = `<div class="row" style="margin:10px 0 16px"><button class="btn" id="play">${icon("play")} Ascolta</button><button class="btn ghost" id="slow">${icon("slow")} Più lento</button></div>
      <input class="input" id="ans" placeholder="Scrivi quello che senti…" autocomplete="off">${checkBtn}`;
    $("#play", box).onclick = () => Voice.speak(ex.sentence);
    $("#slow", box).onclick = () => Voice.speak(ex.sentence, {rate:0.6});
    setTimeout(()=>Voice.speak(ex.sentence), 300);
    const go = () => {
      const v = $("#ans", box).value; if(!v.trim()) return;
      const r = align(ex.sentence, v), ok = r.score >= 85;
      if(!ok) recordMistake(v, ex.sentence, "Dettato");
      finish(ok, `<p>${wordsHTML(r.words)}</p><p class="small">${esc(ex.it||"")}</p>`);
    };
    $("#check", box).onclick = go; $("#ans", box).onkeydown = e => { if(e.key==="Enter") go(); };
  }

  else if(ex.type==="speak"){
    box.innerHTML = `<div class="bigsent" style="margin:8px 0">${esc(ex.sentence)}</div><p class="muted">${esc(ex.it||"")}</p>
      <div class="row" style="margin:14px 0"><button class="btn ghost" id="play">${icon("play")} Ascolta prima</button></div>
      <div class="row"><button class="mic" id="mic" aria-label="Parla">${icon("mic")}</button><span class="muted" id="heard">Premi il microfono e leggi la frase</span></div>
      <p style="margin-top:14px"><button class="btn ghost sm" id="skip">Non posso parlare ora</button></p>`;
    $("#play", box).onclick = () => Voice.speak(ex.sentence);
    $("#skip", box).onclick = () => finish(false, `<p>Esercizio saltato.</p>`);
    let session = null, tries = 0;
    $("#mic", box).onclick = async () => {
      if(answered) return;
      const mic = $("#mic", box);
      if(session){ session.stop(); return; }
      mic.classList.add("on"); mic.innerHTML = icon("stop");
      session = Voice.listen({onInterim: t => $("#heard", box).textContent = t || "Ti ascolto…"});
      try{
        const res = await session;
        if(!res){ $("#heard", box).textContent = "Non ho sentito nulla. Riprova."; return; }
        const best = res.alts.map(a=>({a, r:align(ex.sentence, a.text)})).sort((x,y)=>y.r.score-x.r.score)[0];
        tries++;
        if(best.r.score >= 70 || tries >= 3){
          finish(best.r.score >= 70, `<p>${wordsHTML(best.r.words)}</p><p class="small">Ho capito: “${esc(best.a.text)}” · punteggio ${best.r.score}%</p>`);
        } else {
          $("#heard", box).innerHTML = `${wordsHTML(best.r.words)} <span class="small">(${best.r.score}%) Riprova, tentativo ${tries} di 3</span>`;
        }
      }catch(e){ $("#heard", box).textContent = e.message; }
      finally{ session = null; mic.classList.remove("on"); mic.innerHTML = icon("mic"); }
    };
  }
}

function tutorMem(){ state.tutorMem = state.tutorMem || {}; return state.tutorMem[S().lang] = state.tutorMem[S().lang] || {facts:[], errors:[], last:""}; }
function memoryPrompt(){
  if(S().tutorMemory === false) return "";
  const m = tutorMem(); if(!m.facts.length && !m.errors.length && !m.last) return "";
  return `\nCose che ricordi di questo studente da conversazioni precedenti (usale con naturalezza, per esempio chiedendo novità, senza elencarle tutte):
${m.facts.length ? "- Fatti: " + m.facts.join("; ") : ""}
${m.errors.length ? "- Errori che fa spesso, da fargli esercitare con delicatezza: " + m.errors.join("; ") : ""}
${m.last ? "- L'ultima volta avete parlato di: " + m.last : ""}`;
}
async function rememberSession(){
  if(S().tutorMemory === false || kidsModeOn()) return;
  const userTurns = Chat.turns.filter(t=>t.role==="u");
  if(userTurns.length < 3 || Chat.memAt === Chat.turns.length) return;
  Chat.memAt = Chat.turns.length;
  const m = tutorMem();
  try{
    const r = await ask(`Aggiorni la memoria di un tutor di lingue sul suo studente. ${JSON_ONLY}`,
      `Memoria attuale: ${JSON.stringify(m)}
Conversazione appena fatta (S = studente, T = tutor):
${Chat.turns.slice(-20).map(t=>`${t.role==="u"?"S":"T"}: ${t.text}${t.corr?.length ? ` [errori: ${t.corr.map(c=>c.wrong+" → "+c.right).join(", ")}]` : ""}`).join("\n")}
Aggiorna la memoria: tieni solo informazioni utili per le prossime conversazioni, che lo studente ha detto davvero (interessi, lavoro, famiglia, progetti, gusti), più gli errori ricorrenti. Non inventare nulla. Scrivi in italiano, frasi brevissime.
JSON: {"facts":["massimo 12 fatti"],"errors":["massimo 6 errori ricorrenti"],"last":"una frase su cosa avete parlato"}`,
      {temperature:0.2, maxTokens:700}, r => Array.isArray(r.facts));
    const t = tutorMem(); t.facts = r.facts.map(String).slice(0,12); t.errors = (r.errors||[]).map(String).slice(0,6); t.last = String(r.last||""); t.date = today(); save();
  }catch(e){}
}
function missionById(id){ return MISSIONS_ADULT.find(m=>m.id===id); }
function missionBest(id){ return ((state.missionBest||{})[S().lang]||{})[id]; }

const Chat = {scenario:"libera", topic:"", turns:[], busy:false, mode:"libera", mission:"cena", goals:[]};

function tutorSystem(){
  const p = PERSONAS[S().persona], sc = SCENARIOS[Chat.scenario], m = Chat.mode === "missione" ? missionById(Chat.mission) : null;
  const situation = m ? `Gioco di ruolo realistico: interpreti ${m.role}. Lo studente ha una missione con questi obiettivi: ${m.goals.map((g,i)=>`${i+1}) ${g}`).join("; ")}. Non elencare né suggerire gli obiettivi: comportati in modo realistico e dagli l'occasione di raggiungerli; se si blocca, aiutalo con una domanda.`
    : `Situazione: ${sc.prompt}.${Chat.topic ? ` Cerca di far usare allo studente il lessico del tema "${Chat.topic}".` : ""}`;
  return `Sei ${p.name}, tutor di ${L().name}. Carattere: ${p.style}. ${who()}
${situation}${m ? "" : memoryPrompt()}
Regole:
- La tua risposta ("reply") è SEMPRE in ${L().name}, adatta al livello ${S().level}: frasi brevi, massimo 2-3, e chiudi quasi sempre con una domanda per far parlare lo studente.
- Resta nel personaggio e nella situazione.
- Analizza solo l'ULTIMO messaggio dello studente: trova errori di grammatica, lessico, ortografia o frasi poco naturali. Se il messaggio inizia con [voce] è stato dettato: ignora maiuscole e punteggiatura.
- Se lo studente scrive in italiano o non sa una parola, aiutalo e fagli ripetere la frase in ${L().name}.
${JSON_ONLY}
Formato: {"reply":"...","translation":"traduzione italiana della tua risposta","corrections":[{"wrong":"parte sbagliata","right":"versione corretta","why":"spiegazione breve in italiano"}],"natural":"come lo direbbe un madrelingua, oppure stringa vuota"${m ? `,"goals_done":[numeri degli obiettivi che lo studente ha già raggiunto in tutta la conversazione, da 1 a ${m.goals.length}]` : ""}}
Se non ci sono errori, "corrections" è [] e "natural" è "".`;
}
function chatMessages(newUser){
  const msgs = [{role:"system", content:tutorSystem()}];
  for(const t of Chat.turns.slice(-14)){
    if(t.role==="u") msgs.push({role:"user", content:(t.voice?"[voce] ":"")+t.text});
    else msgs.push({role:"assistant", content:JSON.stringify({reply:t.text, translation:t.tr||"", corrections:[], natural:""})});
  }
  if(newUser) msgs.push({role:"user", content:newUser});
  return msgs;
}
async function tutorTurn(userText, voice){
  const first = !userText;
  const content = first ? "[inizio] Saluta lo studente e apri la conversazione secondo la situazione. corrections []." : (voice?"[voce] ":"")+userText;
  if(!first) Chat.turns.push({role:"u", text:userText, voice});
  let out;
  for(let a=0;a<2;a++){
    try{ out = await llm(chatMessages(content), {temperature:0.8, maxTokens:700}); if(out && out.reply && (a === 1 || !soundsItalian(out.reply))) break; }
    catch(e){ if(e.network || a===1) throw e; }
  }
  if(!out || !out.reply) throw new Error("L'IA non ha risposto nel formato previsto.");
  const corr = Array.isArray(out.corrections) ? out.corrections.filter(c=>c && c.right) : [];
  if(!first && (corr.length || out.natural)){
    const last = Chat.turns[Chat.turns.length-1]; last.corr = corr; last.natural = out.natural || "";
    corr.forEach(c=>recordMistake(c.wrong, c.right, c.why));
  }
  Chat.turns.push({role:"t", text:out.reply, tr:out.translation||""});
  if(Chat.mode === "missione" && Array.isArray(out.goals_done)) out.goals_done.forEach(n => { if(+n >= 1) Chat.goals[+n-1] = true; });
  if(!first) addXP(corr.length ? 2 : 3);
}

      const record = mb[m.id] == null || score > mb[m.id]; if(record) mb[m.id] = score; save(); addXP(5 + Math.round(score/10));
      Chat.turns.push({role:"r", r, score, record}); draw(); if(score >= 75) { SFX.win(); confetti($(".chat").parentElement); }
    }catch(e){ status.innerHTML = `<span class="status-bad">${esc(e.message)}</span>`; Chat.busy = false; return; }
    Chat.busy = false; status.innerHTML = "";
  };
  const busy = on => { Chat.busy = on; if(!$("#send")) return; $("#send").disabled = on; $("#mic").disabled = on; status.innerHTML = on ? `<span class="spinner"></span> ${esc(p.name)} sta scrivendo…` : ""; };
  const turn = async (text, voice) => {
    if(Chat.busy) return;
    busy(true); draw();
    try{
      await tutorTurn(text, voice);
      draw(); busy(false);
      if(S().autoSpeak) Voice.speak(Chat.turns[Chat.turns.length-1].text);
    }catch(e){
      busy(false);
      if(text && Chat.turns.length && Chat.turns[Chat.turns.length-1].role==="u" && Chat.turns[Chat.turns.length-1].text===text) Chat.turns.pop();
      draw(); status.innerHTML = `<span style="color:var(--bad);font-weight:700">${esc(e.message)}</span>`;
      if(text) $("#txt").value = text;
    }
  };
  const sendText = () => { const v = $("#txt").value.trim(); if(!v) return; $("#txt").value = ""; turn(v, false); };
  $("#send").onclick = sendText;
  $("#txt").onkeydown = e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendText(); } };
  let session = null;
  $("#mic").onclick = async () => {
    const mic = $("#mic");
    if(session){ session.stop(); return; }
    mic.classList.add("on"); mic.innerHTML = icon("stop"); status.textContent = "Ti ascolto…";
    session = Voice.listen({onInterim: t => status.textContent = t || "Ti ascolto…"});
    try{
      const r = await session;
      session = null; mic.classList.remove("on"); mic.innerHTML = icon("mic");
      if(!r){ status.textContent = "Non ho sentito nulla. Riprova."; return; }
      status.textContent = ""; turn(r.text, true);
    }catch(e){ session = null; mic.classList.remove("on"); mic.innerHTML = icon("mic"); status.innerHTML = `<span style="color:var(--bad);font-weight:700">${esc(e.message)}</span>`; }
  };
  const sc = $("#scen"); if(sc) sc.onchange = e => { rememberSession(); Chat.scenario = e.target.value; Chat.turns = []; Chat.topic = ""; start(); };
  const ms = $("#mis"); if(ms) ms.onchange = e => { Chat.mission = e.target.value; Chat.turns = []; Chat.goals = []; Chat.goalsToast = false; start(); };
  const me = $("#miseval"); if(me) me.onclick = evalMission;
  $$("[data-mode]", main).forEach(b=>b.onclick=()=>{ if(Chat.mode === b.dataset.mode) return; rememberSession(); Chat.mode = b.dataset.mode; Chat.turns = []; Chat.goals = []; Chat.goalsToast = false; route(); });
  drawMemo();
  $("#tr").onchange = e => { state.settings.showTr = e.target.checked; save(); draw(); };
  $("#restart").onclick = () => { rememberSession(); Chat.turns = []; Chat.goals = []; Chat.goalsToast = false; start(); };
  const start = () => { draw(); if(!Chat.turns.length && S().connected) turn(null); };
  cleanup = () => { if(session) session.stop(); rememberSession(); };
  start();
};

async function phrasebook(){
  const flat = FRASARIO.flatMap(c => c.p.map(x=>x[0]));
  if(S().lang === "en") return FRASARIO.flatMap(c => c.p.map(x=>x[1]));
  const cached = (state.phrasebook||{})[S().lang];
  if(Array.isArray(cached) && cached.length === flat.length) return cached;
  const r = await ask(`Sei un traduttore esperto di ${L().name}. ${JSON_ONLY}`,
    `Traduci in ${L().name} queste frasi da viaggio, una per una e nello stesso ordine, in modo naturale e cortese come le direbbe un madrelingua. Lascia "…" dove c'è.\n${JSON.stringify(flat)}\nJSON: {"t":["..."]}`,
    {temperature:0.2, maxTokens:4000}, r => Array.isArray(r.t) && r.t.length === flat.length);
  state.phrasebook = {...(state.phrasebook||{}), [S().lang]: r.t.map(String)}; save();
  return state.phrasebook[S().lang];
}

/* ---- Prepara e controlla tutto ---- */
const Check = {running:false, log:[]};
function toolCheck(main){
  const levels = LEVELS, total = levels.length * 10;
  const count = () => { let ok = 0, rev = 0; levels.forEach(lv => unitsOf(lv).forEach(u => { const l = state.lessons[unitKey(u)]; if(l && lessonOK(l)){ ok++; if(l.reviewed) rev++; } })); return {ok, rev}; };
  const draw = () => {
    const c = count();
    main.innerHTML = `${toolBack}<h1 style="margin-top:16px">Prepara e controlla tutto</h1>
      <p class="muted">Crea in anticipo tutte le lezioni di ${L().name.toLowerCase()} (6 livelli × 10 lezioni) e le fa ricontrollare da un secondo passaggio dell'IA, che corregge frasi non in ${L().name.toLowerCase()}, errori e traduzioni sbagliate. Le lezioni già pronte e ricontrollate vengono saltate, quindi puoi interrompere e riprendere quando vuoi. Dopo, le lezioni partono subito.</p>
      ${needsSetup()}
      <section class="panel stack">
        <div class="row" style="justify-content:space-between"><b>${c.rev} lezioni ricontrollate su ${total}</b><span class="small muted">${c.ok} pronte</span></div>
        <div class="progress"><i style="width:${c.rev/total*100}%"></i></div>
        <label class="row small"><input type="checkbox" id="ckp" checked> Prepara anche le parole dei giochi (2 argomenti per livello)</label>
        <label class="row small"><input type="checkbox" id="ckr" ${S().reviewLessons!==false?"checked":""}> Ricontrolla in automatico anche le lezioni nuove che apri</label>
        <p class="small muted" style="margin:0">Ci vogliono circa 20–40 minuti, secondo la velocità dell'IA. Tieni l'app aperta e lo schermo acceso. Usa una parte della quota gratuita: se un servizio la esaurisce, l'app passa all'altro o aspetta.</p>
        <div class="row">${Check.running ? `<button class="btn ghost" id="ckstop">⏸ Ferma</button>` : `<button class="btn sun" id="ckgo">${c.rev ? "▶ Continua" : "▶ Inizia"}</button>`}</div>
      </section>
      <section class="panel stack" style="margin-top:12px"><h2 style="margin:0">Resoconto</h2><div id="cklog" class="cklog">${Check.log.length ? Check.log.map(x=>`<div class="ckrow ${x.k}">${x.t}</div>`).join("") : `<p class="muted small" style="margin:0">Ancora niente.</p>`}</div></section>`;
    $("#ckr").onchange = e => { state.settings.reviewLessons = e.target.checked; save(); };
    const go = $("#ckgo"); if(go) go.onclick = () => run($("#ckp").checked);
    const st = $("#ckstop"); if(st) st.onclick = () => { Check.running = false; toast("Mi fermo dopo la lezione in corso"); };
  };
  const log = (k, t) => { Check.log.unshift({k, t}); Check.log = Check.log.slice(0, 200); const el = $("#cklog"); if(el) el.innerHTML = Check.log.map(x=>`<div class="ckrow ${x.k}">${x.t}</div>`).join(""); };
  const run = async (packs) => {
    if(Check.running) return; Check.running = true; wake(true); draw();
    let fixed = 0, failed = 0;
    for(const lv of levels){
      for(const u of unitsOf(lv)){
        if(!Check.running) break;
        const key = unitKey(u), have = state.lessons[key];
        if(have && lessonOK(have) && have.reviewed) continue;
        log("doing", `⏳ ${lv} · ${esc(u.title)}…`);
        let ok = false;
        for(let attempt = 0; attempt < 2 && !ok && Check.running; attempt++){
          try{
            let l = have && lessonOK(have) ? have : await getLesson(u, true);
            if(!l.reviewed) await reviewLesson(l, lv);
            state.lessons[key] = l; save(); ok = true; fixed += l.reviewChanges || 0;
            Check.log.shift(); log("ok", `✅ ${lv} · ${esc(u.title)} — ${l.vocab.length} parole, ${l.exercises.length} esercizi${l.reviewChanges ? `, ${l.reviewChanges} correzioni` : ", nessun errore"}`);
          }catch(e){ if(attempt === 0){ Check.log.shift(); log("doing", `⏳ ${lv} · ${esc(u.title)}: riprovo tra poco…`); await wait(20000); } else { Check.log.shift(); failed++; log("bad", `❌ ${lv} · ${esc(u.title)} — ${esc(e.message)}`); } }
        }
        await wait(1200);
        if($("#ckgo, #ckstop")) { const c = count(); const b = main.querySelector(".progress i"); if(b) b.style.width = (c.rev/total*100)+"%"; const t = main.querySelector(".panel b"); if(t) t.textContent = `${c.rev} lezioni ricontrollate su ${total}`; }
      }
      if(!Check.running) break;
      if(packs){ for(const t of WB_THEMES.slice(0, 2)){ if(!Check.running) break; const lvg = lv; try{ if(!hasPack(lvg, t)){ await wordPack(lvg, t); log("ok", `✅ Parole dei giochi ${lvg} · ${t}`); } }catch(e){ log("bad", `❌ Parole dei giochi ${lvg} · ${t} — ${esc(e.message)}`); } } }
    }
    const done = Check.running; Check.running = false; wake(false);
    log(done ? "ok" : "doing", done ? `🏁 Fatto. ${fixed} correzioni in totale${failed ? `, ${failed} lezioni non riuscite: premi Continua per riprovarle` : ""}.` : "⏸ Fermato. Premi Continua per riprendere.");
    if($("#cklog")) draw();
  };
  draw();
}

      <div class="row"><button class="iconbtn" id="dsay" aria-label="Ascolta">${icon("play")}</button><button class="iconbtn" id="dslow" aria-label="Ascolta lento">${icon("slow")}</button></div></div>

      ${(r.meanings||[]).map(m=>`<div class="taskbox"><p style="margin:0">${esc(m.it||"")}</p>${m.example?`<p style="margin:6px 0 0"><button class="iconbtn" data-ex="${esc(m.example)}" style="width:30px;height:30px;vertical-align:middle">${icon("play")}</button> <i>${esc(m.example)}</i><br><span class="small muted">${esc(m.example_it||"")}</span></p>`:""}</div>`).join("")}
      ${r.forms?`<p class="small" style="margin:0"><b>Forme:</b> ${esc(r.forms)}</p>`:""}${r.tips?`<p class="small" style="margin:0"><b>Nota:</b> ${esc(r.tips)}</p>`:""}
      <div><button class="btn ghost sm" id="dadd">➕ Aggiungi al ripasso</button></div></section>`;

    Voice.speak(r.word);
  };
  const search = async () => {
    const q = $("#dq").value.trim(); if(!q) return;

    try{
      const r = await ask(`Sei un dizionario bilingue italiano-${L().name.toLowerCase()} per studenti italiani. ${JSON_ONLY}`,
        `Lo studente cerca: "${q}" (può essere scritto in italiano o in ${L().name}).
JSON: {"word":"la parola in ${L().name}","it":"traduzioni italiane principali","pos":"categoria grammaticale in italiano","pron":"pronuncia approssimata scritta per un italiano","meanings":[{"it":"significato o uso in italiano","example":"frase d'esempio in ${L().name}","example_it":"traduzione"}],"forms":"forme utili (plurale, passato, ecc.) o stringa vuota","tips":"nota breve utile (falsi amici, errori tipici) o stringa vuota"}
Al massimo 3 significati.`, {temperature:0.2, maxTokens:900}, r => r.word);
      hist.unshift({q, r}); state.dict = {...(state.dict||{}), [S().lang]: hist.slice(0,150)}; save();
      showRes(r);
    }catch(e){ $("#dres").innerHTML = errorHTML(e); }
  };
  $("#dgo").onclick = search; $("#dq").onkeydown = e => { if(e.key==="Enter") search(); }; $("#dq").focus();
  $$("[data-h]", main).forEach(b=>b.onclick=()=>{ const h = hist[+b.dataset.h]; $("#dq").value = h.q; showRes(h.r); });
}

/* ---- Ascolto in sottofondo ---- */
const Radio = {ep:null, next:null, line:0, playing:false, lock:null};
const RADIO_TOPICS = ["a sorpresa","vita quotidiana","viaggi","lavoro","cibo","sport","tecnologia","storie divertenti","notizie leggere","cultura"];
async function radioEpisode(topic, level){
  const t = topic === "a sorpresa" ? shuffle(RADIO_TOPICS.slice(1))[0] : topic;
  return ask(`Scrivi brevi episodi audio per studenti di ${L().name} (livello ${level} del QCER): dialoghi naturali, vivaci e adatti a tutti. ${JSON_ONLY}`,
    `Scrivi un mini-podcast in ${L().name} sul tema "${t}": un dialogo tra due persone con un nome, 12-16 battute, livello ${level}.
JSON: {"title":"titolo","lines":[{"s":"nome di chi parla","t":"battuta in ${L().name}","it":"traduzione italiana"}],"words":[{"w":"parola utile","it":"traduzione"}]}
Metti 5 parole utili.`, {temperature:0.95, maxTokens:2200}, r => Array.isArray(r.lines) && r.lines.filter(l=>l && l.t && !soundsItalian(l.t)).length >= 6);
}
async function wake(on){ try{ if(on && "wakeLock" in navigator && !Radio.lock) Radio.lock = await navigator.wakeLock.request("screen"); if(!on && Radio.lock){ await Radio.lock.release(); Radio.lock = null; } }catch(e){} }
function toolRadio(main){
  const cfg = state.radio = state.radio || {topic:"a sorpresa", level:S().level, rate:0.95, text:true, auto:true};
  main.innerHTML = `${toolBack}<h1 style="margin-top:16px">Ascolto in sottofondo</h1>
    <p class="muted">Brevi dialoghi al tuo livello, uno dopo l'altro, da ascoltare mentre fai altro. Lo schermo resta acceso durante l'ascolto: su iPhone, se lo blocchi, la voce si ferma.</p>
    ${needsSetup()}
    <section class="panel stack"><div class="grid2">
      <label class="field">Argomento<select id="rt">${RADIO_TOPICS.map(t=>`<option ${t===cfg.topic?"selected":""}>${t}</option>`).join("")}</select></label>
      <label class="field">Livello<select id="rl">${LEVELS.map(l=>`<option ${l===cfg.level?"selected":""}>${l}</option>`).join("")}</select></label>
      <label class="field">Velocità: <span id="rrv">${cfg.rate}</span><input type="range" id="rr" min="0.7" max="1.2" step="0.05" value="${cfg.rate}"></label></div>
      <div class="row"><label class="row small"><input type="checkbox" id="rx" ${cfg.text?"checked":""}> Mostra il testo</label><label class="row small"><input type="checkbox" id="ra" ${cfg.auto?"checked":""}> Episodio successivo in automatico</label></div>
      <div class="row"><button class="btn sun" id="rplay">${icon("play")} Ascolta</button><button class="btn ghost" id="rpause">${icon("stop")} Pausa</button><button class="btn ghost" id="rnext">⏭ Prossimo episodio</button></div>
      <p class="small" id="rstat"></p></section>
    <section class="panel" id="rep" style="margin-top:12px" hidden></section>`;
  const set = (k,v) => { cfg[k] = v; save(); };
  $("#rt").onchange = e => { set("topic", e.target.value); Radio.next = null; };
  $("#rl").onchange = e => { set("level", e.target.value); Radio.next = null; };
  $("#rr").oninput = e => { set("rate", +e.target.value); $("#rrv").textContent = e.target.value; };
  $("#rx").onchange = e => { set("text", e.target.checked); draw(); };
  $("#ra").onchange = e => set("auto", e.target.checked);
  const stat = t => { const el = $("#rstat"); if(el) el.innerHTML = t; };
  const prefetch = () => { if(!Radio.next) Radio.next = radioEpisode(cfg.topic, cfg.level).catch(()=>null); };
  const draw = () => {
    const box = $("#rep"); if(!box || !Radio.ep) return; box.hidden = false;
    const ep = Radio.ep, sp = [...new Set(ep.lines.map(l=>l.s))];
    box.innerHTML = `<h2 style="margin-top:0">🎧 ${esc(ep.title||"Episodio")}</h2>
      ${cfg.text ? `<div class="stack" style="gap:6px">${ep.lines.map((l,i)=>`<p class="rline ${i===Radio.line && Radio.playing?"cur":""}" data-i="${i}"><b>${esc(l.s)}:</b> ${esc(l.t)}<br><span class="small muted">${esc(l.it||"")}</span></p>`).join("")}</div>` : `<p class="muted">Testo nascosto: ascolta e basta. Battuta ${Radio.line+1} di ${ep.lines.length}.</p>`}
      ${(ep.words||[]).length ? `<p class="small" style="margin-bottom:0"><b>Parole utili:</b> ${ep.words.map(w=>`${esc(w.w)} = ${esc(w.it)}`).join(" · ")}</p>` : ""}`;
    $$(".rline", box).forEach(p=>p.onclick=()=>{ Radio.line = +p.dataset.i; if(!Radio.playing) play(); else { speechSynthesis.cancel(); } });
    const cur = $(".rline.cur", box); if(cur) cur.scrollIntoView({block:"nearest", behavior:"smooth"});
  };
  const play = async () => {
    if(!Radio.ep){ stat(`<span class="spinner"></span> Preparo l'episodio…`); try{ Radio.ep = await (Radio.next || radioEpisode(cfg.topic, cfg.level)); Radio.next = null; if(!Radio.ep) throw new Error("Non sono riuscito a preparare l'episodio."); Radio.line = 0; }catch(e){ stat(`<span class="status-bad">${esc(e.message)}</span>`); return; } }
    Radio.playing = true; wake(true); stat("In ascolto…"); prefetch();
    const sp = [...new Set(Radio.ep.lines.map(l=>l.s))];
    while(Radio.playing && Radio.line < Radio.ep.lines.length){
      draw(); const l = Radio.ep.lines[Radio.line], at = Radio.line;
      await Voice.speakAs(l.t, sp.indexOf(l.s), cfg.rate);
      if(!Radio.playing) return;
      if(Radio.line === at) Radio.line++;
      await wait(350);
    }
    if(!Radio.playing) return;
    addXP(3);
    if(cfg.auto && $("#rep")){ stat(`<span class="spinner"></span> Arriva il prossimo episodio…`); Radio.ep = null; await wait(800); play(); }
    else { Radio.playing = false; wake(false); stat("Episodio finito."); draw(); }
  };
  $("#rplay").onclick = () => { if(!Radio.playing) play(); };
  $("#rpause").onclick = () => { Radio.playing = false; speechSynthesis.cancel(); wake(false); stat("In pausa: premi Ascolta per continuare."); draw(); };
  $("#rnext").onclick = () => { Radio.playing = false; speechSynthesis.cancel(); Radio.ep = null; Radio.line = 0; setTimeout(play, 300); };
  cleanup = () => { Radio.playing = false; speechSynthesis.cancel(); wake(false); };
  if(Radio.ep) draw();
}

      $$("[data-w]", $("#tips")).forEach(b=>b.onclick=()=>Voice.speak(b.dataset.w, {rate:0.7}));

        `JSON: {"sentences":[{"text":"frase in ${L().name}","it":"traduzione italiana","tip":"un consiglio breve in italiano sul suono più difficile della frase"}]}`,
        {temperature:0.8, maxTokens:1000}, r=>Array.isArray(r.sentences) && r.sentences.filter(x=>x && x.text && !soundsItalian(x.text)).length >= 3);
      Pron.list = r.sentences.filter(x=>x && x.text && !soundsItalian(x.text)); Pron.i = 0; drawCard();
    }catch(e){ card.innerHTML = errorHTML(e); }
  };
  $("#useown").onclick = () => { const v = $("#own").value.trim(); if(!v) return; Pron.list = [{text:v, it:"", tip:""}, ...Pron.list]; Pron.i = 0; drawCard(); };
  drawCard();

/* ============ VOCE: più voci e ascolto lungo (per esami) ============ */
Voice.speakAs = function(text, idx=0, rate){
  return new Promise(resolve=>{
    if(!("speechSynthesis" in window) || !text){ resolve(); return; }
    const u = new SpeechSynthesisUtterance(text); u.lang = L().code;
    const list = this.forLang();
    const v = list.length > 1 ? list[idx % list.length] : this.pick(); if(v) u.voice = v;
    if(list.length < 2) u.pitch = idx % 2 ? 0.75 : 1.15;
    u.rate = rate ?? S().rate;
    u.onstart = () => setAvatar("talk");
    u.onend = u.onerror = () => { setAvatar(null); resolve(); };
    speechSynthesis.speak(u);
  });
};
/* Ascolto continuo finché non premi Stop: ritorna {stop(), finished} con {text, conf, error} */
Voice.listenLong = function({onText}={}){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let resolveDone; const finished = new Promise(r=>resolveDone=r);
  if(!SR){ resolveDone({text:"", conf:0, error: IS_IOS ? "Su iPhone il microfono funziona solo aprendo Parlami da Safari, con Siri e Dettatura attivi." : "Il riconoscimento vocale funziona in Chrome o Edge."}); return {stop:()=>finished, finished}; }
  this.stop();
  let active = true, finals = [], confs = [], interim = "", error = "", r, ended = false;
  const done = () => { if(ended) return; ended = true; setAvatar(null); resolveDone({text:(finals.join(" ")+" "+interim).trim(), conf: confs.length ? confs.reduce((a,b)=>a+b,0)/confs.length : 0, error}); };
  const start = () => {
    r = new SR(); r.lang = L().code; r.continuous = true; r.interimResults = true;
    r.onresult = e => {
      interim = "";
      for(let i=e.resultIndex;i<e.results.length;i++){ const res = e.results[i];
        if(res.isFinal){ finals.push(res[0].transcript.trim()); if(res[0].confidence) confs.push(res[0].confidence); }

    };

      }
    };
    r.onend = () => { if(interim){ finals.push(interim.trim()); interim = ""; } if(active){ try{ start(); }catch(e){ done(); } } else done(); };
    try{ r.start(); }catch(e){}
  };
  start(); setAvatar("listen");
  return { stop(){ active = false; try{ r.stop(); }catch(e){} setTimeout(done, 1500); return finished; }, finished };
};

  cleanup = () => h.stop();

/* Percentuale: quanto hai completato, quanto sei stato preciso, e un bonus per il tempo avanzato */
function pctOf(h, total){
  const completion = Math.min(1, h.hits/total), acc = h.hits + h.misses ? h.hits/(h.hits+h.misses) : 0;
  const timeBonus = h.total && h.left > 0 && h.hits >= total ? Math.min(10, h.left/h.total*20) : 0;
  return Math.min(100, Math.round(completion*75 + acc*25 + timeBonus));
}

/* ---- Pacchetti di parole sempre nuovi ---- */
const WB_THEMES = ["vita quotidiana","cibo e cucina","viaggi e vacanze","lavoro e ufficio","casa e arredamento","salute e corpo","natura e meteo","sport e tempo libero","emozioni e carattere","città e servizi","tecnologia e internet","negozi e denaro","scuola e studio","famiglia e relazioni","cultura, musica e cinema","ambiente e società","trasporti","vestiti e moda"];
const STAGE_LEVEL = ["A1","A1","A2","A2","A2","B1","B1","B1","B2","B2","C1","C2"];
/* Un pacchetto è valido solo se le traduzioni sono davvero in italiano (diverse dalla parola straniera) */
/* L'italiano usa solo lettere latine: una traduzione in arabo, cirillico, cinese… è sbagliata */
function looksItalian(t){ return /^[\p{Script=Latin}\p{N}\s'’\-.,;:!?()«»“”"/…]+$/u.test(String(t||"").trim()) && /\p{L}/u.test(String(t||"")); }
function badTranslation(w){ return !looksItalian(w.translation) || bare(w.word) === bare(w.translation); }
function goodTranslations(list){
  if(!list.length) return false;
  return list.filter(badTranslation).length / list.length <= 0.25;
}
function uniqueWords(list){
  const sw = new Set(), st = new Set();
  return list.filter(w => { const a = bare(w.word), b = bare(w.translation);
    if(!a || !b || badTranslation(w) || sw.has(a) || st.has(b)) return false; sw.add(a); st.add(b); return true; });
}
const packKey = (level, theme) => `${S().lang}:${level}:${theme}`;
const hasPack = (level, theme) => (state.wordBank?.[packKey(level, theme)]?.length || 0) >= 8;
const cachedThemes = level => WB_THEMES.filter(t => hasPack(level, t));
const packJobs = {};
function wordPack(level, theme){
  const key = packKey(level, theme);
  state.wordBank = state.wordBank || {};
  if(hasPack(level, theme)) return Promise.resolve(state.wordBank[key]);
  if(packJobs[key]) return packJobs[key];
  const code = S().lang;
  const job = ask(`Sei un lessicografo e insegnante di ${L().name} per studenti italiani. ${JSON_ONLY}`,
    `Elenca 12 parole o espressioni utili di ${L().name} sul tema "${theme}", tipiche del livello ${level} del QCER, tutte diverse tra loro.
Per ognuna scrivi questi campi:
"${code}": la parola in ${L().name};
"traduzione_italiana": la sua traduzione in lingua ITALIANA, scritta con l'alfabeto italiano (mai in ${L().name}, mai in altre lingue o alfabeti);
"def": una definizione brevissima in ${L().name} (al massimo 8 parole) che non contenga la parola;
"ex": una frase d'esempio breve in ${L().name} (al massimo 10 parole) che contenga la parola scritta esattamente uguale;
"esempio_italiano": la traduzione in italiano della frase.
Esempio di formato per l'inglese: {"en":"beer","traduzione_italiana":"birra","def":"an alcoholic drink made from grain","ex":"He ordered a cold beer.","esempio_italiano":"Ha ordinato una birra fredda."}
JSON: {"words":[{"${code}":"...","traduzione_italiana":"...","def":"...","ex":"...","esempio_italiano":"..."}]}`,
    {temperature:0.7, maxTokens:1600},
    r => { if(!Array.isArray(r.words)) return false; const l = r.words.map(w => ({word:w?.[code] ?? w?.word, translation:w?.traduzione_italiana ?? w?.it ?? w?.translation})).filter(w=>w.word && w.translation); return l.length >= 8 && goodTranslations(l) && r.words.filter(w=>soundsItalian(w?.ex ?? w?.example ?? "")).length <= 2; })
  .then(r => {
    const list = uniqueWords(r.words.map(w => ({id:uid(), word:String(w[code] ?? w.word ?? "").trim(), translation:String(w.traduzione_italiana ?? w.it ?? w.translation ?? "").trim(),
      def:String(w.def||"").trim(), example:String(w.ex ?? w.example ?? "").trim(), example_it:(t => looksItalian(t) ? t : "")(String(w.esempio_italiano ?? w.ex_it ?? w.example_it ?? "").trim()), level, theme})));
    if(list.length < 8) throw new Error("Le parole preparate dall'IA non erano valide. Riprova.");
    state.wordBank[key] = list; save(); return list;
  }).finally(() => { delete packJobs[key]; });
  packJobs[key] = job; return job;
}
/* Prepara in sottofondo un pacchetto nuovo, così la prossima partita parte subito */
function prefetchPack(level){
  if(!state.settings.connected) return;
  const missing = WB_THEMES.filter(t => !hasPack(level, t) && !packJobs[packKey(level, t)]);
  if(!missing.length || Object.keys(packJobs).length >= 2) return;
  wordPack(level, missing[Math.floor(Math.random()*missing.length)]).catch(()=>{});
}
function warmPacks(){ for(const lv of ["A1", STAGE_LEVEL[Math.min(11, LEVELS.indexOf(S().level)*2)] || "A2"]) if(!cachedThemes(lv).length) prefetchPack(lv); }
function pickFresh(list, n){
  const seen = state.seenW || (state.seenW = {}), k = w => S().lang + ":" + w.word;
  const out = shuffle(list).sort((a,b)=>(seen[k(a)]||0)-(seen[k(b)]||0)).slice(0, n);
  out.forEach(w=>{ seen[k(w)] = (seen[k(w)]||0) + 1; });
  const keys = Object.keys(seen); if(keys.length > 3000) keys.slice(0, 1000).forEach(x=>delete seen[x]);
  return out;
}
async function stageWords(id, n, count){
  const p = gprog(id), plays = p.plays || 0, lvl = STAGE_LEVEL[n-1] || "B1";
  const have = cachedThemes(lvl);
  let themes;
  if(have.length){
    // Ci sono già pacchetti pronti: si parte subito, girando tra gli argomenti, e se ne prepara uno nuovo in sottofondo
    const start = (n*7 + plays*5) % have.length;
    themes = [...have.slice(start), ...have.slice(0, start)];
    prefetchPack(lvl);
  } else {
    const off = (n*7 + plays*5) % WB_THEMES.length;
    themes = [WB_THEMES[off], WB_THEMES[(off+8) % WB_THEMES.length]];
  }
  let all = [];
  if(have.length){
    for(const t of themes){ all = uniqueWords([...all, ...state.wordBank[packKey(lvl, t)]]); if(all.length >= count + 6 && all.length >= 20) break; }
  } else {
    const res = await Promise.allSettled(themes.map(t => wordPack(lvl, t)));
    res.forEach(r => { if(r.status === "fulfilled") all = uniqueWords([...all, ...r.value]); });
    if(!all.length) throw (res.find(r=>r.status==="rejected")?.reason || new Error("Non sono riuscito a preparare le parole."));
  }
  const nextLv = STAGE_LEVEL[n]; if(nextLv && nextLv !== lvl && !cachedThemes(nextLv).length) setTimeout(()=>prefetchPack(nextLv), 3000);
  return {lvl, theme:themes[0], words:pickFresh(all, Math.min(count, all.length)), all};
}

async function kidsStage(n, {count=8, exclude=[], maxLen=99}={}){
  const all = await kidsWords(); const th = kidsTheme(n);

function sameTheme(all, w, n){

/* Lettere o parole da mettere in ordine */
function orderRounds(box, h, items, {kids, sentence, perItemTime, hint}){
  return new Promise(resolve=>{
    let i = 0;
    const show = () => {
      if(i >= items.length) return resolve();
      const w = items[i];
      const target = sentence ? (NOSPACE.includes(S().lang) ? tokens(w.example) : w.example.replace(/[.,!?;:…]+$/,"").split(/\s+/).filter(Boolean)) : [...w.word];
      const tiles = shuffle(target.map((ch,k)=>({ch,k}))); let picked = [], over = false;
      const sep = sentence && !NOSPACE.includes(S().lang) ? " " : "";
      if(perItemTime) h.startTimer(perItemTime, () => { if(over) return; over = true; h.miss(); reveal(false); });
      const reveal = (good) => {
        h.area.querySelector(".tokens.ans").innerHTML = `<span class="kword" style="padding:6px">${esc(sentence ? w.example : w.word)}</span>`;
        $(".tokens.bank", h.area).innerHTML = ""; Voice.speak(sentence ? w.example : w.word);
        setTimeout(()=>{ i++; show(); }, good ? 900 : 1700);
      };
      const draw = () => {
        h.area.innerHTML = `<div class="panel ${kids?"kids":""} stage-panel" style="text-align:center"><div class="small muted" style="text-align:right">${i+1}/${items.length}</div>
          ${hint(w)}
          <div class="tokens ans" style="justify-content:center;min-height:58px">${picked.map((t,k)=>`<button class="tok ${kids?"big":""}" data-k="${k}">${esc(t.ch)}</button>`).join(sep ? "" : "")}</div>
          <div class="tokens bank" style="justify-content:center">${tiles.map((t,k)=>`<button class="tok ${kids?"big":""} ${picked.includes(t)?"used":""}" data-b="${k}">${esc(t.ch)}</button>`).join("")}</div>
          <div class="row" style="justify-content:center;margin-top:10px">${kids?`<button class="btn ghost sm" id="hear">${icon("play")} Ascolta</button>`:""}<button class="btn ghost sm" id="skip">Salta</button></div></div>`;
        $$("[data-k]", h.area).forEach(b=>b.onclick=()=>{ if(over) return; picked.splice(+b.dataset.k,1); draw(); });
        $$("[data-b]", h.area).forEach(b=>b.onclick=()=>{ if(over) return; const t = tiles[+b.dataset.b]; if(picked.includes(t)) return; picked.push(t);
          if(picked.length === target.length){
            const mine = picked.map(x=>x.ch).join(sep), right = target.join(sep);
            if(bare(mine) === bare(right)){ over = true; h.stop(); h.add(sentence ? 20 : 10); if(kids) cheer($(".stage-panel", h.area)); reveal(true); return; }
            const done = h.miss(); draw(); $(".tokens.ans", h.area).classList.add("shake");
            if(done){ over = true; h.stop(); reveal(false); return; }
            setTimeout(()=>{ picked = []; draw(); }, 600); return;
          }
          draw(); });
        const hr = $("#hear", h.area); if(hr) hr.onclick = () => Voice.speak(w.word, {rate:0.8});
        $("#skip", h.area).onclick = () => { if(over) return; over = true; h.stop(); h.miss(); reveal(false); };
      };
      draw();
    };
    show();
  });
}
/* Indovina le lettere (Impiccato e Palloncino) */
function hangRounds(box, h, items, {kids, lives, hint}){
  return new Promise(resolve=>{
    let i = 0;
    const isSym = ch => !ch.trim() || /[-'’.,!?]/.test(ch);
    const show = () => {
      if(i >= items.length) return resolve();
      const w = items[i], word = w.word, letters = [...new Set([...word.toLowerCase()].filter(ch=>!isSym(ch)))];
      const alphabet = [...new Set(items.concat(h.pool||[]).flatMap(x=>[...x.word.toLowerCase()]).filter(ch=>!isSym(ch) && !letters.includes(ch)))];
      const keys = shuffle([...letters, ...shuffle(alphabet).slice(0, Math.max(8, 18 - letters.length))]);
      const guessed = new Set(); let wrong = 0, over = false;
      const draw = () => {
        const shown = [...word].map(ch => isSym(ch) ? ch : guessed.has(ch.toLowerCase()) ? ch : "_");
        const win = !shown.includes("_"), lose = wrong >= lives;
        h.area.innerHTML = `<div class="panel ${kids?"kids":""} stage-panel" style="text-align:center"><div class="small muted" style="text-align:right">${i+1}/${items.length}</div>
          ${hint(w)}
          <div class="hang">${shown.map(ch=>`<span>${esc(ch===" "?" ":ch)}</span>`).join("")}</div>
          ${kids ? `<div class="balloon" style="--s:${1 - wrong/lives*0.75}">🎈</div><p class="small muted">Puoi sbagliare ancora ${lives - wrong} volte</p>` : `<div class="lifebar"><i style="width:${(lives-wrong)/lives*100}%"></i></div><p class="small muted">Errori possibili: ${lives - wrong}</p>`}
          <div class="keys">${keys.map(k=>`<button class="key ${guessed.has(k)?(letters.includes(k)?"hit":"miss"):""}" data-k="${esc(k)}" ${guessed.has(k)||win||lose?"disabled":""}>${esc(k)}</button>`).join("")}</div>
          <div id="hfb" style="margin-top:12px"></div></div>`;
        $$(".key", h.area).forEach(b=>b.onclick=()=>{ const k = b.dataset.k; guessed.add(k); if(letters.includes(k)) SFX.flip(); else { wrong++; SFX.bad(); } draw(); });
        if((win || lose) && !over){
          over = true; if(win){ h.add(10 + (lives - wrong)*3); if(kids) cheer($(".stage-panel", h.area)); } else h.miss();
          $("#hfb", h.area).innerHTML = `<p><b>${win?"Indovinato!":"La parola era:"}</b> ${esc(word)}${kids?"":` = ${esc(w.translation)}`}</p><button class="btn ${kids?"sun":""}" id="nx">Continua</button>`;
          Voice.speak(word); $("#nx", h.area).onclick = () => { i++; show(); }; $("#nx", h.area).focus();
        }
      };
      draw();
    };
    show();
  });
}
/* Pronuncia una parola o una frase al microfono */
function sayRounds(box, h, items, {kids, show: prompt, target, threshold, help=true}){
  return new Promise(resolve=>{
    let i = 0, session = null;
    h.extra = () => { if(session) session.stop(); };
    const next = () => {
      if(i >= items.length) return resolve();
      const w = items[i]; let tries = 0, done = false;
      h.area.innerHTML = `<div class="panel ${kids?"kids":""} stage-panel" style="text-align:center"><div class="small muted" style="text-align:right">${i+1}/${items.length}</div>
        ${prompt(w)}
        <button class="mic" id="mic" style="margin:10px auto" aria-label="Parla">${icon("mic")}</button><p id="heard" class="muted" style="min-height:1.5em"></p>
        <div class="row" style="justify-content:center">${help?`<button class="btn ghost sm" id="help">${icon("play")} Aiutami</button>`:""}<button class="btn ghost sm" id="skip">Salta</button></div></div>`;
      let helped = false;
      const hb = $("#help", h.area); if(hb) hb.onclick = () => { helped = true; Voice.speak(target(w), {rate:0.75}); };
      $("#skip", h.area).onclick = () => { if(done) return; done = true; h.miss(); Voice.speak(target(w)); setTimeout(()=>{ i++; next(); }, 1500); };
      $("#mic", h.area).onclick = async () => {
        if(done) return;
        if(session){ session.stop(); return; }
        const mic = $("#mic", h.area); mic.classList.add("on"); mic.innerHTML = icon("stop");
        session = Voice.listen({onInterim: t => { const el = $("#heard", h.area); if(el) el.textContent = t; }});
        let r = null; try{ r = await session; }catch(e){ const el = $("#heard", h.area); if(el) el.textContent = e.message; }
        session = null; if(!$("#mic", h.area)) return; mic.classList.remove("on"); mic.innerHTML = icon("mic");
        if(!r) return;
        const best = r.alts.map(a=>({a, x:align(target(w), a.text)})).sort((p,q)=>q.x.score-p.x.score)[0]; tries++;
        if(best.x.score >= threshold){
          done = true; h.add(helped ? 5 : 10 + Math.round(best.x.score/10)); if(kids) cheer($(".stage-panel", h.area));
          $("#heard", h.area).innerHTML = `${wordsHTML(best.x.words)} <b class="status-ok">${best.x.score}%</b>`;
          setTimeout(()=>{ i++; next(); }, 1400);
        } else {
          $("#heard", h.area).innerHTML = `${wordsHTML(best.x.words)} <span class="small">(${best.x.score}%) riprova</span>`;
          if(tries >= 3){ done = true; h.miss(); Voice.speak(target(w)); setTimeout(()=>{ i++; next(); }, 1800); }
        }
      };
    };
    next();
  });
}

      </div>`;

    else $$("[data-c]", box).forEach(b=>b.onclick=()=>turn(r.choices[+b.dataset.c].text));

/* Dov'è il gatto?: scene disegnate con le emoji */
const PREPS = [["on","on"],["under","under"],["in","in"],["next","next to"],["behind","behind"],["front","in front of"]];
const PREP_STAGE = [["on","under"],["on","under"],["on","under","in"],["on","under","in"],["on","under","in","next"],["on","under","in","next"],["on","under","in","next","behind"],["on","under","in","next","behind","front"],["on","under","in","next","behind","front"],["on","under","in","next","behind","front"]];
const SCENE_ANIMALS = ["🐱","🐶"], SCENE_OBJECTS = ["📦","🪑","🛏️","🧺"];
const sceneOk = (prep, obj) => prep !== "in" || obj === "📦" || obj === "🧺";
function sceneHTML(ani, prep, obj){ return `<span class="scene-tile p-${prep}"><span class="sc-obj">${obj}</span><span class="sc-ani">${ani}</span></span>`; }
async function scenePhrases(all){
  // Inglese: frasi già pronte. Altre lingue: l'IA le scrive una volta e restano salvate.
  const combos = [];
  for(const a of SCENE_ANIMALS) for(const [p] of PREPS) for(const o of SCENE_OBJECTS) if(sceneOk(p,o)) combos.push([a,p,o]);
  const key = (a,p,o) => `${a}|${p}|${o}`, out = {};
  if(isEN()){
    for(const [a,p,o] of combos) out[key(a,p,o)] = `The ${byId(all,a).word} is ${PREPS.find(x=>x[0]===p)[1]} the ${byId(all,o).word}.`;
    return out;
  }
  const cached = (state.kidsPhr || {})[S().lang];
  if(cached && Object.keys(cached).length >= combos.length) return cached;
  const itP = {on:"sopra", under:"sotto", in:"dentro", next:"accanto a", behind:"dietro", front:"davanti a"};
  const list = combos.map(([a,p,o]) => `${byId(all,a).it} ${itP[p]} ${byId(all,o).it}`);
  const r = await ask(`Sei un insegnante di ${L().name} per bambini. ${JSON_ONLY}`,
    `Per ognuna di queste situazioni scrivi una frase semplicissima in ${L().name} del tipo "Il gatto è sotto la scatola", nello stesso ordine.\n${JSON.stringify(list)}\nJSON: {"sentences":["..."]}`,
    {temperature:0.2, maxTokens:2500}, r => Array.isArray(r.sentences) && r.sentences.length === combos.length);
  combos.forEach(([a,p,o], i) => { out[key(a,p,o)] = String(r.sentences[i]); });
  state.kidsPhr = {...(state.kidsPhr||{}), [S().lang]:out}; save();
  return out;
}

/* Cruciverba: incastra le parole in una griglia */
function makeCrossword(words, maxN = 99){
  for(let attempt = 0; attempt < 25; attempt++){
    const list = attempt ? shuffle(words) : [...words].sort((a,b)=>b.w.length-a.w.length);
    const grid = new Map(), placed = [], get = (r,c) => grid.get(r+","+c);
    const fits = (w, r, c, across) => {
      let cross = 0;
      if(get(across ? r : r-1, across ? c-1 : c) || get(across ? r : r+w.length, across ? c+w.length : c)) return false;
      for(let k = 0; k < w.length; k++){
        const rr = across ? r : r+k, cc = across ? c+k : c, ex = get(rr, cc);
        if(ex){ if(ex !== w[k]) return false; cross++; continue; }
        if(across ? (get(rr-1,cc) || get(rr+1,cc)) : (get(rr,cc-1) || get(rr,cc+1))) return false;
      }
      return placed.length === 0 || cross > 0;
    };
    const put = (item, r, c, across) => { for(let k = 0; k < item.w.length; k++) grid.set((across ? r : r+k) + "," + (across ? c+k : c), item.w[k]); placed.push({...item, r, c, across}); };
    put(list[0], 0, 0, true);
    for(const item of list.slice(1)){
      if(placed.length >= maxN) break;
      let done = false;
      for(const p of shuffle(placed)){
        for(let i = 0; i < p.w.length && !done; i++) for(let j = 0; j < item.w.length && !done; j++){
          if(p.w[i] !== item.w[j]) continue;
          const across = !p.across, r = p.across ? p.r - j : p.r + i, c = p.across ? p.c + i : p.c - j;
          if(fits(item.w, r, c, across)){ put(item, r, c, across); done = true; }
        }
        if(done) break;
      }
    }
    if(placed.length >= Math.min(3, words.length)){
      const minR = Math.min(...placed.map(p=>p.r)), minC = Math.min(...placed.map(p=>p.c));
      placed.forEach(p => { p.r -= minR; p.c -= minC; });
      const rows = Math.max(...placed.map(p => p.across ? p.r+1 : p.r+p.w.length)), cols = Math.max(...placed.map(p => p.across ? p.c+p.w.length : p.c+1));
      const starts = [...new Set(placed.map(p=>p.r+","+p.c))].sort((a,b)=>{ const [ar,ac]=a.split(",").map(Number), [br,bc]=b.split(",").map(Number); return ar-br || ac-bc; });
      placed.forEach(p => p.num = starts.indexOf(p.r+","+p.c) + 1);
      return {placed, rows, cols};
    }
  }
  return null;
}

      const seen = new Set(), uniq = pool.filter(w => { const k = bare(w.word); if(seen.has(k)) return false; seen.add(k); return true; });
      const want = [3,3,4,4,5,5,6,6,7,7][n-1];

        const cw = makeCrossword(pickFresh(uniq, Math.min(uniq.length, want + 4)).map(w => ({w:[...bare(w.word).toUpperCase()], ref:w})), want);
        if(cw && cw.placed.length >= Math.min(want, 3)) return cw;

      throw new Error("Non sono riuscito a creare il cruciverba. Riprova.");
    },

      const h = makeHud(box, {title:"Cruciverba", n, kids:true});

        const cell = cells.get(key) || {r, c, ch, words:[]}; cell.words.push(wi); cells.set(key, cell); }));
      const rows = Math.max(...[...cells.values()].map(x=>x.r)) + 1, cols = Math.max(...[...cells.values()].map(x=>x.c)) + 1;
      const nums = {}; cw.placed.forEach(p => { nums[p.r+","+p.c] = p.num; });
      let dir = null, hints = 0, wrongChecks = 0;
      h.area.innerHTML = `<div class="panel kids stage-panel"><div class="cwrap"><div class="cgrid" style="grid-template-columns:repeat(${cols}, minmax(30px, 46px))">

  $("#draw").onclick = () => { if(over) return; if(!calls.length){ $("#calltxt").textContent = "Parole finite!"; return; } cur = calls.shift(); $("#calltxt").textContent = cur.word; kidSay(cur.word); };

/* Lettura ad alta voce con la parola evidenziata */
function readAloud(el, text, {rate}={}){
  let pos = 0;
  el.innerHTML = String(text).split(/(\s+)/).map(p=>{ const s = pos; pos += p.length; return /^\s+$/.test(p) ? p : `<span class="rw" data-s="${s}">${esc(p)}</span>`; }).join("");
  return new Promise(resolve=>{
    if(!("speechSynthesis" in window)){ resolve(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = L().code; const v = Voice.pick(); if(v) u.voice = v; u.rate = rate ?? (kidAge()==="3-5" ? 0.75 : 0.85);
    const spans = [...el.querySelectorAll(".rw")];
    u.onboundary = e => { if(e.name && e.name !== "word") return; el.classList.add("wordsync"); let cur = null; for(const sp of spans){ if(+sp.dataset.s <= e.charIndex) cur = sp; else break; } spans.forEach(sp=>sp.classList.toggle("on", sp===cur)); };
    u.onstart = () => { setAvatar("talk"); el.classList.add("reading"); };
    u.onend = u.onerror = () => { setAvatar(null); spans.forEach(sp=>sp.classList.remove("on")); el.classList.remove("reading","wordsync"); resolve(); };
    speechSynthesis.speak(u);
  });
}

    $("#pok", ov).onclick = () => { const a = $("#p1", ov).value.trim(), b = $("#p2", ov).value.trim();
      if(!/^\d{4}$/.test(a)) { $("#pm", ov).textContent = "Il codice deve avere 4 cifre."; return; }
      if(a !== b){ $("#pm", ov).textContent = "I due codici sono diversi."; return; }
      ov.remove(); resolve(a); };
    $("#pno", ov).onclick = () => { ov.remove(); resolve(null); };
  });
}

/* ---- Missione del giorno ---- */
const MISSIONS = {
  gioco:{t:"Supera un livello in un gioco", e:"🎮", go:"#giochi", need:1},
  canzone:{t:"Ascolta una canzoncina fino alla fine", e:"🎵", go:"#bambini-canzoni", need:1},
  storia:{t:"Ascolta una storia fino alla fine", e:"📖", go:"#bambini-storie", need:1},
  parole:{t:"Ascolta 5 parole del vocabolario", e:"🔤", go:"#bambini-voc", need:5},
  abc:{t:"Ascolta 5 lettere dell'alfabeto", e:"🅰️", go:"#bambini-abc", need:5},
  amico:{t:"Fai 3 chiacchiere con Pip", e:"🐧", go:"#bambini-amico", need:3}
};
function todayMission(){
  const st = kidStore(); if(!currentKid()) return null;
  if(st.mission?.date === today() && st.mission.lang === S().lang) return st.mission;
  const keys = Object.keys(MISSIONS).filter(k => k!=="abc" || hasABC());
  const seed = [...(today()+currentKid().id)].reduce((a,c)=>a + c.charCodeAt(0), 0);
  const pick = keys.map((k,i)=>({k, r:(seed*31 + i*17) % 97})).sort((a,b)=>a.r-b.r).slice(0,3).map(x=>x.k);
  st.mission = {date:today(), lang:S().lang, tasks:pick, prog:{}, seen:{}, rewarded:false}; save();
  return st.mission;
}
function missionTick(type, key){
  const m = todayMission(); if(!m || !m.tasks.includes(type)) return;
  if(key != null){ m.seen[type] = m.seen[type] || []; if(m.seen[type].includes(key)) return; m.seen[type].push(key); }
  m.prog[type] = Math.min(MISSIONS[type].need, (m.prog[type]||0) + 1);
  if(m.prog[type] === MISSIONS[type].need) toast(`${MISSIONS[type].e} Missione: fatto!`);
  if(!m.rewarded && m.tasks.every(t => (m.prog[t]||0) >= MISSIONS[t].need)){ m.rewarded = true; const s = awardSticker(); setTimeout(()=>toast(`🏆 Missione del giorno completata!${s?" Nuovo adesivo "+s:""}`), 1200); SFX.win(); addXP(15); }
  save();
}

/* Pip, l'amico parlante */
async function kidsFriend(main){
  const kid = currentKid(), age = kidAge(), turns = [];
  const sys = `Sei Pip, un pinguino allegro, gentile e paziente che aiuta un bambino di ${age} anni a imparare il ${L().name.toLowerCase()}. Il bambino è italiano.
Come parli: SEMPRE in ${L().name}, ${age==="3-5" ? "una o due frasi brevissime (massimo 6 parole ciascuna), parole facilissime" : "massimo due frasi brevi con parole facili"}. Fai UNA domanda semplice alla volta su argomenti da bambini: animali, colori, cibo, giochi, numeri, stagioni, giocattoli. Lodi spesso. Se il bambino parla in italiano, gli dici con dolcezza come si dice in ${L().name} e gli chiedi di ripeterlo.
Regole di sicurezza, sempre valide:
- Non chiedere mai nome completo, cognome, indirizzo, città, scuola, numero di telefono, foto o altri dati personali. Se il bambino li dice, non ripeterli e cambia argomento con un gioco.
- Non proporre segreti e non dire mai di tenere qualcosa nascosto ai genitori.
- Niente argomenti per adulti, paura, violenza, acquisti o marche. Se il bambino ne parla, rispondi con dolcezza e proponi un altro gioco.
- Se il bambino sembra triste, spaventato o dice che qualcuno gli fa male, rispondi con gentilezza, in italiano nella traduzione, che è importante dirlo subito alla mamma, al papà o a un adulto di cui si fida.
${JSON_ONLY}
Formato: {"reply":"risposta in ${L().name}","it":"traduzione italiana","emoji":"una emoji legata alla risposta"}`;
  main.innerHTML = `<a class="btn ghost sm" href="#bambini">${icon("back")} Casa</a>
    <div class="friend"><div class="pip" id="pip">🐧</div><div class="fbub" id="fb">…</div><p class="small muted" id="fit"></p>
      <button class="mic big" id="mic" aria-label="Parla con Pip">${icon("mic")}</button><p class="muted" id="heard">Tocca il microfono e parla con Pip!</p>
      ${age==="6-8" ? `<div class="row" style="justify-content:center"><input class="input" id="ft" placeholder="Oppure scrivi qui" style="max-width:260px" autocomplete="off"><button class="btn ghost" id="fsend">Invia</button></div>` : ""}
      <button class="btn ghost sm" id="rep" style="margin-top:8px">${icon("play")} Riascolta Pip</button></div>`;
  let last = "", session = null, busy = false;
  cleanup = () => { if(session) session.stop(); };
  const say = async (userText) => {
    if(busy) return; busy = true;
    if(userText) turns.push({role:"user", content:userText});
    $("#fb").innerHTML = `<span class="spinner"></span>`;
    try{
      const msgs = [{role:"system", content:sys}, ...turns.slice(-10)];
      if(!userText) msgs.push({role:"user", content:`[inizio] Saluta ${kid ? "il bambino" : "il bambino"} e fai una prima domanda facile.`});
      const r = await llm(msgs, {temperature:0.8, maxTokens:300});
      if(!r.reply) throw new Error("Pip non ha capito, riprova.");
      turns.push({role:"assistant", content:JSON.stringify(r)}); last = r.reply;
      if(!$("#fb")) return;
      $("#pip").textContent = r.emoji ? "🐧" + r.emoji : "🐧"; $("#fit").textContent = r.it || "";
      await readAloud($("#fb"), r.reply);
      if(userText) missionTick("amico");
    }catch(e){ if($("#fb")) $("#fb").textContent = "Ops! Pip non risponde. " + e.message; }
    busy = false;
  };
  $("#rep").onclick = () => last && readAloud($("#fb"), last);
  $("#mic").onclick = async () => {
    if(busy) return; if(session){ session.stop(); return; }
    const mic = $("#mic"); mic.classList.add("on"); mic.innerHTML = icon("stop");
    session = Voice.listen({onInterim: t => { const el = $("#heard"); if(el) el.textContent = t; }});
    let r = null; try{ r = await session; }catch(e){ const el = $("#heard"); if(el) el.textContent = e.message; }
    session = null; if(!$("#mic")) return; mic.classList.remove("on"); mic.innerHTML = icon("mic");
    if(r && r.text){ $("#heard").textContent = "Hai detto: " + r.text; say(r.text); } else if(!r) $("#heard").textContent = "Non ho sentito. Riprova!";
  };
  const fs = $("#fsend"); if(fs){ const go = () => { const v = $("#ft").value.trim(); if(!v) return; $("#ft").value = ""; $("#heard").textContent = "Hai scritto: " + v; say(v); }; fs.onclick = go; $("#ft").onkeydown = e => { if(e.key==="Enter") go(); }; }
  say(null);
}

function verdictOf(overall, per){
  const minSec = Math.min(...Object.values(per));
  if(overall >= 85 && minSec >= 60) return {k:"great", t:"Promosso con ottimo risultato", d:"Saresti pronto per l'esame di questo livello e potresti provare quello successivo."};
  if(overall >= 60 && minSec >= 40) return {k:"pass", t:"Probabilmente promosso", d:"Con questo risultato, in un esame vero avresti buone possibilità di passare."};
  if(overall >= 50) return {k:"close", t:"Al limite", d:"Sei vicino alla sufficienza: con un po' di allenamento sulle parti più deboli ce la puoi fare."};
  return {k:"fail", t:"Non ancora", d:"Per ora un esame vero di questo livello sarebbe difficile: ti conviene allenarti ancora, o provare il livello precedente."};
}

  let micSession = null;
