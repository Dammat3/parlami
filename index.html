<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parlami – il tuo tutor di lingue</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3446E8">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EBF4; --surface:#FFFFFF; --surface-2:#F2F4FA; --ink:#1A1D3A; --muted:#5B6185; --line:#D3D8EA;
  --primary:#3446E8; --primary-ink:#FFFFFF; --primary-soft:#E2E6FF;
  --sun:#FFC53D; --sun-ink:#3A2A00;
  --ok:#0F8A63; --ok-bg:#DCF4EA; --bad:#CC2F3D; --bad-bg:#FCE4E6;
  --r-lg:24px; --r:14px; --r-sm:9px;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11132A; --surface:#1B1E3C; --surface-2:#242850; --ink:#ECEEFF; --muted:#A4A9D0; --line:#30366A;
    --primary:#8391FF; --primary-ink:#0D0F2E; --primary-soft:#2A3070;
    --sun:#FFD166; --sun-ink:#2B2000;
    --ok:#43D39E; --ok-bg:#103A2D; --bad:#FF7480; --bad-bg:#3F1A23;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,4vw,2.6rem);font-weight:800}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.1rem;font-weight:600}
p{margin:0 0 .8em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.main:focus{outline:none}
.notice a{color:inherit}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* Layout */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:28px 16px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:1.6rem;padding:0 12px 22px;display:flex;align-items:center;gap:10px}
.brand-dot{width:30px;height:30px;border-radius:50%;background:var(--primary);position:relative}
.brand-dot::after{content:"";position:absolute;width:12px;height:6px;border-radius:0 0 8px 8px;background:var(--sun);left:9px;top:16px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r);color:var(--muted);text-decoration:none;font-weight:700}
.nav a svg{width:22px;height:22px;flex:none}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.active{background:var(--primary-soft);color:var(--primary)}
.rail-foot{margin-top:auto;padding:12px;display:flex;gap:16px;font-weight:700}
.main{padding:36px clamp(16px,4vw,48px) 60px;max-width:1040px;width:100%}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);background:var(--surface);z-index:20}
  .brand,.rail-foot{display:none}
  .nav{display:flex;width:100%;justify-content:space-around}
  .nav a{flex-direction:column;gap:2px;font-size:.68rem;padding:6px 4px}
  .main{padding:22px 16px calc(96px + env(safe-area-inset-bottom,0px))}
}

/* Surfaces */
.panel{background:var(--surface);border-radius:var(--r-lg);padding:22px;border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:700;background:var(--primary);color:var(--primary-ink);display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:46px}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.sm{padding:7px 14px;min-height:36px;font-size:.92rem}
.btn svg{width:20px;height:20px}
.iconbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:50%;width:40px;height:40px;display:inline-grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.95rem}
.field input,.field select,textarea.input,input.input,select.input{border:1.5px solid var(--line);border-radius:var(--r);padding:11px 14px;background:var(--surface-2);font-weight:400;width:100%}
.field input:focus,.field select:focus,.input:focus{outline:none;border-color:var(--primary)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:.88rem;font-weight:700}
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.notice{border-radius:var(--r);padding:14px 16px;background:var(--sun);color:var(--sun-ink);font-weight:700}
.err{border-radius:var(--r);padding:14px 16px;background:var(--bad-bg);color:var(--bad);font-weight:700}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--primary);animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;gap:12px;align-items:center;padding:30px;justify-content:center;color:var(--muted);font-weight:700}

/* Avatar */
.avatar{display:block}
.avatar .eye{animation:blink 5s infinite;transform-origin:center;transform-box:fill-box}
.avatar .mouth{transform-origin:center;transform-box:fill-box;transition:transform .1s}
.avatar.talking .mouth{animation:talk .16s infinite alternate}
.avatar.listening .ring{opacity:1;animation:pulse 1.2s infinite}
.avatar .ring{opacity:0}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.25)}}
@keyframes pulse{0%{stroke-width:2}50%{stroke-width:8}100%{stroke-width:2}}

/* Home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.hero .bubble{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);border-bottom-left-radius:6px;padding:20px 22px;font-size:1.15rem}
@media (max-width:600px){.hero{grid-template-columns:1fr;justify-items:start}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{font-family:var(--display);font-size:1.7rem;display:block;line-height:1.1}
.action{display:flex;gap:16px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;color:var(--ink)}
.action:hover{border-color:var(--primary)}
.action .ic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;flex:none;background:var(--primary-soft);color:var(--primary)}
.action .ic svg{width:26px;height:26px}
.action h3{margin:0 0 2px}

/* Lessons path */
.path{display:flex;flex-direction:column;gap:12px}
.unit{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 18px;text-align:left;width:100%;color:var(--ink)}
.unit:hover{border-color:var(--primary)}
.unit .num{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--surface-2);border:2px solid var(--line);flex:none}
.unit.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.unit.next .num{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.unit .meta{flex:1}
.unit h3{margin:0}

/* Exercise */
.progress{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress > i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.ex-type{font-weight:700;color:var(--primary)}
.ex-q{font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1.25;margin:4px 0 18px}
.options{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:13px 16px;text-align:left;font-weight:700}
.opt:hover{border-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.tokens{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:8px;border-radius:var(--r);border:2px dashed var(--line)}
.tokens.bank{border-style:solid;border-color:transparent;padding:8px 0}
.tok{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:7px 13px;font-weight:700}
.tok.used{visibility:hidden}
.feedback{border-radius:var(--r-lg);padding:16px 18px;margin-top:18px}
.feedback.good{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.feedback p{color:var(--ink);font-weight:400}
.feedback h3{margin-bottom:.3em}
.words .w{padding:2px 4px;border-radius:6px;font-weight:700}
.words .w.ok{background:var(--ok-bg);color:var(--ok)}
.words .w.miss{background:var(--bad-bg);color:var(--bad);text-decoration:underline wavy}
.bigsent{font-family:var(--display);font-size:clamp(1.4rem,3.4vw,2rem);font-weight:600;line-height:1.3}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;box-shadow:0 0 0 0 var(--primary-soft)}
.mic svg{width:34px;height:34px}
.mic.on{background:var(--bad);color:#fff;animation:micpulse 1.2s infinite}
@keyframes micpulse{0%{box-shadow:0 0 0 0 var(--bad-bg)}100%{box-shadow:0 0 0 18px transparent}}
.score{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1}

/* Vocab cards in lesson */
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.vcard{background:var(--surface-2);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.vcard b{display:block}

/* Tutor chat */
.tutor{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
@media (max-width:900px){.tutor{grid-template-columns:1fr}}
.tutor-side{position:sticky;top:20px;text-align:center}
.chat{display:flex;flex-direction:column;gap:12px;min-height:300px;max-height:58vh;overflow-y:auto;padding:4px}
.msg{max-width:85%;padding:12px 16px;border-radius:20px}
.msg.t{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.u{align-self:flex-end;background:var(--primary);color:var(--primary-ink);border-bottom-right-radius:6px}
.msg .tr{font-size:.9rem;color:var(--muted);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.corr{align-self:flex-end;max-width:85%;background:var(--sun);color:var(--sun-ink);border-radius:16px;padding:10px 14px;font-size:.95rem}
.corr s{opacity:.75}
.corr .ok{font-weight:700}
.composer{display:flex;gap:10px;align-items:flex-end;margin-top:14px}
.composer textarea{flex:1;resize:none;min-height:52px;max-height:140px}
.composer .mic{width:54px;height:54px}
.composer .mic svg{width:24px;height:24px}

/* Games */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:var(--r);padding:14px;font-weight:700;min-height:56px}
.pair.sel{border-color:var(--primary);background:var(--primary-soft)}
.pair.gone{visibility:hidden}
.pair.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sprint-card{text-align:center;padding:40px 20px}
.sprint-card .w{font-family:var(--display);font-size:2.2rem;font-weight:800}
.timer{font-family:var(--display);font-weight:800;font-size:1.3rem}

/* Flashcards */
.flash{min-height:220px;display:grid;place-items:center;text-align:center;cursor:pointer;user-select:none}
.flash .w{font-family:var(--display);font-size:2.2rem;font-weight:800}
table.list{width:100%;border-collapse:collapse}
table.list td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}

.prov{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.prov.off{opacity:.6}
.prov .head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.prov .field input{background:var(--surface)}
.status-ok{color:var(--ok);font-weight:700}
.status-bad{color:var(--bad);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:50;opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
@media (max-width:820px){.toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Sezioni">
    <div class="brand"><span class="brand-dot" aria-hidden="true"></span>Parlami</div>
    <div class="nav" id="nav"></div>
    <div class="rail-foot" id="railfoot"></div>
  </nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const APP_VERSION = "0.4";
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
let deferredInstall = null;
function isStandalone(){ return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; }
/* ============ Dati di base ============ */
const LANGS = {
  en:{name:"Inglese", code:"en-US"}, es:{name:"Spagnolo", code:"es-ES"}, fr:{name:"Francese", code:"fr-FR"},
  de:{name:"Tedesco", code:"de-DE"}, pt:{name:"Portoghese", code:"pt-PT"}, nl:{name:"Olandese", code:"nl-NL"},
  ru:{name:"Russo", code:"ru-RU"}, ja:{name:"Giapponese", code:"ja-JP"}, zh:{name:"Cinese", code:"zh-CN"},
  ko:{name:"Coreano", code:"ko-KR"}, ar:{name:"Arabo", code:"ar-SA"}
};
const NOSPACE = ["ja","zh"];
const LEVELS = ["A1","A2","B1","B2","C1"];
const PERSONAS = {
  sofia:{name:"Sofia", color:"#3446E8", face:"#FFD9B8", hair:"#3B2416", style:"paziente, gentile e incoraggiante; spieghi con calma e lodi i progressi", tag:"Paziente"},
  leo:{name:"Leo", color:"#E8742E", face:"#F2C59B", hair:"#1D1D1D", style:"energico, spiritoso e pieno di entusiasmo; usi battute leggere e domande vivaci", tag:"Energico"},
  maya:{name:"Maya", color:"#12936A", face:"#C98B62", hair:"#2A140A", style:"diretta ed esigente; correggi ogni errore, anche piccolo, e spingi lo studente a formulare frasi più complete", tag:"Esigente"},
  ben:{name:"Ben", color:"#7A4FD6", face:"#E8C4A6", hair:"#8A6A3A", style:"calmo e professionale; ti concentri su un linguaggio utile per lavoro e situazioni formali", tag:"Professionale"}
};
const SCENARIOS = {
  libera:{name:"Chiacchierata libera", prompt:"una conversazione libera e amichevole su interessi, giornata e vita dello studente"},
  bar:{name:"Al bar o al ristorante", prompt:"tu sei il cameriere e lo studente ordina da mangiare e da bere"},
  aeroporto:{name:"In aeroporto", prompt:"tu sei l'addetto al check-in e lo studente deve imbarcarsi con il bagaglio"},
  hotel:{name:"In albergo", prompt:"tu sei il receptionist e lo studente fa il check-in e chiede informazioni"},
  negozio:{name:"Fare shopping", prompt:"tu sei il commesso di un negozio di abbigliamento e lo studente cerca qualcosa"},
  medico:{name:"Dal medico", prompt:"tu sei il medico e lo studente descrive dei sintomi leggeri"},
  colloquio:{name:"Colloquio di lavoro", prompt:"tu sei il selezionatore e fai un colloquio di lavoro allo studente"},
  amici:{name:"Nuova conoscenza", prompt:"vi siete appena conosciuti a una festa e fate amicizia"}
};
const UNITS = [
  {id:"u1", title:"Saluti e presentazioni", focus:"salutare, presentarsi, dire da dove si viene"},
  {id:"u2", title:"Numeri, età e date", focus:"numeri, età, giorni, mesi, l'ora"},
  {id:"u3", title:"Famiglia e amici", focus:"parlare della famiglia, aggettivi possessivi, descrivere persone"},
  {id:"u4", title:"Casa e routine", focus:"la giornata tipo, verbi di routine, avverbi di frequenza"},
  {id:"u5", title:"Cibo e ristorante", focus:"ordinare, gusti, quantità, chiedere il conto"},
  {id:"u6", title:"In città", focus:"chiedere e dare indicazioni, mezzi di trasporto, preposizioni di luogo"},
  {id:"u7", title:"Fare acquisti", focus:"prezzi, taglie, colori, comparativi"},
  {id:"u8", title:"Tempo libero", focus:"hobby, sport, invitare e rifiutare"},
  {id:"u9", title:"Viaggi", focus:"prenotare, aeroporto, albergo, imprevisti"},
  {id:"u10", title:"Il passato", focus:"raccontare eventi passati, tempi verbali del passato"},
  {id:"u11", title:"Piani e futuro", focus:"progetti, intenzioni, tempi verbali del futuro"},
  {id:"u12", title:"Lavoro e studio", focus:"professioni, ufficio, email e conversazioni formali"},
  {id:"u13", title:"Salute e corpo", focus:"parti del corpo, sintomi, consigli"},
  {id:"u14", title:"Opinioni e sentimenti", focus:"esprimere opinioni, essere d'accordo o no, emozioni"},
  {id:"u15", title:"Ipotesi e condizioni", focus:"periodi ipotetici, desideri, consigli"}
];
const BOX_DAYS = [0,0,1,3,7,14,30];
const SKIP_MODELS = /whisper|embed|guard|tts|audio|image|vision|moderation|rerank|transcri|speech|ocr|orpheus|playai|voice|sound|music|video/i;
/* Famiglie di modelli conosciute e adatte alla conversazione */
const GOOD_MODELS = /llama|gemma|mistral|qwen|deepseek|glm|kimi|gpt-oss|nemotron|phi|command|hermes/i;
/* Modelli che "ragionano" prima di rispondere: lenti e a volte rispondono vuoto se hanno pochi token */
const REASONING = /gpt-oss|qwen3|qwq|deepseek-r1|-r1|reason|think|magistral|o1-|o3-|o4-/i;
const PRESETS = {
  freellmapi:{name:"FreeLLMAPI sul PC", base:"http://localhost:3001/v1", keyUrl:"", note:"Funziona solo sul computer dove è avviato FreeLLMAPI. Sul telefono viene saltato in automatico."},
  groq:{name:"Groq", base:"https://api.groq.com/openai/v1", pref:/llama-3\.3-70b|llama|qwen|gpt-oss/i, keyUrl:"https://console.groq.com/keys", note:"Molto veloce: ottimo per la conversazione a voce."},
  openrouter:{name:"OpenRouter", base:"https://openrouter.ai/api/v1", pref:/:free$/i, onlyPref:true, keyUrl:"https://openrouter.ai/keys", note:"Usa solo i modelli gratuiti, quelli che finiscono con :free."},
  cerebras:{name:"Cerebras", base:"https://api.cerebras.ai/v1", pref:/llama|qwen|gpt-oss/i, keyUrl:"https://cloud.cerebras.ai", note:""},
  mistral:{name:"Mistral", base:"https://api.mistral.ai/v1", pref:/small|nemo/i, keyUrl:"https://console.mistral.ai/api-keys", note:""},
  gemini:{name:"Google Gemini", base:"https://generativelanguage.googleapis.com/v1beta/openai", pref:/flash/i, keyUrl:"https://aistudio.google.com/apikey", note:"Prima di usarlo leggi i termini di Google: in Europa pongono limiti al piano gratuito."},
  custom:{name:"Altro provider compatibile OpenAI", base:"", keyUrl:"", note:"Inserisci l'indirizzo che termina con /v1."}
};

/* ============ Stato e salvataggio ============ */
const STORE_KEY = "parlami.v1";
const DEFAULT_STATE = {
  settings:{providers:null, lang:"en", level:"A2",
    voiceURI:"", rate:0.95, autoSpeak:true, persona:"sofia", showTr:false, connected:false},
  xp:0, streak:0, lastDay:null, todayXp:0, todayDate:null, dailyGoal:50,
  lessons:{}, progress:{}, words:[], mistakes:[]
};
let state = load();
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return migrate({});
    return migrate(JSON.parse(raw));
  }catch(e){ return migrate({}); }
}

function migrate(s){
  const st = {...structuredClone(DEFAULT_STATE), ...s, settings:{...DEFAULT_STATE.settings, ...(s.settings||{})}};
  const set = st.settings;
  if(!Array.isArray(set.providers)){
    set.providers = [{id:uid(), preset:"freellmapi", name:PRESETS.freellmapi.name, base:set.apiBase || PRESETS.freellmapi.base, key:set.apiKey || "", model:set.model || "auto", on:true}];

  delete set.apiBase; delete set.apiKey; delete set.model;
  for(const p of set.providers){ if(!p.manual && p.preset!=="freellmapi" && p.preset!=="custom" && (REASONING.test(p.model||"") || SKIP_MODELS.test(p.model||""))) p.model = ""; }

}

const $ = (sel, root=document) => root.querySelector(sel);

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shuffle(a){ a = [...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);

function norm(s){
  return String(s||"").toLowerCase().normalize("NFC")
    .replace(/[’`´]/g,"'")
    .replace(/[.,!?;:¿¡"“”«»()\[\]…–—\-、。，！？「」]/g," ")
    .replace(/\s+/g," ").trim();
}
function bare(s){ return norm(s).normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function tokens(s, lang=S().lang){
  const n = norm(s);
  if(NOSPACE.includes(lang)) return [...n.replace(/\s+/g,"")];
  return n.split(" ").filter(Boolean);
}
/* Allinea parole attese e parole sentite (LCS) */
function align(target, heard, lang=S().lang){
  const a = tokens(target, lang), b = tokens(heard, lang);
  const A = a.map(x=>bare(x)), B = b.map(x=>bare(x));
  const dp = Array.from({length:a.length+1}, ()=>new Array(b.length+1).fill(0));
  for(let i=a.length-1;i>=0;i--) for(let j=b.length-1;j>=0;j--)
    dp[i][j] = A[i]===B[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const out = []; let i=0, j=0;
  while(i<a.length){
    if(j<b.length && A[i]===B[j]){ out.push({w:a[i], ok:true}); i++; j++; }
    else if(j<b.length && dp[i][j+1] >= dp[i+1][j]) j++;
    else { out.push({w:a[i], ok:false}); i++; }
  }
  const hits = out.filter(x=>x.ok).length;
  return {words:out, score: a.length ? Math.round(hits/a.length*100) : 0, missed: out.filter(x=>!x.ok).map(x=>x.w)};
}
function wordsHTML(words, lang=S().lang){
  const sep = NOSPACE.includes(lang) ? "" : " ";
  return `<span class="words">${words.map(x=>`<span class="w ${x.ok?"ok":"miss"}">${esc(x.w)}</span>`).join(sep)}</span>`;
}

/* ============ IA: più provider gratuiti con cambio automatico ============ */
const cooldown = {};
let lastProvider = "";

function provHeaders(p){ return {"Content-Type":"application/json", ...(p.key ? {Authorization:"Bearer "+p.key} : {})}; }
async function timedFetch(url, opts, ms=45000){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms);
  try{ return await fetch(url, {...opts, signal:c.signal}); } finally { clearTimeout(t); }
}
/* Elenco dei modelli di un provider */
async function listModels(p){
  let res;
  try{ res = await timedFetch(p.base.replace(/\/+$/,"") + "/models", {headers:provHeaders(p)}, 20000); }
  catch(e){ const err = new Error("non raggiungibile da qui (rete o blocco del browser)"); err.network = true; throw err; }
  if(!res.ok) throw httpError(res.status, "");
  const data = await res.json();
  const ids = (data.data || data.models || []).map(m => (m.id || m.name || "").replace(/^models\//,"")).filter(Boolean);
  return ids.filter(id => !SKIP_MODELS.test(id));
}
/* Ordina i modelli dal più adatto al meno adatto */
function rankModels(p, ids){
  const pre = PRESETS[p.preset] || {};
  const pool = pre.onlyPref && pre.pref ? ids.filter(id => pre.pref.test(id)) : ids;
  const score = id => (REASONING.test(id) ? 0 : 4) + (GOOD_MODELS.test(id) ? 2 : 0) + (pre.pref && pre.pref.test(id) ? 1 : 0);
  return pool.map((id,i)=>({id,i,sc:score(id)})).sort((a,b)=>b.sc-a.sc || a.i-b.i).map(x=>x.id);
}
function isAuto(p){ return !p.manual && p.preset!=="freellmapi" && p.preset!=="custom"; }
function modelProblem(e){ return e.empty || [400,404,422].includes(e.status); }
function markBad(p, id){ p.bad = [...new Set([...(p.bad||[]), id])].slice(-30); }
function httpError(status, text){
  let detail = String(text||"");
  try{ const j = JSON.parse(detail); detail = j?.error?.message || j?.message || detail; }catch(e){}
  const msg = status===401 || status===403 ? "chiave non valida" : status===429 ? "quota gratuita esaurita per ora" : status===404 ? "modello o indirizzo non trovato" : `errore ${status}: ${detail.slice(0,160)}`;
  const e = new Error(msg); e.status = status; return e;
}
/* Chiama un provider; se il modello scelto in automatico non va, prova i successivi */
async function callProvider(p, messages, opts={}){
  if(!isAuto(p)) return callModel(p, p.model || "auto", messages, opts);
  if(p.model){
    try{ return await callModel(p, p.model, messages, opts); }
    catch(e){ if(!modelProblem(e)) throw e; markBad(p, p.model); p.model = ""; save(); }
  }
  const cands = rankModels(p, await listModels(p)).filter(id => !(p.bad||[]).includes(id)).slice(0, 5);
  if(!cands.length) throw new Error("nessun modello adatto trovato: premi “Mostra i modelli” e scegline uno a mano");
  let last;
  for(const id of cands){
    try{ const t = await callModel(p, id, messages, opts); p.model = id; save(); return t; }
    catch(e){ last = e; if(!modelProblem(e)) throw e; markBad(p, id); save(); }
  }
  throw last;
}
async function callModel(p, model, messages, {temperature=0.7, maxTokens=1800}={}, retried=false){
  let res;
  try{
    res = await timedFetch(p.base.replace(/\/+$/,"") + "/chat/completions", {method:"POST", headers:provHeaders(p),
      body: JSON.stringify({model, messages, temperature, max_tokens:maxTokens})});
  }catch(e){ const err = new Error(e.name==="AbortError" ? "nessuna risposta entro 45 secondi" : "non raggiungibile da qui (rete o blocco del browser)"); err.network = true; throw err; }
  if(!res.ok){ let t=""; try{ t = await res.text(); }catch(e){} throw httpError(res.status, t); }
  const data = await res.json();
  const choice = data?.choices?.[0] || {}, msg = choice.message || {};
  let text = Array.isArray(msg.content) ? msg.content.map(x => x?.text || "").join("") : (msg.content || "");
  text = String(text).replace(/<think>[\s\S]*?<\/think>/gi, "").trim();
  if(!text){
    const thinking = msg.reasoning || msg.reasoning_content || choice.finish_reason === "length";
    if(thinking && !retried) return callModel(p, model, messages, {temperature, maxTokens: Math.max(1500, maxTokens*6)}, true);
    const why = choice.finish_reason ? ` (motivo: ${choice.finish_reason})` : "";
    const e = new Error(`il modello ${model} ha dato una risposta vuota${why}. Prova a scegliere un altro modello con “Mostra i modelli”.`);
    e.empty = true; throw e;
  }
  return text;
}
function usableProviders(){
  return (S().providers || []).filter(p => p.on && p.base && (p.key || p.preset==="freellmapi" || p.preset==="custom"));
}
/* Prova i provider in ordine e passa al successivo se uno fallisce */
async function llm(messages, {json=true, temperature=0.7, maxTokens=1800}={}){
  const all = usableProviders();
  if(!all.length){ const e = new Error("Nessuna IA configurata. Vai in Impostazioni e aggiungi almeno un provider con la sua chiave."); e.network = true; throw e; }
  const now = Date.now();
  const ready = all.filter(p => !(cooldown[p.id] > now));
  const order = ready.length ? ready : all;
  const errs = [];
  for(const p of order){
    try{
      const text = await callProvider(p, messages, {temperature, maxTokens});
      const out = json ? parseJSON(text) : text;
      lastProvider = p.name; delete cooldown[p.id];
      return out;
    }catch(e){
      errs.push(`${p.name}: ${e.message}`);
      if(e.status===429) cooldown[p.id] = Date.now() + 60000;
      else if(e.network || e.status) cooldown[p.id] = Date.now() + 30000;
    }
  }
  const err = new Error("Nessuna IA ha risposto. " + errs.join(" · ")); err.network = true; throw err;
}
function parseJSON(text){
  const t = String(text).replace(/```(?:json)?/gi,"").trim();
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if(a < 0 || b <= a) throw new Error("L'IA non ha risposto nel formato previsto.");
  return JSON.parse(t.slice(a, b+1));
}
async function ask(system, user, opts={}, validate){
  let lastErr;
  for(let attempt=0; attempt<2; attempt++){
    try{
      const out = await llm([{role:"system", content:system}, {role:"user", content:user}], opts);
      if(validate && !validate(out)) throw new Error("La risposta dell'IA era incompleta.");
      return out;
    }catch(e){ lastErr = e; if(e.network) break; }
  }
  throw lastErr;
}

/* ============ Voce: sintesi e riconoscimento ============ */
const Voice = {
  voices: [],
  init(){
    if(!("speechSynthesis" in window)) return;
    const load = () => { this.voices = speechSynthesis.getVoices(); };
    load(); speechSynthesis.onvoiceschanged = load;
  },
  forLang(){
    const code = L().code, pre = code.split("-")[0];
    return this.voices.filter(v => v.lang.replace("_","-").toLowerCase().startsWith(pre));
  },
  pick(){
    const list = this.forLang();
    return list.find(v=>v.voiceURI===S().voiceURI) || list.find(v=>v.lang.replace("_","-")===L().code) || list[0] || null;
  },
  speak(text, {rate}={}){
    return new Promise(resolve=>{
      if(!("speechSynthesis" in window) || !text){ resolve(); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = L().code; const v = this.pick(); if(v) u.voice = v;
      u.rate = rate ?? S().rate;
      u.onstart = () => setAvatar("talk");
      u.onend = u.onerror = () => { setAvatar(null); resolve(); };
      speechSynthesis.speak(u);
    });
  },
  stop(){ if("speechSynthesis" in window) speechSynthesis.cancel(); setAvatar(null); },
  canListen(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); },
  /* Ritorna una promessa con {text, alts:[{text,conf}]} o null; .stop() per fermare */
  listen({onInterim}={}){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){
      const msg = IS_IOS ? (isStandalone() ? "Su iPhone il microfono non funziona dall'icona sulla schermata Home: apri Parlami da Safari." : "Su iPhone serve Safari aggiornato, con Siri e Dettatura attivi.")
        : "Il riconoscimento vocale funziona in Chrome o Edge. Apri l'app con uno di questi browser.";
      const p = Promise.reject(new Error(msg)); p.stop=()=>{}; return p;
    }
    this.stop();
    const r = new SR();
    r.lang = L().code; r.interimResults = true; r.maxAlternatives = 3; r.continuous = false;
    let finals = [];
    const p = new Promise((resolve, reject)=>{
      r.onresult = e => {
        finals = []; let interim = "";
        for(let i=0;i<e.results.length;i++){
          const res = e.results[i];
          if(res.isFinal) finals.push([...res].map(a=>({text:a.transcript.trim(), conf:a.confidence||0})));
          else interim += res[0].transcript;
        }
        onInterim && onInterim((finals.map(f=>f[0].text).join(" ") + " " + interim).trim());
      };
      r.onerror = e => {
        if(e.error==="no-speech" || e.error==="aborted") return;
        const msg = {"not-allowed":"Il microfono è bloccato. Consenti l'accesso al microfono nelle impostazioni del browser.",
          "audio-capture":"Nessun microfono trovato.", "network":"Il riconoscimento vocale richiede la connessione a internet.",
          "service-not-allowed": IS_IOS ? "Su iPhone attiva Siri (Impostazioni › Siri) e la Dettatura (Impostazioni › Generali › Tastiera › Abilita Dettatura), poi riprova." : "Il riconoscimento vocale non è disponibile in questo browser."}[e.error] || ("Errore del riconoscimento vocale: "+e.error);
        reject(new Error(msg));
      };
      r.onend = () => {
        setAvatar(null);
        if(!finals.length){ resolve(null); return; }
        if(finals.length===1) resolve({text:finals[0][0].text, alts:finals[0]});
        else { const text = finals.map(f=>f[0].text).join(" "); resolve({text, alts:[{text, conf:0}]}); }
      };
    });
    p.stop = () => { try{ r.stop(); }catch(e){} };
    try{ r.start(); setAvatar("listen"); }catch(e){}
    return p;
  }
};

/* Registra la propria voce per riascoltarla (facoltativo) */
const Recorder = {
  rec:null, chunks:[], url:null, stream:null,
  async start(){
    try{
      if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return;
      this.stream = await navigator.mediaDevices.getUserMedia({audio:true});
      this.chunks = []; this.rec = new MediaRecorder(this.stream);
      this.rec.ondataavailable = e => this.chunks.push(e.data);
      this.rec.start();
    }catch(e){ this.rec = null; }
  },
  stop(){
    return new Promise(resolve=>{
      if(!this.rec || this.rec.state==="inactive"){ resolve(null); return; }
      this.rec.onstop = () => {
        if(this.url) URL.revokeObjectURL(this.url);
        this.url = URL.createObjectURL(new Blob(this.chunks, {type:this.rec.mimeType || "audio/webm"}));
        this.stream.getTracks().forEach(t=>t.stop());
        resolve(this.url);
      };
      this.rec.stop();
    });
  },
  play(){ if(this.url) new Audio(this.url).play(); }
};

/* Elenco dei provider nelle Impostazioni */
function renderProviders(){
  const box = $("#provs"); if(!box) return;
  const list = S().providers;
  box.innerHTML = list.length ? list.map((p,i)=>{ const pr = PRESETS[p.preset] || PRESETS.custom;
    const fixed = p.preset!=="custom" && p.preset!=="freellmapi";
    return `<div class="prov ${p.on?"":"off"}" data-id="${p.id}">
      <div class="head"><label class="row"><input type="checkbox" data-f="on" ${p.on?"checked":""}> <b>${i+1}. ${esc(p.name)}</b></label>
        <span class="row" style="gap:6px"><button class="iconbtn" data-a="up" aria-label="Sposta su" ${i===0?"disabled":""}>↑</button><button class="iconbtn" data-a="down" aria-label="Sposta giù" ${i===list.length-1?"disabled":""}>↓</button><button class="iconbtn" data-a="del" aria-label="Rimuovi">✕</button></span></div>
      ${pr.note?`<span class="small muted">${esc(pr.note)}</span>`:""}
      <div class="grid2">
        ${fixed ? "" : `<label class="field">Indirizzo<input data-f="base" value="${esc(p.base)}" placeholder="https://…/v1"></label>`}
        <label class="field">Chiave ${pr.keyUrl?`<a class="small" href="${pr.keyUrl}" target="_blank" rel="noopener">crea una chiave gratuita</a>`:""}<input data-f="key" type="password" value="${esc(p.key)}" autocomplete="off" placeholder="${p.preset==="freellmapi"?"chiave unificata di FreeLLMAPI":"incolla qui la chiave"}"></label>
        <label class="field">Modello<input data-f="model" value="${esc(p.model)}" list="ml-${p.id}" placeholder="vuoto = scelto in automatico"><datalist id="ml-${p.id}"></datalist></label>
      </div>
      <div class="row"><button class="btn ghost sm" data-a="test">Prova</button><button class="btn ghost sm" data-a="models">Mostra i modelli</button><span class="small" data-status></span></div>
    </div>`; }).join("") : `<p class="muted">Nessun provider. Aggiungine uno qui sotto.</p>`;
  $$(".prov", box).forEach(el=>{
    const p = list.find(x=>x.id===el.dataset.id), st = $("[data-status]", el);
    $$("[data-f]", el).forEach(inp => inp.onchange = () => {
      const f = inp.dataset.f; p[f] = inp.type==="checkbox" ? inp.checked : inp.value.trim();
      if(f==="model"){ p.manual = !!p.model; p.bad = []; }
      if(f==="key" || f==="base") delete cooldown[p.id];
      state.settings.connected = false; save(); if(f==="on") renderProviders();
    });
    $$("[data-a]", el).forEach(b => b.onclick = async () => {
      const a = b.dataset.a, i = list.indexOf(p);
      if(a==="up" || a==="down"){ const j = a==="up" ? i-1 : i+1; [list[i], list[j]] = [list[j], list[i]]; save(); renderProviders(); }
      else if(a==="del"){ if(confirm(`Rimuovere ${p.name}?`)){ list.splice(i,1); save(); route(); } }
      else if(a==="test"){ const ok = await testProvider(p); if(ok) { state.settings.connected = true; save(); } }
      else if(a==="models"){
        st.innerHTML = `<span class="spinner"></span>`;
        try{ const ids = await listModels(p); $(`#ml-${p.id}`).innerHTML = ids.map(id=>`<option value="${esc(id)}">`).join(""); st.innerHTML = `<span class="muted">${ids.length} modelli: tocca il campo Modello per sceglierne uno.</span>`; }
        catch(e){ st.innerHTML = `<span class="status-bad">${esc(e.message)}</span>`; }
      }
    });
  });
}
async function testProvider(p){
  const el = document.querySelector(`.prov[data-id="${p.id}"] [data-status]`);
  if(el) el.innerHTML = `<span class="spinner"></span>`;
  try{
    const r = await callProvider(p, [{role:"user", content:"Rispondi solo con la parola: pronto"}], {maxTokens:300, temperature:0});
    delete cooldown[p.id];
    if(el) el.innerHTML = `<span class="status-ok">Funziona · ${esc(p.model)} · “${esc(r.trim().slice(0,30))}”</span>`;
    const m = document.querySelector(`.prov[data-id="${p.id}"] [data-f="model"]`); if(m) m.value = p.model;
    return true;
  }catch(e){
    if(el) el.innerHTML = `<span class="status-bad">${esc(e.message)}</span>`;
    return false;
  }
}

function validLesson(l){
  return l && Array.isArray(l.vocab) && Array.isArray(l.exercises) && l.exercises.length >= 4;
}
function cleanExercises(list){
  return (list||[]).filter(x=>{
    switch(x?.type){
      case "choice": return Array.isArray(x.options) && x.options.length>=2 && Number.isInteger(+x.answer) && x.question;
      case "fill": return x.sentence && x.sentence.includes("___") && x.answer;
      case "translate": return x.it && x.answer;
      case "order": return Array.isArray(x.words) && x.words.length>=3;
      case "listen": case "speak": return !!x.sentence;
      default: return false;
    }
  });
}
async function getLesson(u, force=false){
  const key = unitKey(u);
  if(!force && state.lessons[key]) return state.lessons[key];
  const sys = `Sei un autore esperto di corsi di lingue. ${who()} ${JSON_ONLY}`;
  const user = `Crea una lezione di ${L().name} sul tema "${u.title}" (${u.focus}), adatta al livello ${S().level}.
Struttura JSON:
{"title":"titolo in italiano","intro":"2 frasi in italiano su cosa si impara",
"vocab":[{"word":"parola o espressione in ${L().name}","translation":"in italiano","example":"breve frase d'esempio in ${L().name}"}],
"grammar":{"title":"argomento grammaticale","explanation":"spiegazione chiara in italiano, massimo 110 parole, con un confronto con l'italiano quando aiuta","examples":[{"target":"frase in ${L().name}","it":"traduzione"}]},
"exercises":[...]}
Metti 8 voci in vocab e 3 esempi in grammar.
Gli esercizi (10 in tutto, in ordine misto, usando il lessico e la grammatica della lezione) hanno questi formati:
{"type":"choice","question":"domanda in italiano","options":["...","...","...","..."],"answer":indice_della_risposta_giusta_da_0,"explain":"perché, in italiano"}
{"type":"fill","sentence":"frase in ${L().name} con ___ al posto di UNA parola","answer":"la parola mancante","hint":"traduzione italiana della frase intera"}
{"type":"translate","it":"frase in italiano","answer":"traduzione corretta in ${L().name}"}
{"type":"order","words":["parole","della","frase","nell'ordine","corretto"],"it":"traduzione italiana"}
{"type":"listen","sentence":"frase breve in ${L().name}","it":"traduzione"}
{"type":"speak","sentence":"frase breve in ${L().name}","it":"traduzione"}
Usa: 2 choice, 2 fill, 2 translate, 1 order, 1 listen, 2 speak.`;
  const l = await ask(sys, user, {temperature:0.6, maxTokens:3000}, validLesson);
  l.exercises = cleanExercises(l.exercises);
  if(l.exercises.length < 4) throw new Error("La lezione generata non è valida. Riprova.");
  state.lessons[key] = l; save();
  return l;
}

function runLesson(main, u){
  main.innerHTML = `<button class="btn ghost sm" id="back">${icon("back")} Lezioni</button>${loadingHTML("Sto preparando la lezione…")}`;
  $("#back").onclick = () => location.hash = "lezioni";
  const go = async (force) => {
    try{
      const l = await getLesson(u, force);
      if(location.hash !== "#lezioni-"+u.id) return;
      showTheory(main, u, l);
    }catch(e){
      if(location.hash !== "#lezioni-"+u.id) return;
      main.innerHTML = `<button class="btn ghost sm" id="back">${icon("back")} Lezioni</button><div style="margin-top:16px">${errorHTML(e,"retry")}</div>`;
      $("#back").onclick = () => location.hash = "lezioni";
      $("#retry").onclick = () => { main.innerHTML = loadingHTML("Sto preparando la lezione…"); go(true); };
    }
  };
  go(false);
}

function showTheory(main, u, l){
  const g = l.grammar || {};
  main.innerHTML = `
  <div class="row" style="justify-content:space-between"><button class="btn ghost sm" id="back">${icon("back")} Lezioni</button>
  <button class="btn ghost sm" id="regen" title="Crea una versione nuova di questa lezione">Nuova versione</button></div>
  <h1 style="margin-top:18px">${esc(l.title || u.title)}</h1>

  <div class="stack">

      <div class="vocab">${l.vocab.map((v,i)=>`<div class="vcard"><button class="iconbtn" data-say="${i}" aria-label="Ascolta ${esc(v.word)}">${icon("play")}</button><div><b>${esc(v.word)}</b><span class="muted small">${esc(v.translation)}</span>${v.example?`<div class="small" style="margin-top:4px">${esc(v.example)}</div>`:""}</div></div>`).join("")}</div>
    </section>

      ${(g.examples||[]).map((x,i)=>`<div class="row" style="margin:8px 0"><button class="iconbtn" data-ex="${i}" aria-label="Ascolta">${icon("play")}</button><div><b>${esc(x.target)}</b><br><span class="muted small">${esc(x.it)}</span></div></div>`).join("")}
    </section>`:""}
    <div><button class="btn sun" id="start">Inizia gli esercizi (${l.exercises.length})</button></div>
  </div>`;

  $$("[data-say]", main).forEach(b=>b.onclick=()=>Voice.speak(l.vocab[b.dataset.say].word));
  $$("[data-ex]", main).forEach(b=>b.onclick=()=>Voice.speak(g.examples[b.dataset.ex].target));

const EX_LABEL = {choice:"Scegli la risposta", fill:"Completa la frase", translate:"Traduci per iscritto", order:"Metti in ordine le parole", listen:"Ascolta e scrivi", speak:"Leggi ad alta voce"};

function runExercises(main, u, l){
  const list = shuffle(l.exercises);
  let idx = 0, correct = 0;
  const finish = () => {
    const score = Math.round(correct/list.length*100);
    const prev = state.progress[unitKey(u)];
    state.progress[unitKey(u)] = {done:true, score: Math.max(score, prev?.score||0)};
    let added = 0;
    for(const v of l.vocab){
      if(!state.words.some(w=>w.lang===S().lang && bare(w.word)===bare(v.word))){
        state.words.push({id:uid(), lang:S().lang, word:v.word, translation:v.translation, example:v.example||"", box:1, due:today()}); added++;
      }
    }
    save(); addXP(10 + correct*2);
    main.innerHTML = `<div class="panel stack" style="text-align:center;align-items:center">
      ${avatarSVG(S().persona,120)}
      <h1>Lezione completata</h1>
      <div class="score">${score}%</div>
      <p class="muted">${correct} risposte giuste su ${list.length}. ${added ? `Ho aggiunto ${added} parole al tuo ripasso.` : ""}</p>
      <div class="row" style="justify-content:center">
        <button class="btn" id="again">Rifai gli esercizi</button>
        <button class="btn ghost" id="talk">Usale parlando con ${esc(PERSONAS[S().persona].name)}</button>
        <button class="btn ghost" id="list">Torna alle lezioni</button></div></div>`;
    $("#again").onclick = () => runExercises(main, u, l);
    $("#talk").onclick = () => { sessionStorage.setItem("parlami.topic", u.title); location.hash = "tutor"; };
    $("#list").onclick = () => location.hash = "lezioni";
  };
  const show = () => {
    if(idx >= list.length) return finish();
    const ex = list[idx];
    main.innerHTML = `
      <div class="row" style="flex-wrap:nowrap"><button class="iconbtn" id="quit" aria-label="Esci dagli esercizi">${icon("back")}</button>
      <div class="progress" style="flex:1"><i style="width:${idx/list.length*100}%"></i></div><span class="small muted">${idx+1}/${list.length}</span></div>
      <section class="panel" style="margin-top:18px"><div class="ex-type">${EX_LABEL[ex.type]}</div><div id="ex"></div><div id="fb"></div></section>`;
    $("#quit").onclick = () => showTheory(main, u, l);
    renderExercise($("#ex"), ex, (ok, fbHTML) => {
      if(ok) correct++;
      $("#fb").innerHTML = `<div class="feedback ${ok?"good":"bad"}"><h3>${ok?"Giusto!":"Non proprio"}</h3>${fbHTML||""}
        <button class="btn" id="next" style="margin-top:8px">${idx+1<list.length?"Continua":"Vedi il risultato"}</button></div>`;
      $("#next").focus();
      $("#next").onclick = () => { idx++; show(); };
    });
  };
  show();
}

function recordMistake(wrong, right, why){
  state.mistakes.unshift({lang:S().lang, wrong, right, why:why||"", date:today()});
  state.mistakes = state.mistakes.slice(0,200); save();
}

/* Disegna un esercizio e chiama done(ok, feedbackHTML) */
function renderExercise(box, ex, done){
  let answered = false;
  const finish = (ok, html) => { if(answered) return; answered = true; done(ok, html); };
  const checkBtn = `<button class="btn" id="check" style="margin-top:16px">Controlla</button>`;

  if(ex.type==="choice"){
    box.innerHTML = `<div class="ex-q">${esc(ex.question)}</div><div class="options">${ex.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
    $$(".opt", box).forEach(b=>b.onclick=()=>{
      if(answered) return;
      const i = +b.dataset.i, ok = i === +ex.answer;
      $$(".opt", box).forEach(x=>{ if(+x.dataset.i===+ex.answer) x.classList.add("right"); });
      if(!ok){ b.classList.add("wrong"); recordMistake(ex.options[i], ex.options[ex.answer], ex.explain); }
      finish(ok, ex.explain ? `<p>${esc(ex.explain)}</p>` : "");
    });
  }

  else if(ex.type==="fill"){
    const [a,b] = ex.sentence.split("___");
    box.innerHTML = `<div class="ex-q">${esc(a)}<input class="input" id="ans" style="display:inline-block;width:9em;margin:0 6px" autocomplete="off" aria-label="Parola mancante">${esc(b||"")}</div>
      ${ex.hint?`<p class="muted">${esc(ex.hint)}</p>`:""}${checkBtn}`;
    const go = () => {
      const v = $("#ans", box).value; if(!v.trim()) return;
      const ok = bare(v) === bare(ex.answer);
      const accent = ok && norm(v) !== norm(ex.answer);
      if(!ok) recordMistake(ex.sentence.replace("___", v), ex.sentence.replace("___", ex.answer), "");
      finish(ok, ok ? (accent ? `<p>Attento agli accenti: si scrive <b>${esc(ex.answer)}</b>.</p>` : "") : `<p>La risposta giusta è <b>${esc(ex.answer)}</b>.</p>`);
    };
    $("#check", box).onclick = go; $("#ans", box).onkeydown = e => { if(e.key==="Enter") go(); }; $("#ans", box).focus();
  }

  else if(ex.type==="translate"){
    box.innerHTML = `<div class="ex-q">${esc(ex.it)}</div><textarea class="input" id="ans" rows="2" placeholder="Scrivi in ${L().name.toLowerCase()}…"></textarea>${checkBtn}`;
    const go = async () => {
      const v = $("#ans", box).value.trim(); if(!v) return;
      if(bare(v) === bare(ex.answer)) return finish(true, "");
      $("#check", box).disabled = true; $("#check", box).innerHTML = `<span class="spinner"></span> Controllo…`;
      try{
        const r = await ask(`Sei un insegnante di ${L().name} preciso ma giusto. ${who()} ${JSON_ONLY}`,
          `Frase italiana: "${ex.it}"\nTraduzione di riferimento: "${ex.answer}"\nTraduzione dello studente: "${v}"\n`+
          `Valuta se la traduzione dello studente è corretta: accetta traduzioni diverse ma valide; un piccolo errore di battitura non la rende sbagliata ma va segnalato.\n`+
          `JSON: {"correct":true o false,"corrected":"la versione corretta più vicina a quella dello studente","explain":"spiegazione breve in italiano degli errori, o un commento se è corretta"}`,
          {temperature:0.2, maxTokens:400}, r=>typeof r.correct==="boolean");
        if(!r.correct) recordMistake(v, r.corrected||ex.answer, r.explain);
        finish(r.correct, `${r.explain?`<p>${esc(r.explain)}</p>`:""}${!r.correct?`<p>Versione corretta: <b>${esc(r.corrected||ex.answer)}</b></p>`:""}`);
      }catch(e){
        finish(false, `<p>${esc(e.message)}</p><p>Risposta di riferimento: <b>${esc(ex.answer)}</b></p>`);
      }
    };
    $("#check", box).onclick = go; $("#ans", box).focus();
  }

  else if(ex.type==="order"){
    const sep = NOSPACE.includes(S().lang) ? "" : " ";
    const bank = shuffle(ex.words.map((w,i)=>({w,i}))); const picked = [];
    box.innerHTML = `${ex.it?`<div class="ex-q">${esc(ex.it)}</div>`:""}<div class="tokens" id="ans" aria-label="La tua frase"></div><div class="tokens bank" id="bank"></div>${checkBtn}`;
    const draw = () => {
      $("#ans", box).innerHTML = picked.map((t,k)=>`<button class="tok" data-k="${k}">${esc(t.w)}</button>`).join("");
      $("#bank", box).innerHTML = bank.map((t,k)=>`<button class="tok ${picked.includes(t)?"used":""}" data-b="${k}">${esc(t.w)}</button>`).join("");
      $$("[data-k]", box).forEach(b=>b.onclick=()=>{ if(answered) return; picked.splice(+b.dataset.k,1); draw(); });
      $$("[data-b]", box).forEach(b=>b.onclick=()=>{ if(answered) return; const t = bank[+b.dataset.b]; if(!picked.includes(t)){ picked.push(t); draw(); } });
    };
    draw();
    $("#check", box).onclick = () => {
      if(picked.length < ex.words.length) return toast("Usa tutte le parole");
      const mine = picked.map(t=>t.w).join(sep), right = ex.words.join(sep);
      const ok = bare(mine) === bare(right);
      if(!ok) recordMistake(mine, right, "Ordine delle parole");
      finish(ok, ok ? "" : `<p>Ordine giusto: <b>${esc(right)}</b></p>`);
      Voice.speak(right);
    };
  }

  else if(ex.type==="listen"){
    box.innerHTML = `<div class="row" style="margin:10px 0 16px"><button class="btn" id="play">${icon("play")} Ascolta</button><button class="btn ghost" id="slow">${icon("slow")} Più lento</button></div>
      <input class="input" id="ans" placeholder="Scrivi quello che senti…" autocomplete="off">${checkBtn}`;
    $("#play", box).onclick = () => Voice.speak(ex.sentence);
    $("#slow", box).onclick = () => Voice.speak(ex.sentence, {rate:0.6});
    setTimeout(()=>Voice.speak(ex.sentence), 300);
    const go = () => {
      const v = $("#ans", box).value; if(!v.trim()) return;
      const r = align(ex.sentence, v), ok = r.score >= 85;
      if(!ok) recordMistake(v, ex.sentence, "Dettato");
      finish(ok, `<p>${wordsHTML(r.words)}</p><p class="small">${esc(ex.it||"")}</p>`);
    };
    $("#check", box).onclick = go; $("#ans", box).onkeydown = e => { if(e.key==="Enter") go(); };
  }

  else if(ex.type==="speak"){
    box.innerHTML = `<div class="bigsent" style="margin:8px 0">${esc(ex.sentence)}</div><p class="muted">${esc(ex.it||"")}</p>
      <div class="row" style="margin:14px 0"><button class="btn ghost" id="play">${icon("play")} Ascolta prima</button></div>
      <div class="row"><button class="mic" id="mic" aria-label="Parla">${icon("mic")}</button><span class="muted" id="heard">Premi il microfono e leggi la frase</span></div>
      <p style="margin-top:14px"><button class="btn ghost sm" id="skip">Non posso parlare ora</button></p>`;
    $("#play", box).onclick = () => Voice.speak(ex.sentence);
    $("#skip", box).onclick = () => finish(false, `<p>Esercizio saltato.</p>`);
    let session = null, tries = 0;
    $("#mic", box).onclick = async () => {
      if(answered) return;
      const mic = $("#mic", box);
      if(session){ session.stop(); return; }
      mic.classList.add("on"); mic.innerHTML = icon("stop");
      session = Voice.listen({onInterim: t => $("#heard", box).textContent = t || "Ti ascolto…"});
      try{
        const res = await session;
        if(!res){ $("#heard", box).textContent = "Non ho sentito nulla. Riprova."; return; }
        const best = res.alts.map(a=>({a, r:align(ex.sentence, a.text)})).sort((x,y)=>y.r.score-x.r.score)[0];
        tries++;
        if(best.r.score >= 70 || tries >= 3){
          finish(best.r.score >= 70, `<p>${wordsHTML(best.r.words)}</p><p class="small">Ho capito: “${esc(best.a.text)}” · punteggio ${best.r.score}%</p>`);
        } else {
          $("#heard", box).innerHTML = `${wordsHTML(best.r.words)} <span class="small">(${best.r.score}%) Riprova, tentativo ${tries} di 3</span>`;
        }
      }catch(e){ $("#heard", box).textContent = e.message; }
      finally{ session = null; mic.classList.remove("on"); mic.innerHTML = icon("mic"); }
    };
  }
}
/* ============ TUTOR (conversazione) ============ */
const Chat = {scenario:"libera", topic:"", turns:[], busy:false};

function tutorSystem(){
  const p = PERSONAS[S().persona], sc = SCENARIOS[Chat.scenario];
  return `Sei ${p.name}, tutor di ${L().name}. Carattere: ${p.style}. ${who()}
Situazione: ${sc.prompt}.${Chat.topic ? ` Cerca di far usare allo studente il lessico del tema "${Chat.topic}".` : ""}
Regole:
- La tua risposta ("reply") è SEMPRE in ${L().name}, adatta al livello ${S().level}: frasi brevi, massimo 2-3, e chiudi quasi sempre con una domanda per far parlare lo studente.
- Resta nel personaggio e nella situazione.
- Analizza solo l'ULTIMO messaggio dello studente: trova errori di grammatica, lessico, ortografia o frasi poco naturali. Se il messaggio inizia con [voce] è stato dettato: ignora maiuscole e punteggiatura.
- Se lo studente scrive in italiano o non sa una parola, aiutalo e fagli ripetere la frase in ${L().name}.
${JSON_ONLY}
Formato: {"reply":"...","translation":"traduzione italiana della tua risposta","corrections":[{"wrong":"parte sbagliata","right":"versione corretta","why":"spiegazione breve in italiano"}],"natural":"come lo direbbe un madrelingua, oppure stringa vuota"}
Se non ci sono errori, "corrections" è [] e "natural" è "".`;
}
function chatMessages(newUser){
  const msgs = [{role:"system", content:tutorSystem()}];
  for(const t of Chat.turns.slice(-14)){
    if(t.role==="u") msgs.push({role:"user", content:(t.voice?"[voce] ":"")+t.text});
    else msgs.push({role:"assistant", content:JSON.stringify({reply:t.text, translation:t.tr||"", corrections:[], natural:""})});
  }
  if(newUser) msgs.push({role:"user", content:newUser});
  return msgs;
}
async function tutorTurn(userText, voice){
  const first = !userText;
  const content = first ? "[inizio] Saluta lo studente e apri la conversazione secondo la situazione. corrections []." : (voice?"[voce] ":"")+userText;
  if(!first) Chat.turns.push({role:"u", text:userText, voice});
  let out;
  for(let a=0;a<2;a++){
    try{ out = await llm(chatMessages(content), {temperature:0.8, maxTokens:700}); if(out && out.reply) break; }
    catch(e){ if(e.network || a===1) throw e; }
  }
  if(!out || !out.reply) throw new Error("L'IA non ha risposto nel formato previsto.");
  const corr = Array.isArray(out.corrections) ? out.corrections.filter(c=>c && c.right) : [];
  if(!first && (corr.length || out.natural)){
    const last = Chat.turns[Chat.turns.length-1]; last.corr = corr; last.natural = out.natural || "";
    corr.forEach(c=>recordMistake(c.wrong, c.right, c.why));
  }
  Chat.turns.push({role:"t", text:out.reply, tr:out.translation||""});
  if(!first) addXP(corr.length ? 2 : 3);
}

RENDER.tutor = main => {
  const p = PERSONAS[S().persona];
  const topic = sessionStorage.getItem("parlami.topic");
  if(topic){ sessionStorage.removeItem("parlami.topic"); Chat.topic = topic; Chat.turns = []; }
  main.innerHTML = `
  <h1>Parla con ${esc(p.name)}</h1>
  ${needsSetup()}
  <div class="tutor">
    <aside class="tutor-side panel stack" style="align-items:center">
      ${avatarSVG(S().persona, 170)}
